<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Video Looper</title>
  
  <!-- Menggunakan FFmpeg 0.12+ UMD Build (Bebas dari masalah SharedArrayBuffer) -->
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/util.umd.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card);
      border-radius: 12px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .setting-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    select, input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--muted);
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .custom-input-box {
      display: none;
      margin-top: 8px;
    }

    .upload-box {
      border: 2px dashed var(--muted);
      border-radius: 8px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }

    .upload-box:hover {
      border-color: var(--accent);
    }

    input[type="file"] {
      display: none;
    }

    .status-container {
      margin-top: 15px;
      background: var(--bg);
      padding: 15px;
      border-radius: 6px;
      display: none;
    }

    .status-text {
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 5px;
    }

    .log-text {
      font-size: 0.8rem;
      color: var(--muted);
      max-height: 100px;
      overflow-y: auto;
      font-family: monospace;
    }

    video {
      width: 100%;
      border-radius: 8px;
      margin-top: 20px;
      display: none;
    }

    .download-btn {
      display: none;
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      margin-top: 15px;
    }

    .download-btn:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Instant Video Looper</h1>
    <p class="subtitle">Otomatis menggabungkan video tanpa re-encoding saat file dipilih.</p>

    <!-- SETTING DURASI TARGET -->
    <div class="setting-group">
      <label for="targetDuration">Target Durasi Hasil Video:</label>
      <select id="targetDuration" onchange="toggleCustomInput()">
        <option value="3600" selected>1 Jam (60 Menit)</option>
        <option value="1800">30 Menit</option>
        <option value="900">15 Menit</option>
        <option value="300">5 Menit</option>
        <option value="custom">Custom (Menit)</option>
      </select>
      
      <div class="custom-input-box" id="customInputBox">
        <input type="number" id="customMinutes" placeholder="Masukkan durasi dalam menit (misal: 45)" min="1">
      </div>
    </div>

    <!-- AREA UPLOAD -->
    <div class="upload-box" id="uploadBox" onclick="document.getElementById('videoInput').click()">
      <span id="boxLabel">Memuat engine FFmpeg... Mohon tunggu.</span>
      <input type="file" id="videoInput" accept="video/*" disabled onchange="startAutoLoop(event)">
    </div>

    <!-- STATUS PROSES -->
    <div class="status-container" id="statusContainer">
      <div class="status-text" id="statusText">Menyiapkan...</div>
      <div class="log-text" id="logText"></div>
    </div>

    <video id="previewVideo" controls></video>
    <a id="downloadBtn" class="download-btn" download="video_loop.mp4">Unduh Hasil Video</a>
  </div>

  <script>
    const { FFmpeg } = FFmpegWASM;
    const { fetchFile } = FFmpegUtil;
    let ffmpeg = null;

    const boxLabel = document.getElementById('boxLabel');
    const videoInput = document.getElementById('videoInput');
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const logText = document.getElementById('logText');
    const previewVideo = document.getElementById('previewVideo');
    const downloadBtn = document.getElementById('downloadBtn');

    function toggleCustomInput() {
      const select = document.getElementById('targetDuration');
      const customBox = document.getElementById('customInputBox');
      if (select.value === 'custom') {
        customBox.style.display = 'block';
      } else {
        customBox.style.display = 'none';
      }
    }

    // Load FFmpeg 0.12 Core secara aman tanpa butuh SharedArrayBuffer
    window.addEventListener('load', async () => {
      try {
        statusContainer.style.display = 'block';
        statusText.textContent = "Mengunduh & Menyiapkan Engine FFmpeg...";

        ffmpeg = new FFmpeg();
        
        ffmpeg.on('log', ({ message }) => {
          logText.textContent = message;
        });

        // Load core single-thread
        await ffmpeg.load({
          coreURL: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js'
        });

        statusText.textContent = "Engine Siap!";
        boxLabel.textContent = "Pilih / Drop File Video Di Sini (Otomatis Diproses)";
        videoInput.disabled = false;
      } catch (err) {
        statusText.textContent = "Gagal memuat FFmpeg engine.";
        logText.textContent = err.message;
      }
    });

    // Kalkulasi target detik berdasarkan setting pengguna
    function getTargetSeconds() {
      const selectVal = document.getElementById('targetDuration').value;
      if (selectVal === 'custom') {
        const customVal = parseFloat(document.getElementById('customMinutes').value);
        return (customVal && customVal > 0) ? customVal * 60 : 3600;
      }
      return parseInt(selectVal, 10);
    }

    async function startAutoLoop(event) {
      const file = event.target.files[0];
      if (!file) return;

      previewVideo.style.display = 'none';
      downloadBtn.style.display = 'none';
      statusContainer.style.display = 'block';
      videoInput.disabled = true;

      statusText.textContent = "Menganalisis durasi video...";

      const tempVideo = document.createElement('video');
      tempVideo.preload = 'metadata';
      tempVideo.src = URL.createObjectURL(file);

      tempVideo.onloadedmetadata = async function() {
        URL.revokeObjectURL(tempVideo.src);
        
        const durationSec = tempVideo.duration;
        const targetSec = getTargetSeconds();
        const loopCount = Math.ceil(targetSec / durationSec);

        statusText.textContent = `Memproses: Mengulang video ${loopCount}x secara instan...`;

        const inputName = 'input.mp4';
        const outputName = 'output_loop.mp4';
        
        await ffmpeg.writeFile(inputName, await fetchFile(file));

        const loopsToPerform = loopCount - 1;

        // Jalankan perintah loop tanpa re-encode
        await ffmpeg.exec([
          '-stream_loop', `${loopsToPerform}`,
          '-i', inputName,
          '-c', 'copy',
          outputName
        ]);

        statusText.textContent = "Selesai! Video hasil penggabungan siap diputar/diunduh.";

        const data = await ffmpeg.readFile(outputName);
        const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
        const videoUrl = URL.createObjectURL(videoBlob);

        previewVideo.src = videoUrl;
        previewVideo.style.display = 'block';

        downloadBtn.href = videoUrl;
        downloadBtn.style.display = 'block';

        await ffmpeg.deleteFile(inputName);
        await ffmpeg.deleteFile(outputName);
        videoInput.disabled = false;
      };
    }
  </script>
</body>
</html>
