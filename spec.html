<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KineMaster Style Video Editor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Main Container (Top Split: Left Toolbar + Preview + Right Wheel) */
    .editor-top {
      display: flex;
      flex: 1;
      height: 65%;
      position: relative;
    }

    /* Left Vertical Toolbar */
    .left-toolbar {
      width: 50px;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
      gap: 15px;
      z-index: 10;
    }

    .tool-btn {
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      color: #888888;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .tool-btn:hover {
      color: #ffffff;
    }

    /* Center Video Preview Area */
    .preview-container {
      flex: 1;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    canvas#videoPreview {
      max-width: 100%;
      max-height: 100%;
      background: #111;
      object-fit: contain;
    }

    /* Right Control Panel (Wheel Menu) */
    .right-panel {
      width: 240px;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .export-top-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      background: #222;
      border-radius: 50%;
      border: 1px solid #333;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Circular Control Wheel */
    .wheel-container {
      width: 170px;
      height: 170px;
      background-color: #1a1a1a;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .center-ai-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff2a7a, #9e00ff);
      color: white;
      border: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 42, 122, 0.4);
      z-index: 5;
    }

    .wheel-item {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none;
      border: none;
      color: #fff;
      font-size: 10px;
      cursor: pointer;
    }

    .wheel-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Radial Positions */
    .wheel-item.media { top: 10px; }
    .wheel-item.audio { right: 12px; }
    .wheel-item.rec { bottom: 10px; }
    .wheel-item.layer { left: 10px; }

    .bottom-right-controls {
      position: absolute;
      bottom: 12px;
      width: 100%;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .store-btn, .play-btn {
      width: 36px;
      height: 36px;
      background: #222;
      border-radius: 50%;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Bottom Timeline Section */
    .timeline-section {
      height: 35%;
      background-color: #181818;
      border-top: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .time-header {
      height: 24px;
      background-color: #121212;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-family: monospace;
      font-size: 11px;
    }

    .time-badge {
      background: #ff3b30;
      color: white;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .timeline-body {
      flex: 1;
      display: flex;
      overflow-x: auto;
      position: relative;
      padding: 10px 0;
    }

    .thumbnail-card {
      width: 80px;
      height: 100%;
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      margin-left: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #888;
      flex-shrink: 0;
    }

    .tracks-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 20px;
      position: relative;
    }

    /* Playhead Red Line */
    .playhead {
      position: absolute;
      left: 120px;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: #ff3b30;
      z-index: 20;
    }

    .track {
      height: 40px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
    }

    .track.video-track {
      background: #2d3748;
      border: 1px solid #4a5568;
    }

    .track.audio-track {
      background: #00897b;
      color: #ffffff;
    }

    /* Inputs Hidden */
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top Area -->
  <div class="editor-top">
    <!-- Left Toolbar -->
    <div class="left-toolbar">
      <button class="tool-btn">❮</button>
      <button class="tool-btn">↶</button>
      <button class="tool-btn">↷</button>
      <button class="tool-btn">⛶</button>
      <button class="tool-btn">⚙</button>
    </div>

    <!-- Center Canvas Preview -->
    <div class="preview-container">
      <canvas id="videoPreview" width="854" height="480"></canvas>
    </div>

    <!-- Right Control Wheel -->
    <div class="right-panel">
      <button class="export-top-btn" onclick="exportVideo()">⤓</button>

      <div class="wheel-container">
        <button class="center-ai-btn">✨ AI</button>

        <button class="wheel-item media" onclick="document.getElementById('mediaInput').click()">
          <span>📁</span>
          <span>Media</span>
        </button>

        <button class="wheel-item audio" onclick="document.getElementById('audioInput').click()">
          <span>🎵</span>
          <span>Audio</span>
        </button>

        <button class="wheel-item rec">
          <span>🎙️</span>
          <span>REC</span>
        </button>

        <button class="wheel-item layer">
          <span>📑</span>
          <span>Lapisan</span>
        </button>
      </div>

      <div class="bottom-right-controls">
        <button class="store-btn">🏪</button>
        <button class="play-btn" id="playBtn">▶</button>
      </div>
    </div>
  </div>

  <!-- Bottom Timeline Area -->
  <div class="timeline-section">
    <div class="time-header">
      <span class="time-badge">00:00:00.000</span>
      <span style="color: #666;">00:04</span>
      <span style="color: #888;">00:06:04.680</span>
    </div>

    <div class="timeline-body">
      <div class="playhead"></div>

      <div class="thumbnail-card">
        ✏️
        <span style="margin-top: 4px;">Thumbnail</span>
      </div>

      <div class="tracks-container">
        <!-- Video Track -->
        <div class="track video-track" id="videoTrackClip">
          🎬 0.25x 20260211_131546.mp4
        </div>
        <!-- Audio Track -->
        <div class="track audio-track" id="audioTrackClip">
          🎵 1.0x Dalane mudik.mp3
        </div>
      </div>
    </div>
  </div>

  <!-- File Inputs -->
  <input type="file" id="mediaInput" accept="video/*,image/*">
  <input type="file" id="audioInput" accept="audio/*">

  <script>
    const mediaInput = document.getElementById('mediaInput');
    const audioInput = document.getElementById('audioInput');
    const playBtn = document.getElementById('playBtn');
    const canvas = document.getElementById('videoPreview');
    const ctx = canvas.getContext('2d');

    let videoElement = document.createElement('video');
    let audioElement = new Audio();
    let isPlaying = false;

    // Handle Media Import
    mediaInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('videoTrackClip').innerText = `🎬 ${file.name}`;
        videoElement.src = URL.createObjectURL(file);
        videoElement.load();
        videoElement.onloadeddata = () => {
          ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
        };
      }
    });

    // Handle Audio Import
    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('audioTrackClip').innerText = `🎵 ${file.name}`;
        audioElement.src = URL.createObjectURL(file);
      }
    });

    // Toggle Play / Pause
    playBtn.addEventListener('click', () => {
      if (!isPlaying) {
        if (videoElement.src) videoElement.play();
        if (audioElement.src) audioElement.play();
        playBtn.innerText = '❚❚';
        isPlaying = true;
        renderLoop();
      } else {
        if (videoElement.src) videoElement.pause();
        if (audioElement.src) audioElement.pause();
        playBtn.innerText = '▶';
        isPlaying = false;
      }
    });

    function renderLoop() {
      if (isPlaying) {
        if (!videoElement.paused && !videoElement.ended) {
          ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
        }
        requestAnimationFrame(renderLoop);
      }
    }

    function exportVideo() {
      alert("Proses Export Video KineMaster Dimulai...");
    }
  </script>
</body>
</html>
