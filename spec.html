<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CapCut Style - Audio Spectrum WebApp Studio</title>
  <style>
    :root {
      --bg-dark: #121316;
      --panel-bg: #1a1c20;
      --panel-border: #2a2d34;
      --text-main: #e1e4e8;
      --text-muted: #858a96;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --timeline-bg: #141518;
      --input-bg: #22252b;
    }

    body.light-mode {
      --bg-dark: #f0f2f5;
      --panel-bg: #ffffff;
      --panel-border: #e1e4e8;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --timeline-bg: #eaede0;
      --input-bg: #f3f4f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* --- TOP NAVBAR --- */
    header {
      height: 50px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .brand { font-weight: bold; font-size: 1.1rem; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .nav-actions { display: flex; gap: 10px; align-items: center; }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--panel-border); }
    .btn-danger { background: #dc2626; }

    /* --- MAIN EDITOR WORKSPACE --- */
    .editor-body {
      display: flex;
      flex: 1;
      height: calc(100vh - 200px); /* Leave room for timeline */
    }

    /* 1. Sidebar Kiri (Tools) */
    .sidebar {
      width: 320px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
    }
    .tabs { display: flex; border-bottom: 1px solid var(--panel-border); }
    .tab-btn {
      flex: 1; padding: 10px; background: none; border: none;
      color: var(--text-muted); font-size: 0.8rem; font-weight: bold; cursor: pointer;
    }
    .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    .tab-content { padding: 15px; overflow-y: auto; flex: 1; display: none; }
    .tab-content.active { display: block; }

    .control-group { margin-bottom: 15px; }
    .control-group label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
    input[type="text"], select, textarea, input[type="file"] {
      width: 100%; background: var(--input-bg); border: 1px solid var(--panel-border);
      color: var(--text-main); padding: 8px; border-radius: 4px; font-size: 0.85rem; outline: none;
    }
    textarea { height: 80px; resize: none; font-family: inherit; }

    /* 2. Preview Player (Tengah) */
    .preview-area {
      flex: 1;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    .canvas-container {
      width: 100%;
      max-width: 854px; /* 16:9 Ratio Base */
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      border: 1px solid var(--panel-border);
    }
    canvas#stage { width: 100%; height: 100%; display: block; }

    /* Player Controls Bar */
    .player-controls {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: var(--panel-bg);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--panel-border);
    }
    .time-code { font-family: monospace; font-size: 0.85rem; color: var(--accent); }

    /* 3. Inspector Panel (Kanan) */
    .inspector {
      width: 280px;
      background: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      padding: 15px;
      overflow-y: auto;
    }

    /* --- TIMELINE EDITOR (BOTTOM) --- */
    .timeline-container {
      height: 150px;
      background: var(--timeline-bg);
      border-top: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
    }
    .timeline-ruler {
      height: 25px; border-bottom: 1px solid var(--panel-border);
      display: flex; align-items: center; padding: 0 10px; font-size: 0.7rem; color: var(--text-muted);
    }
    .timeline-tracks { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .track {
      height: 35px; background: var(--panel-bg); border-radius: 4px; border: 1px solid var(--panel-border);
      display: flex; align-items: center; padding: 0 10px; font-size: 0.75rem; color: var(--text-muted);
    }
    .track-clip {
      height: 80%; background: linear-gradient(90deg, #2563eb, #3b82f6);
      border-radius: 3px; display: flex; align-items: center; padding: 0 8px; color: white; font-weight: bold; width: 100%;
    }

    /* Overlay Render Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;
    }
    .modal-box { background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 25px; border-radius: 8px; text-align: center; width: 350px; }
    .progress-bar-bg { width: 100%; height: 8px; background: var(--input-bg); border-radius: 4px; margin: 15px 0; overflow: hidden; }
    .progress-bar-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.2s; }
  </style>
</head>
<body>

  <!-- TOP NAVBAR -->
  <header>
    <div class="brand">🎬 CapCut Spectrum Studio</div>
    <div class="nav-actions">
      <button id="themeToggle" class="btn btn-secondary">🌙 Dark</button>
      <button id="recordBtn" class="btn btn-secondary">🔴 Record</button>
      <button id="renderBtn" class="btn">⚡ Render Video</button>
    </div>
  </header>

  <!-- MAIN EDITOR LAYOUT -->
  <div class="editor-body">
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('media')">Media</button>
        <button class="tab-btn" onclick="switchTab('template')">Preset</button>
        <button class="tab-btn" onclick="switchTab('text')">Text/Lirik</button>
      </div>

      <!-- Tab Media -->
      <div id="tab-media" class="tab-content active">
        <div class="control-group">
          <label>Import Audio (MP3/WAV)</label>
          <input type="file" id="audioInput" accept="audio/*">
        </div>
        <div class="control-group">
          <label>Import Background Image</label>
          <input type="file" id="bgImageInput" accept="image/*">
        </div>
      </div>

      <!-- Tab Preset Spectrum -->
      <div id="tab-template" class="tab-content">
        <div class="control-group">
          <label>Pilih Spectrum Style</label>
          <select id="templateSelect"></select>
        </div>
        <div class="control-group">
          <label>Overlay Partikel Animasi</label>
          <select id="particleSelect">
            <option value="none">Tanpa Efek</option>
            <option value="rain">Hujan Salju</option>
            <option value="stars">Bintang Angkasa</option>
            <option value="icons">Music Notes</option>
          </select>
        </div>
      </div>

      <!-- Tab Text & Lirik -->
      <div id="tab-text" class="tab-content">
        <div class="control-group">
          <label>Teks Watermark</label>
          <input type="text" id="watermarkText" value="© CapCut Studio">
        </div>
        <div class="control-group">
          <label>Posisi Watermark</label>
          <select id="watermarkPos">
            <option value="top-right">Kanan Atas</option>
            <option value="top-left">Kiri Atas</option>
            <option value="bottom-right">Kanan Bawah</option>
            <option value="bottom-left">Kiri Bawah</option>
          </select>
        </div>
        <div class="control-group">
          <label>Lirik Otomatis (Format: Detik|Lirik)</label>
          <textarea id="lyricsInput" placeholder="0|Intro Musik&#10;5|Lirik lagu Dimulai..."></textarea>
        </div>
      </div>
    </div>

    <!-- CENTER PREVIEW PLAYER -->
    <div class="preview-area">
      <div class="canvas-container">
        <canvas id="stage" width="1280" height="720"></canvas>
      </div>

      <!-- Controls Bar -->
      <div class="player-controls">
        <button id="playBtn" class="btn btn-secondary">▶ Play</button>
        <button id="stopBtn" class="btn btn-secondary">⏹ Stop</button>
        <span id="timeDisplay" class="time-code">00:00 / 00:00</span>
      </div>
    </div>

    <!-- RIGHT INSPECTOR PANEL -->
    <div class="inspector">
      <h3 style="font-size: 0.9rem; margin-bottom: 15px; color: var(--accent);">Visual Settings</h3>
      <div class="control-group">
        <label>Warna Background</label>
        <input type="color" id="bgColorInput" value="#121316">
      </div>
      <div class="control-group">
        <label>Warna Spectrum 1</label>
        <input type="color" id="specColor1" value="#2563eb">
      </div>
      <div class="control-group">
        <label>Warna Spectrum 2</label>
        <input type="color" id="specColor2" value="#3b82f6">
      </div>
    </div>
  </div>

  <!-- BOTTOM TIMELINE TRACKS -->
  <div class="timeline-container">
    <div class="timeline-ruler">
      <span>00:00</span><span style="margin-left: 200px;">01:00</span><span style="margin-left: 200px;">02:00</span>
    </div>
    <div class="timeline-tracks">
      <div class="track">
        <div class="track-clip" id="audioClip">🎵 Track Audio: None Loaded</div>
      </div>
      <div class="track">
        <div class="track-clip" style="background: linear-gradient(90deg, #10b981, #059669);">📊 Track Spectrum Visualizer</div>
      </div>
    </div>
  </div>

  <!-- RENDER MODAL NOTIFICATION -->
  <div id="renderModal" class="modal">
    <div class="modal-box">
      <h3 style="margin-bottom: 10px;">Rendering Video CapCut...</h3>
      <p id="estimatedTimeText" style="font-size: 0.8rem; color: var(--text-muted);">Mengkalkulasi waktu...</p>
      <div class="progress-bar-bg">
        <div id="progressFill" class="progress-bar-fill"></div>
      </div>
      <span id="progressPercent" style="font-weight: bold; font-size: 1rem;">0%</span>
    </div>
  </div>

  <script>
    // --- APP STATE & INITIALIZATION ---
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const audioInput = document.getElementById('audioInput');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const templateSelect = document.getElementById('templateSelect');
    const particleSelect = document.getElementById('particleSelect');
    const watermarkText = document.getElementById('watermarkText');
    const watermarkPos = document.getElementById('watermarkPos');
    const lyricsInput = document.getElementById('lyricsInput');
    const bgColorInput = document.getElementById('bgColorInput');
    const bgImageInput = document.getElementById('bgImageInput');
    const specColor1 = document.getElementById('specColor1');
    const specColor2 = document.getElementById('specColor2');

    let audio = new Audio();
    let audioCtx, analyser, source;
    let isInitialized = false;
    let bgImage = null;
    let particles = [];
    let parsedLyrics = [];

    // Setup 30 Preset Options
    for(let i=1; i<=30; i++) {
      const opt = document.createElement('option');
      opt.value = i - 1; opt.textContent = `Preset Style ${i}`;
      templateSelect.appendChild(opt);
    }

    // UI Tab Switcher
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    // Dark/Light Mode Switcher
    document.getElementById('themeToggle').addEventListener('click', function() {
      document.body.classList.toggle('light-mode');
      this.textContent = document.body.classList.contains('light-mode') ? '☀️ Light' : '🌙 Dark';
    });

    // File Handlers
    audioInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
        document.getElementById('audioClip').textContent = `🎵 ${file.name}`;
      }
    });

    bgImageInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const img = new Image();
        img.onload = () => { bgImage = img; };
        img.src = URL.createObjectURL(file);
      }
    });

    // Player Controls
    playBtn.addEventListener('click', () => {
      if (!audio.src) return alert("Upload file Audio MP3 terlebih dahulu!");
      initAudio();
      if (audio.paused) {
        audio.play(); playBtn.textContent = "⏸ Pause";
      } else {
        audio.pause(); playBtn.textContent = "▶ Play";
      }
    });

    stopBtn.addEventListener('click', () => {
      audio.pause(); audio.currentTime = 0; playBtn.textContent = "▶ Play";
    });

    audio.addEventListener('timeupdate', () => {
      if(!audio.duration) return;
      timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    });

    function formatTime(s) {
      const m = Math.floor(s/60); const sec = Math.floor(s%60);
      return `${m<10?'0':''}${m}:${sec<10?'0':''}${sec}`;
    }

    function initAudio() {
      if (isInitialized) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser); analyser.connect(audioCtx.destination);
      analyser.fftSize = 256;
      isInitialized = true;
      requestAnimationFrame(renderLoop);
    }

    // Lyrics Parser
    lyricsInput.addEventListener('input', () => {
      parsedLyrics = [];
      lyricsInput.value.split('\n').forEach(line => {
        const p = line.split('|');
        if (p.length >= 2) parsedLyrics.push({ time: parseFloat(p[0]), text: p[1].trim() });
      });
      parsedLyrics.sort((a,b) => a.time - b.time);
    });

    // Main Engine Render Loop
    function renderLoop() {
      requestAnimationFrame(renderLoop);
      if (!analyser) return;

      const bufferLen = analyser.frequencyBinCount;
      const data = new Uint8Array(bufferLen);
      analyser.getByteFrequencyData(data);

      // Draw Background
      if (bgImage) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = bgColorInput.value;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Draw Spectrum
      const barWidth = (canvas.width / bufferLen) * 1.2;
      const grad = ctx.createLinearGradient(0, canvas.height, 0, 0);
      grad.addColorStop(0, specColor1.value); grad.addColorStop(1, specColor2.value);
      ctx.fillStyle = grad;

      for (let i = 0; i < bufferLen; i++) {
        let h = (data[i] / 255) * canvas.height * 0.7;
        ctx.fillRect(i * barWidth, canvas.height - h, barWidth - 3, h);
      }

      // Draw Watermark
      if (watermarkText.value) {
        ctx.save(); ctx.font = "bold 32px sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.7)";
        let x = 40, y = 60;
        if (watermarkPos.value.includes('right')) x = canvas.width - ctx.measureText(watermarkText.value).width - 40;
        if (watermarkPos.value.includes('bottom')) y = canvas.height - 40;
        ctx.fillText(watermarkText.value, x, y); ctx.restore();
      }

      // Draw Lyrics
      if (parsedLyrics.length > 0) {
        let text = "";
        for (let l of parsedLyrics) { if (audio.currentTime >= l.time) text = l.text; else break; }
        if (text) {
          ctx.save(); ctx.font = "bold 40px sans-serif"; ctx.textAlign = "center";
          ctx.fillStyle = "#ffffff"; ctx.shadowColor = "#000"; ctx.shadowBlur = 10;
          ctx.fillText(text, canvas.width / 2, canvas.height - 100); ctx.restore();
        }
      }
    }
  </script>
</body>
</html>
