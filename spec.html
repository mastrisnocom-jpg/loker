<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectrum Studio Creator Pro - Dark Mode Edition</title>
  <style>
    /* Variable Tema Warna (Default: Dark Mode) */
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --input-bg: #21262d;
      --accent-color: #58a6ff;
    }

    /* Light Mode Theme Variant */
    body.light-mode {
      --bg-color: #f6f8fa;
      --card-bg: #ffffff;
      --border-color: #d0d7de;
      --text-main: #24292f;
      --text-muted: #57606a;
      --input-bg: #f3f4f6;
      --accent-color: #0969da;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Top Bar Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Toggle Dark/Light Mode Button */
    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      border-color: var(--accent-color);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    /* Player 16:9 Aspect Ratio */
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 ratio */
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    canvas#stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Custom Player Bar Under Canvas */
    .custom-player-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      background: var(--card-bg);
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .btn-control {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-control:hover {
      border-color: var(--accent-color);
    }

    .time-display {
      font-family: monospace;
      font-size: 1rem;
      color: var(--accent-color);
      min-width: 110px;
      text-align: center;
    }

    .progress-slider {
      flex: 1;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    /* Controls Area */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input, select, textarea, button {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    input[type="color"] {
      height: 40px;
      padding: 2px;
      cursor: pointer;
    }

    textarea {
      resize: vertical;
      height: 70px;
      font-family: inherit;
    }

    .btn-group {
      grid-column: 1 / -1;
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .btn-export {
      flex: 1;
      padding: 14px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .btn-record { background: linear-gradient(135deg, #1f6feb, #238636); color: #fff; }
    .btn-render { background: linear-gradient(135deg, #8957e5, #da3633); color: #fff; }

    /* Overlay Notifikasi Render */
    .render-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .render-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 450px;
      width: 90%;
    }

    .progress-bar-container {
      width: 100%; height: 12px;
      background: var(--input-bg);
      border-radius: 6px;
      margin: 20px 0 10px 0;
      overflow: hidden;
    }

    .progress-bar { width: 0%; height: 100%; background: #238636; }
  </style>
</head>
<body>

  <!-- Header Bar & Switch Dark/Light Mode -->
  <div class="header-bar">
    <h1>Spectrum Studio Creator Pro</h1>
    <button id="themeToggle" class="theme-toggle-btn">
      <span id="themeIcon">🌙</span> <span id="themeLabel">Dark Mode</span>
    </button>
  </div>

  <div class="app-container">
    <!-- Canvas Player (16:9) -->
    <div class="player-wrapper">
      <canvas id="stage" width="1920" height="1080"></canvas>
    </div>

    <!-- Custom Control Player (Play, Stop, Progress Bar & Detikan) -->
    <div class="custom-player-bar">
      <button id="playBtn" class="btn-control">▶️ Play</button>
      <button id="stopBtn" class="btn-control">⏹️ Stop</button>
      <span id="timeDisplay" class="time-display">00:00 / 00:00</span>
      <input type="range" id="seekSlider" class="progress-slider" value="0" min="0" max="100" step="0.1">
    </div>

    <!-- Panel Pengaturan -->
    <div class="controls-grid">
      <!-- Upload Audio -->
      <div class="control-group">
        <label>1. Audio (MP3/WAV)</label>
        <input type="file" id="audioInput" accept="audio/*">
      </div>

      <!-- Template Spectrum -->
      <div class="control-group">
        <label>2. Template Spectrum</label>
        <select id="templateSelect"></select>
      </div>

      <!-- Watermark Text -->
      <div class="control-group">
        <label>3. Teks Watermark</label>
        <input type="text" id="watermarkText" value="© Channel Musik Saya">
      </div>
      <div class="control-group">
        <label>Posisi Watermark</label>
        <select id="watermarkPos">
          <option value="top-left">Kiri Atas</option>
          <option value="top-right" selected>Kanan Atas</option>
          <option value="bottom-left">Kiri Bawah</option>
          <option value="bottom-right">Kanan Bawah</option>
        </select>
      </div>

      <!-- Lirik Otomatis -->
      <div class="control-group" style="grid-column: 1 / -1;">
        <label>4. Lirik Otomatis (Format: Detik|Teks Lirik)</label>
        <textarea id="lyricsInput" placeholder="Contoh:&#10;0|Selamat datang di channel kami&#10;5|Lirik lagu baris kedua dimulai&#10;12|Reff musik dimulai di sini..."></textarea>
      </div>

      <!-- Background & Warna -->
      <div class="control-group">
        <label>5. Warna Background</label>
        <input type="color" id="bgColorInput" value="#0d1117">
      </div>
      <div class="control-group">
        <label>Gambar Background Kustom</label>
        <input type="file" id="bgImageInput" accept="image/*">
      </div>

      <div class="control-group">
        <label>6. Efek Animasi Overlay</label>
        <select id="particleSelect">
          <option value="none">Tanpa Efek</option>
          <option value="rain">Efek Hujan</option>
          <option value="snow">Efek Salju</option>
          <option value="stars">Bintang Angkasa</option>
          <option value="floating_icons">Ikon Musik Melayang</option>
        </select>
      </div>

      <div class="control-group">
        <label>Warna Spectrum 1</label>
        <input type="color" id="specColor1" value="#58a6ff">
      </div>
      <div class="control-group">
        <label>Warna Spectrum 2</label>
        <input type="color" id="specColor2" value="#238636">
      </div>

      <!-- Export Buttons -->
      <div class="btn-group">
        <button id="recordBtn" class="btn-export btn-record">🔴 Rekam Real-Time</button>
        <button id="renderBtn" class="btn-export btn-render">⚡ Render Video HD MP4/WebM (Ringan)</button>
      </div>
    </div>
  </div>

  <!-- Render Progress Overlay -->
  <div id="renderOverlay" class="render-overlay">
    <div class="render-box">
      <h2 style="color:var(--accent-color); margin-bottom:10px;">Rendering Video...</h2>
      <p id="estimatedTimeText">Menghitung estimasi render...</p>
      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <p id="progressPercent" style="font-weight:bold; font-size:1.1rem;">0%</p>
    </div>
  </div>

  <script>
    // --- Dark / Light Mode Switch Logic ---
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');

    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      
      themeIcon.textContent = isLight ? '☀️' : '🌙';
      themeLabel.textContent = isLight ? 'Light Mode' : 'Dark Mode';
    });

    // --- Elements Initialization ---
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const audioInput = document.getElementById('audioInput');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const seekSlider = document.getElementById('seekSlider');
    const templateSelect = document.getElementById('templateSelect');
    const particleSelect = document.getElementById('particleSelect');
    const watermarkText = document.getElementById('watermarkText');
    const watermarkPos = document.getElementById('watermarkPos');
    const lyricsInput = document.getElementById('lyricsInput');
    const bgColorInput = document.getElementById('bgColorInput');
    const bgImageInput = document.getElementById('bgImageInput');
    const specColor1 = document.getElementById('specColor1');
    const specColor2 = document.getElementById('specColor2');

    let audio = new Audio();
    let audioCtx, analyser, source;
    let isInitialized = false;
    let bgImage = null;
    let particles = [];
    let parsedLyrics = [];

    // --- 30 Template Options Generator ---
    const templateNames = [
      "Bars Standard", "Bars Bottom Mirror", "Bars Top Down", "Centered Equalizer", 
      "Line Spectrum", "Line Filled Curve", "Line Double Wave", "Circle Spectrum (Radial)",
      "Circle Solid Center", "Circle Inward", "Double Circle", "Dot Spectrum Linear",
      "Dot Spectrum Circle", "Glow Bars", "Split Frequency", "Floating Blocks",
      "Block Cascade", "Symmetric Pulse", "Oscilloscope Wave", "Circular Pulse Ring",
      "Triangular Waves", "Hexagon Spectrum", "Starburst Lines", "3D Look Bars",
      "Pill Dynamic Height", "Mirrored Horizon", "Minimalist Thin Lines", "Neon Duotone Bars",
      "Centripetal Rays", "Audio DNA Helix"
    ];
    templateNames.forEach((name, i) => {
      const opt = document.createElement('option');
      opt.value = i; opt.textContent = `${i + 1}. ${name}`;
      templateSelect.appendChild(opt);
    });

    // --- Audio File Input ---
    audioInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
      }
    });

    // --- Player Controls (Play, Stop, Progress Timer) ---
    playBtn.addEventListener('click', () => {
      if (!audio.src) return alert("Pilih file audio terlebih dahulu!");
      initAudioContext();
      if (audio.paused) {
        audio.play();
        playBtn.textContent = "⏸️ Pause";
      } else {
        audio.pause();
        playBtn.textContent = "▶️ Play";
      }
    });

    stopBtn.addEventListener('click', () => {
      audio.pause();
      audio.currentTime = 0;
      playBtn.textContent = "▶️ Play";
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const cur = formatTime(audio.currentTime);
      const dur = formatTime(audio.duration);
      timeDisplay.textContent = `${cur} / ${dur}`;
      seekSlider.value = (audio.currentTime / audio.duration) * 100;
    });

    seekSlider.addEventListener('input', () => {
      if (audio.duration) {
        audio.currentTime = (seekSlider.value / 100) * audio.duration;
      }
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function initAudioContext() {
      if (isInitialized) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      analyser.fftSize = 256;
      isInitialized = true;
      requestAnimationFrame(renderLoop);
    }

    // --- Lyrics Parser ---
    lyricsInput.addEventListener('input', () => {
      parsedLyrics = [];
      const lines = lyricsInput.value.split('\n');
      lines.forEach(line => {
        const parts = line.split('|');
        if (parts.length >= 2) {
          parsedLyrics.push({ time: parseFloat(parts[0].trim()), text: parts[1].trim() });
        }
      });
      parsedLyrics.sort((a, b) => a.time - b.time);
    });

    // --- Background Image Input ---
    bgImageInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const img = new Image();
        img.onload = () => { bgImage = img; };
        img.src = URL.createObjectURL(file);
      }
    });

    // --- Render Canvas Loop ---
    function renderLoop() {
      requestAnimationFrame(renderLoop);
      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      if (bgImage) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = bgColorInput.value;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      let sum = 0;
      for(let i = 0; i < bufferLength; i++) sum += dataArray[i];
      const audioAvg = sum / bufferLength / 255;

      drawParticles(particleSelect.value, audioAvg);
      renderTemplate(parseInt(templateSelect.value), dataArray, bufferLength, audioAvg);
      drawWatermark();
      drawLyrics(audio.currentTime);
    }

    function drawWatermark() {
      const text = watermarkText.value;
      if (!text) return;

      ctx.save();
      ctx.font = "bold 36px 'Segoe UI', sans-serif";
      ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
      ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
      ctx.shadowBlur = 8;

      const pos = watermarkPos.value;
      let x = 50, y = 80;

      if (pos === 'top-right') {
        x = canvas.width - ctx.measureText(text).width - 50;
      } else if (pos === 'bottom-left') {
        y = canvas.height - 60;
      } else if (pos === 'bottom-right') {
        x = canvas.width - ctx.measureText(text).width - 50;
        y = canvas.height - 60;
      }

      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function drawLyrics(currentTime) {
      if (parsedLyrics.length === 0) return;

      let activeText = "";
      for (let i = 0; i < parsedLyrics.length; i++) {
        if (currentTime >= parsedLyrics[i].time) activeText = parsedLyrics[i].text;
        else break;
      }

      if (!activeText) return;

      ctx.save();
      ctx.font = "bold 46px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#000000";
      ctx.shadowBlur = 12;
      ctx.fillText(activeText, canvas.width / 2, canvas.height - 120);
      ctx.restore();
    }

    function drawParticles(type, boost) {
      if (type === 'none') return;
      if (particles.length === 0) {
        for (let i = 0; i < 70; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 4 + 2,
            speedY: Math.random() * 3 + 1
          });
        }
      }
      ctx.save();
      ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 + boost), 0, Math.PI * 2);
        ctx.fill();
        p.y += p.speedY;
        if (p.y > canvas.height) p.y = 0;
      });
      ctx.restore();
    }

    function renderTemplate(id, data, len, avg) {
      ctx.save();
      const cx = canvas.width / 2, cy = canvas.height / 2;
      const grad = ctx.createLinearGradient(0, canvas.height, 0, 0);
      grad.addColorStop(0, specColor1.value);
      grad.addColorStop(1, specColor2.value);
      ctx.fillStyle = grad;
      ctx.strokeStyle = grad;
      ctx.lineWidth = 4;

      const barWidth = (canvas.width / len) * 1.2;

      if (id === 0) {
        for (let i = 0; i < len; i++) {
          let h = (data[i] / 255) * canvas.height * 0.75;
          ctx.fillRect(i * barWidth, canvas.height - h, barWidth - 4, h);
        }
      } else if (id === 7) {
        const radius = 220;
        for (let i = 0; i < len; i++) {
          let angle = (i / len) * Math.PI * 2;
          let amp = (data[i] / 255) * 220;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(angle)*radius, cy + Math.sin(angle)*radius);
          ctx.lineTo(cx + Math.cos(angle)*(radius + amp), cy + Math.sin(angle)*(radius + amp));
          ctx.stroke();
        }
      } else {
        for (let i = 0; i < len; i++) {
          let angle = (i / len) * Math.PI * 2;
          let h = (data[i] / 255) * 220;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(angle);
          ctx.fillRect(60, 0, 6, h);
          ctx.restore();
        }
      }
      ctx.restore();
    }
  </script>
</body>
</html>
