<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Video Editor Pro - Hybrid Fixed Player</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Third-Party CDN Libraries -->
    <script src="https://unpkg.com/fabric@5.3.0/dist/fabric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --bg-main: #121212;
            --bg-surface: #1e1e1e;
            --bg-surface-elevated: #2d2d2d;
            --primary: #bb86fc;
            --primary-variant: #3700b3;
            --secondary: #03dac6;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border: rgba(255, 255, 255, 0.12);
            --glass-bg: rgba(30, 30, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-red: #ff4081;
            --canvas-bg: #050505;
        }

        [data-theme="light"] {
            --bg-main: #f4f5f7;
            --bg-surface: #ffffff;
            --bg-surface-elevated: #e4e6eb;
            --primary: #6200ee;
            --primary-variant: #3700b3;
            --secondary: #018786;
            --text-primary: #121212;
            --text-secondary: #5f6368;
            --border: rgba(0, 0, 0, 0.12);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.08);
            --accent-red: #e91e63;
            --canvas-bg: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        .app-container {
            display: grid;
            grid-template-rows: 50px 1fr 280px;
            height: 100vh;
        }

        /* HEADER */
        .top-header {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        .brand {
            display: flex; align-items: center; gap: 8px;
            font-weight: 700; color: var(--primary); font-size: 1.1rem;
        }

        .header-actions { display: flex; gap: 8px; align-items: center; }

        .aspect-select-wrapper {
            display: flex; align-items: center; gap: 6px;
            background: var(--bg-surface-elevated); padding: 4px 10px;
            border-radius: 6px; border: 1px solid var(--border); font-size: 0.8rem;
        }

        .aspect-select-wrapper select {
            background: transparent; color: var(--text-primary);
            border: none; outline: none; font-size: 0.8rem; cursor: pointer;
        }

        .btn {
            background: var(--bg-surface-elevated); color: var(--text-primary);
            border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px;
            cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px;
        }

        .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }

        .btn-icon {
            background: none; border: none; color: var(--text-primary);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            padding: 6px; border-radius: 50%;
        }

        /* WORKSPACE */
        .workspace { display: grid; grid-template-columns: 320px 1fr; overflow: hidden; }

        .sidebar-left {
            background-color: var(--bg-surface); border-right: 1px solid var(--border);
            display: flex; overflow: hidden;
        }

        .nav-tabs {
            width: 72px; background-color: var(--bg-main); display: flex;
            flex-direction: column; align-items: center; padding-top: 12px;
            border-right: 1px solid var(--border);
        }

        .nav-btn {
            background: none; border: none; color: var(--text-secondary);
            display: flex; flex-direction: column; align-items: center;
            font-size: 9px; margin-bottom: 16px; cursor: pointer; gap: 4px; width: 100%;
        }

        .nav-btn.active { color: var(--primary); }

        .tab-content { flex: 1; overflow-y: auto; padding: 16px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .drop-zone {
            border: 2px dashed var(--border); border-radius: 8px; padding: 24px 12px;
            text-align: center; color: var(--text-secondary); background: rgba(0,0,0,0.05);
        }

        .asset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }

        .asset-item {
            background: var(--bg-surface-elevated); border: 1px solid var(--border);
            border-radius: 6px; padding: 8px; font-size: 0.75rem; display: flex;
            flex-direction: column; align-items: center; gap: 6px; cursor: pointer;
        }

        /* PREVIEW AREA & HYBRID PLAYER CONTAINER */
        .preview-area {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: var(--canvas-bg); position: relative; padding: 20px; overflow: hidden;
        }

        /* Container yang menumpuk HTML5 Video di BAWAH dan Fabric Canvas di ATAS */
        .player-container {
            position: relative;
            background-color: #000;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* HTML5 Video Layer (Di Bawah Canvas) */
        #activeVideo {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            z-index: 1;
            background: #000;
        }

        /* Fabric Overlay Canvas (Di Atas Video) */
        .canvas-container {
            position: absolute !important;
            top: 0; left: 0;
            z-index: 2 !important;
        }

        .canvas-placeholder {
            position: absolute; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: var(--text-secondary);
            font-size: 0.85rem; pointer-events: none; gap: 8px; z-index: 3;
        }

        .playback-controls {
            position: absolute; bottom: 20px; background: var(--glass-bg);
            backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
            padding: 6px 20px; border-radius: 30px; display: flex;
            align-items: center; gap: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); z-index: 50;
        }

        .time-display { font-family: monospace; font-size: 0.85rem; color: var(--text-primary); }

        /* TIMELINE */
        .timeline-container {
            background-color: var(--bg-surface); border-top: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden;
        }

        .timeline-toolbar {
            height: 40px; border-bottom: 1px solid var(--border);
            background: var(--bg-main); display: flex; align-items: center;
            padding: 0 16px; justify-content: space-between;
        }

        .zoom-slider { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-secondary); }

        .timeline-tracks-wrapper { flex: 1; overflow-x: auto; overflow-y: auto; position: relative; background-color: var(--bg-main); }

        .playhead {
            position: absolute; top: 0; bottom: 0; left: 120px; width: 2px;
            background-color: var(--accent-red); z-index: 99; pointer-events: none;
        }

        .track { display: flex; height: 60px; border-bottom: 1px solid var(--border); position: relative; }

        .track-header {
            width: 120px; min-width: 120px; background-color: var(--bg-surface-elevated);
            display: flex; align-items: center; padding: 0 10px; gap: 6px;
            font-size: 0.75rem; z-index: 10; border-right: 1px solid var(--border);
        }

        .track-content {
            flex: 1; position: relative; min-width: 2000px;
            background-image: linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 100%;
        }

        .timeline-clip {
            position: absolute; top: 6px; height: 46px;
            background: linear-gradient(135deg, var(--primary-variant), var(--primary));
            border: 1px solid var(--primary); border-radius: 4px; color: #fff;
            font-size: 0.75rem; padding: 4px 8px; overflow: hidden; cursor: grab;
        }

        .toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 999; }
        .toast { background: var(--bg-surface-elevated); color: var(--text-primary); border-left: 4px solid var(--primary); padding: 10px 16px; border-radius: 4px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="top-header">
            <div class="brand">
                <span class="material-icons-round">video_settings</span>
                <span>StudioEdit Web</span>
            </div>

            <div class="aspect-select-wrapper">
                <span class="material-icons-round" style="font-size: 18px;">aspect_ratio</span>
                <label for="aspectRatioSelect">Ukuran Canvas:</label>
                <select id="aspectRatioSelect">
                    <option value="16:9">16:9 (Landscape)</option>
                    <option value="9:16">9:16 (Portrait / TikTok)</option>
                    <option value="1:1">1:1 (Square)</option>
                    <option value="4:3">4:3 (Classic)</option>
                </select>
            </div>

            <div class="header-actions">
                <button class="btn" id="btnThemeToggle"><span class="material-icons-round" id="themeIcon">dark_mode</span> <span id="themeLabel">Dark Mode</span></button>
                <button class="btn btn-primary" id="btnExportModal"><span class="material-icons-round">file_download</span> Ekspor</button>
            </div>
        </header>

        <!-- WORKSPACE -->
        <main class="workspace">
            <aside class="sidebar-left">
                <nav class="nav-tabs">
                    <button class="nav-btn active" data-tab="media"><span class="material-icons-round">perm_media</span><span>Media</span></button>
                    <button class="nav-btn" data-tab="text"><span class="material-icons-round">title</span><span>Teks</span></button>
                    <button class="nav-btn" data-tab="stickers"><span class="material-icons-round">sentiment_satisfied_alt</span><span>Stiker</span></button>
                </nav>

                <div class="tab-content">
                    <div class="tab-pane active" id="pane-media">
                        <h3>Pustaka Media</h3>
                        <div class="drop-zone" id="dropZone">
                            <span class="material-icons-round" style="font-size:36px; color:var(--primary);">cloud_upload</span>
                            <p style="font-size:0.8rem; margin-top:6px;">Tarik & Lepas Video di sini</p>
                            <label class="btn btn-primary" style="margin-top: 12px;">
                                Pilih Berkas
                                <input type="file" id="mediaInput" multiple accept="video/*,image/*" hidden>
                            </label>
                        </div>
                        <div class="asset-grid" id="assetGrid"></div>
                    </div>

                    <div class="tab-pane" id="pane-text">
                        <h3>Tambah Teks Overlay</h3>
                        <button class="btn btn-primary" id="btnAddTextMain" style="width:100%; margin-top:10px;"><span class="material-icons-round">add</span> Judul Teks</button>
                    </div>

                    <div class="tab-pane" id="pane-stickers">
                        <h3>Stiker</h3>
                        <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:8px;">
                            <button class="btn" onclick="appEditor.addEmoji('🔥')">🔥 Api</button>
                            <button class="btn" onclick="appEditor.addEmoji('⭐')">⭐ Bintang</button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- PREVIEW AREA WITH HYBRID PLAYER -->
            <section class="preview-area">
                <div class="player-container" id="playerContainer">
                    <div class="canvas-placeholder" id="canvasPlaceholder">
                        <span class="material-icons-round" style="font-size:48px;">movie_filter</span>
                        <span>Pilih video untuk ditampilkan</span>
                    </div>
                    
                    <!-- HTML5 NATIVE VIDEO LAYER -->
                    <video id="activeVideo" playsinline muted preload="auto"></video>
                    
                    <!-- FABRIC OVERLAY CANVAS LAYER -->
                    <canvas id="overlayCanvas"></canvas>
                </div>

                <div class="playback-controls">
                    <button class="btn-icon" id="btnStop"><span class="material-icons-round">stop</span></button>
                    <button class="btn-icon" id="btnPlay"><span class="material-icons-round">play_arrow</span></button>
                    <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
                </div>
            </section>
        </main>

        <!-- TIMELINE -->
        <footer class="timeline-container">
            <div class="timeline-toolbar">
                <button class="btn-icon" id="btnDelete"><span class="material-icons-round">delete</span></button>
                <div class="zoom-slider">
                    <span class="material-icons-round">zoom_out</span>
                    <input type="range" id="timelineZoom" min="10" max="200" value="100">
                    <span class="material-icons-round">zoom_in</span>
                </div>
            </div>

            <div class="timeline-tracks-wrapper" id="timelineTracks">
                <div class="playhead" id="playhead"></div>
                <div class="track" data-track-id="v1">
                    <div class="track-header"><span class="material-icons-round">videocam</span> Video 1</div>
                    <div class="track-content" id="track-v1"></div>
                </div>
                <div class="track" data-track-id="t1">
                    <div class="track-header"><span class="material-icons-round">title</span> Overlay</div>
                    <div class="track-content" id="track-t1"></div>
                </div>
            </div>
        </footer>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        function showToast(msg, type="info") {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        class EditorEngine {
            constructor() {
                this.videoEl = document.getElementById('activeVideo');
                this.canvas = new fabric.Canvas('overlayCanvas', { selection: true });
                this.setAspectRatio("16:9");
            }

            setAspectRatio(aspect) {
                const container = document.getElementById('playerContainer');
                const maxHeight = 440;
                let w = 720, h = 405;

                if (aspect === "9:16") { h = maxHeight; w = maxHeight * (9/16); }
                else if (aspect === "1:1") { h = maxHeight; w = maxHeight; }
                else if (aspect === "4:3") { h = maxHeight; w = maxHeight * (4/3); }
                else { w = 720; h = 720 * (9/16); }

                container.style.width = `${w}px`;
                container.style.height = `${h}px`;

                this.canvas.setWidth(w);
                this.canvas.setHeight(h);
                this.canvas.renderAll();
            }

            loadMedia(url, isVideo = true) {
                document.getElementById('canvasPlaceholder').style.display = 'none';

                if (isVideo) {
                    this.videoEl.style.display = 'block';
                    this.videoEl.src = url;
                    this.videoEl.load();
                    this.videoEl.play().then(() => {
                        showToast("Video berhasil dimuat!", "success");
                    }).catch(err => {
                        // Unmute fallback jika browser memblokir audio
                        this.videoEl.muted = true;
                        this.videoEl.play();
                    });
                }
            }

            addText(str = "Teks Baru Pro") {
                const text = new fabric.IText(str, {
                    left: this.canvas.width / 4,
                    top: this.canvas.height / 3,
                    fontFamily: 'Inter',
                    fill: '#ffffff',
                    fontSize: 32,
                    cornerColor: '#bb86fc'
                });
                this.canvas.add(text);
                this.canvas.setActiveObject(text);
                this.canvas.renderAll();
            }

            addEmoji(emoji) {
                const text = new fabric.Text(emoji, {
                    left: this.canvas.width / 2,
                    top: this.canvas.height / 2,
                    fontSize: 54
                });
                this.canvas.add(text);
                this.canvas.renderAll();
            }
        }

        class TimelineManager {
            constructor() {
                this.clips = [];
                this.zoomLevel = 100;
            }

            addClip(trackId, name, duration = 10) {
                const clip = { id: Date.now(), trackId, name, duration };
                this.clips.push(clip);
                this.render();
            }

            render() {
                document.querySelectorAll('.track-content').forEach(el => el.innerHTML = '');
                this.clips.forEach(clip => {
                    const trackEl = document.getElementById(`track-${clip.trackId}`);
                    if (trackEl) {
                        const div = document.createElement('div');
                        div.className = 'timeline-clip';
                        div.style.width = `${clip.duration * (this.zoomLevel / 10)}px`;
                        div.innerText = clip.name;
                        trackEl.appendChild(div);
                    }
                });
            }
        }

        let appEditor, appTimeline;

        document.addEventListener('DOMContentLoaded', () => {
            appEditor = new EditorEngine();
            appTimeline = new TimelineManager();

            const video = document.getElementById('activeVideo');
            const playBtn = document.getElementById('btnPlay');

            // Play / Pause Synchronizer
            playBtn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                    playBtn.querySelector('.material-icons-round').innerText = 'pause';
                } else {
                    video.pause();
                    playBtn.querySelector('.material-icons-round').innerText = 'play_arrow';
                }
            });

            document.getElementById('btnStop').addEventListener('click', () => {
                video.pause();
                video.currentTime = 0;
                playBtn.querySelector('.material-icons-round').innerText = 'play_arrow';
            });

            video.addEventListener('timeupdate', () => {
                const cur = video.currentTime || 0;
                const dur = video.duration || 0;
                const pad = (n) => String(Math.floor(n)).padStart(2, '0');
                document.getElementById('timeDisplay').innerText = 
                    `${pad(cur/60)}:${pad(cur%60)} / ${pad(dur/60)}:${pad(dur%60)}`;

                // Playhead Timeline Follower
                const playhead = document.getElementById('playhead');
                playhead.style.transform = `translateX(${cur * 10}px)`;
            });

            // Aspect Ratio Handler
            document.getElementById('aspectRatioSelect').addEventListener('change', (e) => {
                appEditor.setAspectRatio(e.target.value);
            });

            // File Import
            const mediaInput = document.getElementById('mediaInput');
            mediaInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    appEditor.loadMedia(url, true);
                    appTimeline.addClip('v1', file.name, 10);

                    const grid = document.getElementById('assetGrid');
                    grid.innerHTML = `<div class="asset-item"><span class="material-icons-round">movie</span><span>${file.name}</span></div>`;
                }
            });

            // Tab Navigation
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(`pane-${btn.dataset.tab}`).classList.add('active');
                });
            });

            document.getElementById('btnAddTextMain').addEventListener('click', () => appEditor.addText('Teks Judul'));
        });
    </script>
</body>
</html>
