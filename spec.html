<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satu File Index</title>
    
    <!-- CSS ditarik di sini -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Halo World!</h1>
        <p>Semua kode ada di dalam satu file ini.</p>
        <button onclick="sapaan()">Klik Saya</button>
    </div>

    <!-- JavaScript ditarik di bagian bawah body -->
    <script>
        function sapaan() {
            alert("Tombol berhasil diklik!");
        }
    </script>

</body>
</html>
