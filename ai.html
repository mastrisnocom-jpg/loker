<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Video Lirik, AI Studio TTS & Dynamic VO</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --bg: #0f172a;
      --gold: #fbbf24;
      --cyan: #38bdf8;
      --arabic-size: 1.6rem;
      --sub-size: 1.1rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: white; padding-bottom: 120px; }

    .player-wrapper {
      width: 100%;
      max-width: 850px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .video-player-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }

    .bg-media {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6) contrast(1.05);
      z-index: 1;
      display: none;
    }
    .bg-media.active { display: block; }

    /* Canvas Overlay untuk Animasi Partikel & Visualizer Spektrum */
    #fxCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    #exportCanvas { display: none; }

    .channel-watermark {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold);
      border: 1px solid rgba(251, 191, 36, 0.4);
    }

    .info-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    .subtitle-overlay {
      position: relative;
      z-index: 10;
      width: 90%;
      max-height: 80%;
      margin: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .arabic-text {
      font-family: 'Amiri', serif;
      font-size: var(--arabic-size);
      direction: rtl;
      line-height: 1.6;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      word-wrap: break-word;
      max-width: 100%;
    }

    .sub-text {
      font-size: var(--sub-size);
      color: #f1f5f9;
      line-height: 1.5;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      word-wrap: break-word;
      max-width: 100%;
    }

    .word-span {
      display: inline-block;
      margin: 0 4px;
      color: #cbd5e1;
      opacity: 0.7;
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .word-span.active {
      color: var(--gold);
      opacity: 1;
      transform: scale(1.15) translateY(-2px);
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.9), 0 2px 8px rgba(0,0,0,1);
      font-weight: 800;
    }

    .controls-wrapper {
      max-width: 850px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .control-card {
      background: #1e293b;
      padding: 18px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      border: 1px solid #334155;
      margin-bottom: 12px;
    }

    .setting-group {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .api-link-box {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.75rem;
    }

    .api-link-btn {
      color: #38bdf8;
      text-decoration: none;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      transition: all 0.2s;
    }
    .api-link-btn:hover {
      background: rgba(56, 189, 248, 0.25);
      color: #ffffff;
    }

    label { display: block; font-size: 0.72rem; color: #94a3b8; margin-bottom: 4px; }

    select, input[type="file"], input[type="range"], input[type="text"], input[type="password"], textarea, button {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.8rem;
      outline: none;
    }

    textarea { height: 80px; font-family: monospace; }

    .btn-play { background: var(--primary); border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-play:hover { background: var(--primary-dark); }

    .btn-pause { background: #eab308; border: none; font-weight: bold; cursor: pointer; color: black; }
    .btn-pause:hover { background: #ca8a04; }

    .btn-record { background: #d97706; border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-record:hover { background: #b45309; }

    .btn-stt { background: #2563eb; border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-ai { background: #9333ea; border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-video-ai { background: #e11d48; border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-gemini-tts { background: #4f46e5; border: none; font-weight: bold; cursor: pointer; color: white; }

    .mode-panel { display: none; }
    .mode-panel.active { display: block; }

    .player-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid #334155;
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- PREVIEW PLAYER UTAMA -->
  <div class="player-wrapper">
    <div class="video-player-container" id="playerContainer">
      <div class="info-badge" id="infoBadge">Mode Lagu / Musik</div>
      <div class="channel-watermark" id="channelDisplay">▶ AUC LIRIK</div>

      <!-- BACKGROUND MEDIA -->
      <img id="bgImage" class="bg-media active" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1280&q=80" crossOrigin="anonymous">

      <video id="bgVideo" class="bg-media" loop muted playsinline crossOrigin="anonymous">
        <source id="videoSource" src="https://assets.mixkit.co/videos/preview/mixkit-clouds-and-blue-sky-2408-large.mp4" type="video/mp4">
      </video>

      <!-- CANVAS UTAMA UNTUK EFEK ANIMASI & AUDIO SPECTRUM -->
      <canvas id="fxCanvas" width="1280" height="720"></canvas>

      <!-- OVERLAY SUBTITLE DINAMIS -->
      <div class="subtitle-overlay">
        <div class="arabic-text" id="arabicDisplay"></div>
        <div class="sub-text" id="subDisplay">Siap memutar media...</div>
      </div>
    </div>
  </div>

  <canvas id="exportCanvas" width="1280" height="720"></canvas>

  <div class="controls-wrapper">
    <!-- REGISTRASI MODE, WATERMARK, ANIMASI EFEK & SPEKTRUM -->
    <div class="control-card">
      <div>
        <label>Pilih Mode Konten:</label>
        <select id="modeSelect" onchange="switchContentMode(this.value)">
          <option value="song" selected>🎵 Mode Lagu / Voice Over</option>
          <option value="quran">📖 Mode Al-Qur'an Karaoke</option>
        </select>
      </div>

      <div>
        <label>Pilih Tipe Background:</label>
        <select id="bgTypeSelect" onchange="switchBgType(this.value)">
          <option value="image" selected>🖼️ Gambar Latar</option>
          <option value="video">🎥 Video Latar</option>
        </select>
      </div>

      <div>
        <label>✨ Animasi Latar (FX Particles):</label>
        <select id="fxAnimationSelect" onchange="changeFxAnimation(this.value)">
          <option value="none">Tanpa Animasi</option>
          <option value="bokeh" selected>✨ Cahaya & Gold Bokeh</option>
          <option value="snow">❄️ Salju Jatuh (Snowfall)</option>
          <option value="dust">⭐ Partikel Bintang (Cosmic Dust)</option>
          <option value="rain">🌧️ Rintik Hujan (Raindrops)</option>
        </select>
      </div>

      <div>
        <label>📊 Audio Spectrum Visualizer:</label>
        <select id="spectrumTypeSelect" onchange="changeSpectrumType(this.value)">
          <option value="bars" selected>📶 Neon Glow Bars (Baris Modern)</option>
          <option value="wave">🌊 Smooth Waveform (Gelombang)</option>
          <option value="circle">⭕ Radial Circular Pulse (Melingkar)</option>
          <option value="none">Nonaktifkan Spektrum</option>
        </select>
      </div>

      <div style="grid-column: span 2;">
        <label>Nama Channel Youtube / Watermark:</label>
        <input type="text" id="channelNameInput" value="AUC LIRIK" oninput="updateChannelName()">
      </div>
    </div>

    <!-- PANEL PENGATURAN GOOGLE AI STUDIO API KEY -->
    <div class="control-card" style="border: 1px solid #4f46e5; background: #0f172a;">
      <div style="grid-column: span 2;">
        <label style="color: #818cf8; font-weight: bold; font-size: 0.8rem;">🔑 Google AI Studio API Key (Gemini API TTS Studio):</label>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <input type="password" id="apiKeyInput" placeholder="Tempel API Key Google AI Studio (AIzaSy...) di sini...">
          <button style="width: 120px; background: #4f46e5; font-weight: bold; cursor: pointer;" onclick="saveApiKey()">Simpan API</button>
        </div>

        <div class="api-link-box">
          <span style="color: #94a3b8;">Belum punya API key? Buat gratis di sini:</span>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" class="api-link-btn">🔑 Dapatkan API Key Google AI Studio Gratis</a>
        </div>
      </div>
    </div>

    <!-- FITUR UTAMA: GOOGLE GEMINI VOICE OVER 30 VOICES -->
    <div class="control-card" style="border: 1px solid #6366f1; background: #131722;">
      <div style="grid-column: span 2;">
        <label style="color: #a5b4fc; font-weight: bold; font-size: 0.8rem;">🎙️ Gemini Voice Over Generator (30 Suara Manusia Realistis):</label>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:6px; margin-bottom: 8px;">
          <div>
            <label>Pilih Karakter Suara Gemini (30 Nama Voice):</label>
            <select id="geminiVoiceSelect" style="border-color: #6366f1;">
              <option value="Puck">Puck -- Ceria (Upbeat / Cheerful)</option>
              <option value="Kore">Kore -- Tegas (Firm / Strong)</option>
              <option value="Fenrir">Fenrir -- Bersemangat (Excitable)</option>
              <option value="Charon">Charon -- Informatif (Informative)</option>
              <option value="Leda">Leda -- Muda (Young)</option>
              <option value="Orus">Orus -- Tegas (Firm)</option>
              <option value="Aoede">Aoede -- Santai / Ringan (Breezy)</option>
              <option value="Callirrhoe">Callirrhoe -- Santai (Relaxed)</option>
              <option value="Zephyr">Zephyr -- Cerah / Ceria (Bright)</option>
              <option value="Autonoe">Autonoe -- Cerah / Ceria (Bright)</option>
              <option value="Enceladus">Enceladus -- Berbisik / Dalam (Breathy)</option>
              <option value="Iapetus">Iapetus -- Jelas (Clear)</option>
              <option value="Umbriel">Umbriel -- Santai (Relaxed)</option>
              <option value="Algieba">Algieba -- Halus & Lembut (Smooth)</option>
              <option value="Despina">Despina -- Halus & Lembut (Smooth)</option>
              <option value="Erinome">Erinome -- Jelas & Lugas (Clear)</option>
              <option value="Algenib">Algenib -- Bertekstur / Berat (Gravelly)</option>
              <option value="Rasalgethi">Rasalgethi -- Informatif (Informative)</option>
              <option value="Laomedeia">Laomedeia -- Ceria & Bersemangat (Upbeat)</option>
              <option value="Achernar">Achernar -- Lembut (Soft)</option>
              <option value="Alnilam">Alnilam -- Tegas (Firm)</option>
              <option value="Schedar">Schedar -- Datar / Stabil (Even)</option>
              <option value="Gacrux">Gacrux -- Dewasa / Matang (Mature)</option>
              <option value="Pulcherrima">Pulcherrima -- Mengalir (Forward)</option>
              <option value="Achird" selected>Achird -- Ramah / Bersahabat (Friendly)</option>
              <option value="Zubenelgenubi">Zubenelgenubi -- Kasual / Santai (Casual)</option>
              <option value="Vindemiatrix">Vindemiatrix -- Lembut (Gentle)</option>
              <option value="Sadachbia">Sadachbia -- Hidup / Lincah (Lively)</option>
              <option value="Sadaltager">Sadaltager -- Berpengetahuan (Knowledgeable)</option>
              <option value="Sulafat">Sulafat -- Hangat (Warm)</option>
            </select>
          </div>

          <div>
            <label>Instruksi Gaya Pembacaan / Ekspresi (Prompt Style):</label>
            <input type="text" id="geminiStyleInput" value="Bacakan dengan jelas, ramah, alami, dan penuh emosi" placeholder="Contoh: Say cheerfully, spooky whisper, or read like podcast host">
          </div>
        </div>

        <div style="display:flex; gap:8px; margin-bottom: 6px;">
          <input type="text" id="geminiTtsInput" placeholder="Tulis teks narasi yang ingin diubah jadi suara Gemini..." value="Selamat datang di channel AUC LIRIK. Nikmati video estetik dan narasi yang bermakna.">
          <button class="btn-gemini-tts" id="btnGeminiTts" style="width: 200px;" onclick="generateGeminiTTS()">🎙️ Generasi Suara AI</button>
        </div>
        <small style="color: #94a3b8; font-size: 0.7rem; display: block;">*Mendukung teknologi Gemini TTS Engine resmi dengan 30 pilihan karakter suara manusia alami.</small>
      </div>
    </div>

    <!-- TOOL AI MULTI-ENGINE TEXT-TO-VIDEO GENERATOR -->
    <div class="control-card" style="border: 1px solid #e11d48; background: #131722;">
      <div style="grid-column: span 2;">
        <label style="color: #fb7185; font-weight: bold; font-size: 0.8rem;">🎬 AI Text-to-Video Generator:</label>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <input type="text" id="aiVideoPromptInput" placeholder="Ketik kata kunci video ex: clouds, ocean, nature, sunset, stars" value="clouds">
          <button class="btn-video-ai" style="width: 170px;" id="btnGenerateVideo" onclick="generateStableTextToVideo()">🎬 Generate Video</button>
        </div>
      </div>
    </div>

    <!-- TOOL AI IMAGE GENERATOR -->
    <div class="control-card" style="border: 1px solid #9333ea; background: #131722;">
      <div style="grid-column: span 2;">
        <label style="color: #c084fc; font-weight: bold; font-size: 0.8rem;">🎨 Tool AI Gambar (Text-to-Image):</label>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <input type="text" id="aiPromptInput" placeholder="Ketik deskripsi gambar..." value="beautiful nature sunset beach cinematic wallpaper">
          <button class="btn-ai" style="width: 150px;" onclick="generateAIImage()">🎨 Buat Gambar AI</button>
        </div>
      </div>
    </div>

    <!-- PANEL 1: AL-QURAN -->
    <div id="quranPanel" class="mode-panel">
      <div class="control-card">
        <div>
          <label>Pilih Surah:</label>
          <select id="surahSelect" onchange="loadSurah(this.value)">
            <option value="">Memuat surah...</option>
          </select>
        </div>

        <div>
          <label>Unggah MP3 Murattal Sendiri (Opsional):</label>
          <input type="file" id="uploadAudioQuran" accept="audio/*" onchange="handleAudioUpload(event)">
        </div>
      </div>
    </div>

    <!-- PANEL 2: LAGU & LIRIK -->
    <div id="songPanel" class="mode-panel active">
      <div class="control-card">
        <div>
          <label>1. Muat Audio dari URL Direct MP3 / Stream:</label>
          <div style="display:flex; gap:5px;">
            <input type="text" id="audioUrlInput" placeholder="https://domain.com/audio.mp3">
            <button style="width:100px; background:#0284c7; font-weight:bold; cursor:pointer;" onclick="loadAudioFromUrl()">Muat URL</button>
          </div>
        </div>

        <div>
          <label>2. Atau Unggah File MP3 Lagu / VO Full:</label>
          <input type="file" id="uploadSong" accept="audio/*" onchange="handleSongUpload(event)">
        </div>

        <div style="grid-column: span 2; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #2563eb;">
          <label style="color: #60a5fa; font-weight: bold; font-size: 0.8rem; margin-bottom: 6px;">🎙️ Tool Audio to Text -> Transkripsi Suara Langsung Tampil di Player:</label>
          <div style="display:flex; gap:8px; margin-bottom: 8px;">
            <select id="sttLangSelect" style="width: 40%;">
              <option value="id-ID" selected>🇮🇩 Bahasa Indonesia</option>
              <option value="jv-ID">🇮🇩 Bahasa Jawa</option>
              <option value="ar-SA">🇸🇦 Bahasa Arab (Qur'an/Nasyid)</option>
              <option value="en-US">🇺🇸 Bahasa Inggris</option>
            </select>
            <button class="btn-stt" id="sttBtn" onclick="toggleAudioToText()">🎙️ Mulai Transkripsi Suara</button>
          </div>
        </div>

        <div style="grid-column: span 2;">
          <label>3. Cari Lirik Lagu .LRC Otomatis (Database Internet):</label>
          <div style="display:flex; gap:5px;">
            <input type="text" id="lyricQueryInput" placeholder="Judul lagu ex: Denny Caknan Kartonyono Medot Janji">
            <button style="width:100px; background:#0d9488; font-weight:bold; cursor:pointer;" onclick="searchSongLyricsOnly()">Cari Lirik</button>
          </div>
        </div>

        <div style="grid-column: span 2;">
          <label>Editor Lirik Sync Format .LRC:</label>
          <textarea id="lrcManualInput" placeholder="[00:06.78] Lirik lagu baris pertama&#10;[00:12.45] Lirik lagu baris kedua..."></textarea>
        </div>
      </div>
    </div>

    <!-- PANEL SLIDER UKURAN FONT -->
    <div class="control-card">
      <div class="setting-group">
        <label>Ukuran Teks Arab: <b id="valArabic">1.6rem</b></label>
        <input type="range" id="sizeArabic" min="0.5" max="3.0" step="0.1" value="1.6" oninput="updateTextSettings()">
      </div>

      <div class="setting-group">
        <label>Ukuran Terjemahan / Lirik Lagu: <b id="valTrans">1.1rem</b></label>
        <input type="range" id="sizeTrans" min="0.5" max="2.5" step="0.05" value="1.1" oninput="updateTextSettings()">
      </div>
    </div>

    <!-- KONTROL PUTAR, PAUSE, DAN REKAM -->
    <div class="control-card">
      <div>
        <label>Unggah Gambar Latar (JPG/PNG):</label>
        <input type="file" id="uploadBgImg" accept="image/*" onchange="handleBgImgUpload(event)">
      </div>

      <div>
        <label>Unggah Video Latar (MP4):</label>
        <input type="file" id="uploadBgVid" accept="video/mp4" onchange="handleBgVidUpload(event)">
      </div>

      <div style="grid-column: span 2; display: flex; gap: 8px;">
        <button class="btn-play" onclick="startPlay()">▶️ Putar</button>
        <button class="btn-pause" onclick="pausePlay()">⏸️ Jeda (Pause)</button>
        <button class="btn-record" id="recBtn" onclick="toggleRecord()">🎥 Rekam Video MP4</button>
      </div>
    </div>
  </div>

  <div class="player-bar">
    <div style="font-size:0.8rem; font-weight:600; color:#38bdf8;" id="playingTitle">Siap Memutar Media</div>
    <audio id="audioElement" controls style="width:100%; max-width:600px;" crossOrigin="anonymous"></audio>
  </div>

  <script>
    const API_QURAN = 'https://api.quran.com/api/v4';
    let currentMode = 'song';
    let bgType = 'image';

    let currentVerses = [], currentAyatIndex = 0, currentSurahNum = 1;
    let songLyrics = [], currentSongLyricIndex = -1;
    let activeWords = [], currentActiveWordIndex = -1;
    let isCustomAudio = false;

    let mediaRecorder, recordedChunks = [], isRecording = false;
    let exportAnimationId, fxAnimationLoopId;

    let audioCtx = null, audioSource = null, audioDestination = null, analyser = null;
    let dataArray = null, bufferLength = 0;
    let recognition = null, isListening = false;

    let currentFxType = 'bokeh';
    let currentSpectrumType = 'bars';
    let particles = [];

    const audio = document.getElementById('audioElement');
    const bgVideo = document.getElementById('bgVideo');
    const bgImage = document.getElementById('bgImage');
    
    const fxCanvas = document.getElementById('fxCanvas');
    const fxCtx = fxCanvas.getContext('2d');

    const exportCanvas = document.getElementById('exportCanvas');
    const exportCtx = exportCanvas.getContext('2d');

    window.onload = () => {
      getSurahList();
      initSyncEngine();
      updateChannelName();
      updateTextSettings();
      initSpeechRecognition();
      initFxParticles(currentFxType);
      startFxLoop();

      const savedKey = localStorage.getItem('user_ai_api_key');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    };

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (key) {
        localStorage.setItem('user_ai_api_key', key);
        alert("API Key Google AI Studio berhasil disimpan!");
      } else {
        localStorage.removeItem('user_ai_api_key');
        alert("API Key dikosongkan.");
      }
    }

    /* WEBAUDIO ANALYSER ENGINE FOR SPECTRUM VISUALIZER */
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioSource = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);

        audioDestination = audioCtx.createMediaStreamDestination();
        audioSource.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.connect(audioDestination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    /* PARTICLE FX & SPECTRUM ENGINE */
    function changeFxAnimation(type) {
      currentFxType = type;
      initFxParticles(type);
    }

    function changeSpectrumType(type) {
      currentSpectrumType = type;
    }

    function initFxParticles(type) {
      particles = [];
      const count = type === 'rain' ? 80 : (type === 'snow' ? 60 : 40);
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * fxCanvas.width,
          y: Math.random() * fxCanvas.height,
          radius: Math.random() * (type === 'bokeh' ? 12 : 3) + 1,
          speedX: (Math.random() - 0.5) * (type === 'snow' ? 1 : 0.5),
          speedY: type === 'rain' ? Math.random() * 8 + 4 : (type === 'snow' ? Math.random() * 1.5 + 0.5 : (Math.random() - 0.5) * 0.8),
          alpha: Math.random() * 0.7 + 0.3,
          pulse: Math.random() * 0.05
        });
      }
    }

    function drawFxAndSpectrum(context, width, height) {
      context.clearRect(0, 0, width, height);

      // 1. Draw FX Particles (Salju, Bokeh, Bintang, Hujan)
      if (currentFxType !== 'none') {
        particles.forEach(p => {
          context.beginPath();
          if (currentFxType === 'rain') {
            context.strokeStyle = `rgba(186, 230, 253, ${p.alpha})`;
            context.lineWidth = 1.5;
            context.moveTo(p.x, p.y);
            context.lineTo(p.x - p.speedX * 2, p.y + p.speedY * 2);
            context.stroke();
          } else {
            context.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            if (currentFxType === 'bokeh') {
              let grad = context.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
              grad.addColorStop(0, `rgba(251, 191, 36, ${p.alpha})`);
              grad.addColorStop(1, 'rgba(251, 191, 36, 0)');
              context.fillStyle = grad;
            } else if (currentFxType === 'snow') {
              context.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
            } else if (currentFxType === 'dust') {
              context.fillStyle = `rgba(56, 189, 248, ${p.alpha})`;
            }
            context.fill();
          }

          // Move Particles
          p.x += p.speedX;
          p.y += p.speedY;

          if (currentFxType === 'rain' || currentFxType === 'snow') {
            if (p.y > height) { p.y = -10; p.x = Math.random() * width; }
          } else {
            if (p.x < 0 || p.x > width) p.speedX *= -1;
            if (p.y < 0 || p.y > height) p.speedY *= -1;
          }
        });
      }

      // 2. Draw Audio Spectrum Visualizer
      if (currentSpectrumType !== 'none' && analyser && dataArray) {
        analyser.getByteFrequencyData(dataArray);

        if (currentSpectrumType === 'bars') {
          const barWidth = (width / bufferLength) * 1.5;
          let x = (width - (bufferLength * barWidth)) / 2;

          for (let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * 120;

            let gradient = context.createLinearGradient(0, height - 120 - barHeight, 0, height - 100);
            gradient.addColorStop(0, '#38bdf8');
            gradient.addColorStop(0.5, '#fbbf24');
            gradient.addColorStop(1, 'rgba(15, 23, 42, 0.1)');

            context.fillStyle = gradient;
            context.fillRect(x, height - 100 - barHeight, barWidth - 3, barHeight);
            
            // Mirror reflection
            context.fillStyle = 'rgba(56, 189, 248, 0.15)';
            context.fillRect(x, height - 100, barWidth - 3, barHeight * 0.3);

            x += barWidth;
          }
        } 
        else if (currentSpectrumType === 'wave') {
          context.beginPath();
          context.lineWidth = 4;
          context.strokeStyle = '#38bdf8';
          const sliceWidth = width / bufferLength;
          let x = 0;

          for (let i = 0; i < bufferLength; i++) {
            const v = dataArray[i] / 128.0;
            const y = (v * 40) + (height - 120);

            if (i === 0) context.moveTo(x, y);
            else context.lineTo(x, y);

            x += sliceWidth;
          }
          context.stroke();
        } 
        else if (currentSpectrumType === 'circle') {
          const centerX = width / 2;
          const centerY = height / 2 - 30;
          let average = 0;
          for (let i = 0; i < bufferLength; i++) average += dataArray[i];
          average /= bufferLength;

          const baseRadius = 80 + (average / 255) * 40;

          context.beginPath();
          context.arc(centerX, centerY, baseRadius, 0, Math.PI * 2);
          context.lineWidth = 4;
          context.strokeStyle = 'rgba(251, 191, 36, 0.8)';
          context.shadowBlur = 15;
          context.shadowColor = '#fbbf24';
          context.stroke();
          context.shadowBlur = 0;
        }
      }
    }

    function startFxLoop() {
      drawFxAndSpectrum(fxCtx, fxCanvas.width, fxCanvas.height);
      fxAnimationLoopId = requestAnimationFrame(startFxLoop);
    }

    /* GENERASI VOICE OVER GEMINI 30 VOICES */
    async function generateGeminiTTS() {
      const apiKey = localStorage.getItem('user_ai_api_key') || document.getElementById('apiKeyInput').value.trim();
      const text = document.getElementById('geminiTtsInput').value.trim();
      const selectedVoice = document.getElementById('geminiVoiceSelect').value;
      const stylePrompt = document.getElementById('geminiStyleInput').value.trim();
      const btn = document.getElementById('btnGeminiTts');

      if (!text) return alert("Ketikkan teks narasi terlebih dahulu!");

      btn.innerText = "⏳ Memproses Suara AI...";
      btn.disabled = true;
      document.getElementById('subDisplay').innerText = "🎙️ Memproses Suara Gemini AI (" + selectedVoice + ")...";

      activeWords = text.split(' ');
      renderWordSpans(activeWords);

      try {
        if (!apiKey) {
          alert("Info: API Key tidak ditemukan. Menggunakan suara sintesis standar.");
          speakFallbackTTS(text);
          btn.innerText = "🎙️ Generasi Suara AI";
          btn.disabled = false;
          return;
        }

        const fullPrompt = `${stylePrompt}: "${text}"`;
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: fullPrompt }]
            }],
            generationConfig: {
              responseModalities: ["AUDIO", "TEXT"],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: {
                    voiceName: selectedVoice
                  }
                }
              }
            }
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message);
        }

        let audioBase64 = null;
        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
          for (let part of data.candidates[0].content.parts) {
            if (part.inlineData && part.inlineData.mimeType.startsWith('audio/')) {
              audioBase64 = part.inlineData.data;
              break;
            }
          }
        }

        if (audioBase64) {
          const audioBlob = base64ToBlob(audioBase64, 'audio/mp3');
          audio.src = URL.createObjectURL(audioBlob);
          document.getElementById('playingTitle').innerText = `Gemini VO (${selectedVoice})`;
          alert(`Suara Gemini AI (${selectedVoice}) berhasil dibuat & dimuat di Player!`);
          startPlay();
        } else {
          speakFallbackTTS(text);
          document.getElementById('playingTitle').innerText = `Gemini VO (${selectedVoice})`;
        }

      } catch (err) {
        alert("Pemberitahuan: " + err.message + ". Menggunakan sistem suara fallback.");
        speakFallbackTTS(text);
      } finally {
        btn.innerText = "🎙️ Generasi Suara AI";
        btn.disabled = false;
      }
    }

    function base64ToBlob(base64, mimeType) {
      const byteCharacters = atob(base64);
      const byteArrays = [];
      for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) {
          byteNumbers[i] = slice.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        byteArrays.push(byteArray);
      }
      return new Blob(byteArrays, { type: mimeType });
    }

    function speakFallbackTTS(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        utterance.rate = 0.9;
        utterance.pitch = 1.0;

        utterance.onboundary = (event) => {
          if (event.name === 'word') {
            const charIndex = event.charIndex;
            let currentLength = 0;
            for (let i = 0; i < activeWords.length; i++) {
              currentLength += activeWords[i].length + 1;
              if (currentLength > charIndex) {
                highlightWordSpan(i);
                break;
              }
            }
          }
        };

        utterance.onend = () => { highlightWordSpan(-1); };
        window.speechSynthesis.speak(utterance);
      }
    }

      initAudioContext();

      if ('speechSynthesis' in window && window.speechSynthesis.paused) {

    }

    function initSyncEngine() {
      audio.addEventListener('timeupdate', () => {
        if (!audio.duration) return;

        if (currentMode === 'song' && songLyrics.length > 0) {
          const currentTime = audio.currentTime;
          let activeIndex = -1;

          for (let i = 0; i < songLyrics.length; i++) {
            if (currentTime >= songLyrics[i].time) activeIndex = i;
            else break;
          }

          if (activeIndex !== -1 && activeIndex !== currentSongLyricIndex) {
            currentSongLyricIndex = activeIndex;
            activeWords = songLyrics[currentSongLyricIndex].text.split(' ');
            renderWordSpans(activeWords);

            const nextTime = (songLyrics[currentSongLyricIndex + 1]) ? songLyrics[currentSongLyricIndex + 1].time : audio.duration;
            const lineDuration = nextTime - songLyrics[currentSongLyricIndex].time;
            const timePerWord = lineDuration / activeWords.length;

            const timeInLine = currentTime - songLyrics[currentSongLyricIndex].time;
            const activeWordIndex = Math.floor(timeInLine / timePerWord);
            highlightWordSpan(activeWordIndex);
          } else if (currentSongLyricIndex !== -1) {
            const nextTime = (songLyrics[currentSongLyricIndex + 1]) ? songLyrics[currentSongLyricIndex + 1].time : audio.duration;
            const lineDuration = nextTime - songLyrics[currentSongLyricIndex].time;
            const timePerWord = lineDuration / activeWords.length;

            const timeInLine = currentTime - songLyrics[currentSongLyricIndex].time;
            const activeWordIndex = Math.floor(timeInLine / timePerWord);
            highlightWordSpan(activeWordIndex);
          }
        } else if (currentMode === 'song' && activeWords.length > 0) {
          const timePerWord = audio.duration / activeWords.length;
          const activeWordIndex = Math.floor(audio.currentTime / timePerWord);
          highlightWordSpan(activeWordIndex);
        }
      });
    }

    function parseLrc(lrcText) {
      songLyrics = [];
      const lines = lrcText.split('\n');
      const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
      lines.forEach(l => {
        const m = reg.exec(l);
        if (m) {
          const time = parseInt(m[1]) * 60 + parseInt(m[2]) + parseInt(m[3].padEnd(3, '0')) / 1000;
          const text = l.replace(reg, '').trim();
          if (text) songLyrics.push({ time, text });
        }
      });
      songLyrics.sort((a, b) => a.time - b.time);
    }

          recordedChunks = [];
          mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            cancelAnimationFrame(exportAnimationId);
            const blob = new Blob(recordedChunks, { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Render_Video_${Date.now()}.mp4`;
            a.click();
          };

          mediaRecorder.start(1000);
          isRecording = true;

          recBtn.innerText = "⏹️ Hentikan & Simpan";
          recBtn.style.background = "#dc2626";

          function exportRenderLoop() {
            if (isRecording) {
              renderFrameForExport();
              exportAnimationId = requestAnimationFrame(exportRenderLoop);
            }
          }
          exportRenderLoop();
          startPlay();
        } catch(e) {
          alert("Gagal merekam: " + e.message);
        }
      } else {
        stopAndSaveRecording();
      }
    }

    function stopAndSaveRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;

        const recBtn = document.getElementById('recBtn');
        recBtn.innerText = "🎥 Rekam Video MP4";
        recBtn.style.background = "#d97706";
      }
    }
  </script>
</body>
</html>
