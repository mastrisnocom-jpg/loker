<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Video Lirik, Multi-Engine AI Text-to-Video & Dynamic VO</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --bg: #0f172a;
      --gold: #fbbf24;
      --cyan: #38bdf8;
      --arabic-size: 1.6rem;
      --sub-size: 1.1rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: white; padding-bottom: 120px; }

    .player-wrapper {
      width: 100%;
      max-width: 850px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .video-player-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }

    .bg-media {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6) contrast(1.05);
      z-index: 1;
      display: none;
    }
    .bg-media.active { display: block; }

    #exportCanvas { display: none; }

    .channel-watermark {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold);
      border: 1px solid rgba(251, 191, 36, 0.4);
    }

    .info-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    .subtitle-overlay {
      position: relative;
      z-index: 10;
      width: 90%;
      max-height: 80%;
      margin: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .arabic-text {
      font-family: 'Amiri', serif;
      font-size: var(--arabic-size);
      direction: rtl;
      line-height: 1.6;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      word-wrap: break-word;
      max-width: 100%;
    }

    .sub-text {
      font-size: var(--sub-size);
      color: #f1f5f9;
      line-height: 1.5;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      word-wrap: break-word;
      max-width: 100%;
    }

    .word-span {
      display: inline-block;
      margin: 0 4px;
      color: #cbd5e1;
      opacity: 0.7;
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .word-span.active {
      color: var(--gold);
      opacity: 1;
      transform: scale(1.15) translateY(-2px);
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.9), 0 2px 8px rgba(0,0,0,1);
      font-weight: 800;
    }

    .controls-wrapper {
      max-width: 850px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .control-card {
      background: #1e293b;
      padding: 18px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      border: 1px solid #334155;
      margin-bottom: 12px;
    }

    .setting-group {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .api-link-box {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.75rem;
    }

    .api-link-btn {
      color: #38bdf8;
      text-decoration: none;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      transition: all 0.2s;
    }
    .api-link-btn:hover {
      background: rgba(56, 189, 248, 0.25);
      color: #ffffff;
    }

    label { display: block; font-size: 0.72rem; color: #94a3b8; margin-bottom: 4px; }

    select, input[type="file"], input[type="range"], input[type="text"], input[type="password"], textarea, button {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.8rem;
      outline: none;
    }

    textarea { height: 80px; font-family: monospace; }

    .btn-play { background: var(--primary); border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-play:hover { background: var(--primary-dark); }

    .btn-record { background: #d97706; border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-record:hover { background: #b45309; }

    .btn-stt { background: #2563eb; border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-ai { background: #9333ea; border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-video-ai { background: #e11d48; border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-tts { background: #059669; border: none; font-weight: bold; cursor: pointer; color: white; }

    .mode-panel { display: none; }
    .mode-panel.active { display: block; }

    .player-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid #334155;
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- PREVIEW PLAYER UTAMA -->
  <div class="player-wrapper">
    <div class="video-player-container" id="playerContainer">
      <div class="info-badge" id="infoBadge">Mode Lagu / Musik</div>
      <div class="channel-watermark" id="channelDisplay">▶ AUC LIRIK</div>

      <!-- BACKGROUND MEDIA -->
      <img id="bgImage" class="bg-media active" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1280&q=80" crossOrigin="anonymous">

      <video id="bgVideo" class="bg-media" autoplay loop muted playsinline crossOrigin="anonymous">
        <source id="videoSource" src="https://assets.mixkit.co/videos/preview/mixkit-clouds-and-blue-sky-2408-large.mp4" type="video/mp4">
      </video>

      <!-- OVERLAY SUBTITLE DINAMIS -->
      <div class="subtitle-overlay">
        <div class="arabic-text" id="arabicDisplay"></div>
        <div class="sub-text" id="subDisplay">Siap memutar media...</div>
      </div>
    </div>
  </div>

  <canvas id="exportCanvas" width="1280" height="720"></canvas>

  <div class="controls-wrapper">
    <!-- REGISTRASI MODE & WATERMARK -->
    <div class="control-card">
      <div>
        <label>Pilih Mode Konten:</label>
        <select id="modeSelect" onchange="switchContentMode(this.value)">
          <option value="song" selected>🎵 Mode Lagu / Voice Over</option>
          <option value="quran">📖 Mode Al-Qur'an Karaoke</option>
        </select>
      </div>

      <div>
        <label>Pilih Tipe Background:</label>
        <select id="bgTypeSelect" onchange="switchBgType(this.value)">
          <option value="image" selected>🖼️ Gambar Latar</option>
          <option value="video">🎥 Video Latar</option>
        </select>
      </div>

      <div>
        <label>Nama Channel Youtube / Watermark:</label>
        <input type="text" id="channelNameInput" value="AUC LIRIK" oninput="updateChannelName()">
      </div>
    </div>

    <!-- PANEL PENGATURAN API KEY DENGAN LINK PEMBUATAN API KEY RESMI -->
    <div class="control-card" style="border: 1px solid #3b82f6; background: #0f172a;">
      <div style="grid-column: span 2;">
        <label style="color: #60a5fa; font-weight: bold; font-size: 0.8rem;">🔑 Pengaturan API Key AI Kustom:</label>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <input type="password" id="apiKeyInput" placeholder="Tempel API Key OpenAI / Gemini / HuggingFace di sini...">
          <button style="width: 120px; background: #2563eb; font-weight: bold;" onclick="saveApiKey()">Simpan API</button>
        </div>

        <!-- LINK PEMBUATAN API KEY GRATIS/RESMI -->
        <div class="api-link-box">
          <span style="color: #94a3b8;">Belum punya API key? Buat gratis di sini:</span>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" class="api-link-btn">🔑 Google Gemini API</a>
          <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener" class="api-link-btn">🔑 OpenAI API</a>
          <a href="https://huggingface.co/settings/tokens" target="_blank" rel="noopener" class="api-link-btn">🔑 HuggingFace Token</a>
          <a href="https://console.groq.com/keys" target="_blank" rel="noopener" class="api-link-btn">🔑 Groq AI API</a>
        </div>
      </div>
    </div>

    <!-- TOOL AI MULTI-ENGINE TEXT-TO-VIDEO GENERATOR -->
    <div class="control-card" style="border: 1px solid #e11d48; background: #131722;">
      <div style="grid-column: span 2;">
        <label style="color: #fb7185; font-weight: bold; font-size: 0.8rem;">🎬 Multi-Engine AI Text-to-Video Generator:</label>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <input type="text" id="aiVideoPromptInput" placeholder="Ketik kata kunci video ex: clouds ocean sunset, nature river, islamic mosque night" value="clouds ocean sunset">
          <button class="btn-video-ai" style="width: 170px;" id="btnGenerateVideo" onclick="generateAIVideoMultiEngine()">🎬 Generate Video</button>
        </div>
      </div>
    </div>

    <!-- TOOL AI IMAGE GENERATOR -->
    <div class="control-card" style="border: 1px solid #9333ea; background: #131722;">
      <div style="grid-column: span 2;">
        <label style="color: #c084fc; font-weight: bold; font-size: 0.8rem;">🎨 Tool AI Gambar (Text-to-Image) -> Dipasang di Player:</label>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <input type="text" id="aiPromptInput" placeholder="Ketik deskripsi gambar..." value="beautiful nature sunset beach cinematic wallpaper">
          <button class="btn-ai" style="width: 150px;" onclick="generateAIImage()">🎨 Buat Gambar AI</button>
        </div>
      </div>
    </div>

    <!-- TOOL TEXT TO SPEECH / VO -->
    <div class="control-card" style="border: 1px solid #059669; background: #131722;">
      <div style="grid-column: span 2;">
        <label style="color: #34d399; font-weight: bold; font-size: 0.8rem;">🗣️ Text to Speech / Voice Over (Sinkron Kata per Kata di Player):</label>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <input type="text" id="ttsTextInput" placeholder="Tulis kalimat..." value="Selamat datang di pembuat video otomatis dinamis">
          <select id="ttsVoiceSelect" style="width: 35%;">
            <option value="id-ID">🇮🇩 Bahasa Indonesia</option>
            <option value="en-US">🇺🇸 Bahasa Inggris</option>
          </select>
          <button class="btn-tts" style="width: 160px;" onclick="speakTTSDynamic()">🗣️ Ucapkan VO Dinamis</button>
        </div>
      </div>
    </div>

    <!-- PANEL 1: AL-QURAN -->
    <div id="quranPanel" class="mode-panel">
      <div class="control-card">
        <div>
          <label>Pilih Surah:</label>
          <select id="surahSelect" onchange="loadSurah(this.value)">
            <option value="">Memuat surah...</option>
          </select>
        </div>

        <div>
          <label>Unggah MP3 Murattal Sendiri (Opsional):</label>
          <input type="file" id="uploadAudioQuran" accept="audio/*" onchange="handleAudioUpload(event)">
        </div>
      </div>
    </div>

    <!-- PANEL 2: LAGU & LIRIK -->
    <div id="songPanel" class="mode-panel active">
      <div class="control-card">
        <div>
          <label>1. Muat Audio dari URL Direct MP3 / Stream:</label>
          <div style="display:flex; gap:5px;">
            <input type="text" id="audioUrlInput" placeholder="https://domain.com/audio.mp3">
            <button style="width:100px; background:#0284c7; font-weight:bold;" onclick="loadAudioFromUrl()">Muat URL</button>
          </div>
        </div>

        <div>
          <label>2. Atau Unggah File MP3 Lagu / VO Full:</label>
          <input type="file" id="uploadSong" accept="audio/*" onchange="handleSongUpload(event)">
        </div>

        <div style="grid-column: span 2; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #2563eb;">
          <label style="color: #60a5fa; font-weight: bold; font-size: 0.8rem; margin-bottom: 6px;">🎙️ Tool Audio to Text -> Transkripsi Suara Langsung Tampil di Player:</label>
          <div style="display:flex; gap:8px; margin-bottom: 8px;">
            <select id="sttLangSelect" style="width: 40%;">
              <option value="id-ID" selected>🇮🇩 Bahasa Indonesia</option>
              <option value="jv-ID">🇮🇩 Bahasa Jawa</option>
              <option value="ar-SA">🇸🇦 Bahasa Arab (Qur'an/Nasyid)</option>
              <option value="en-US">🇺🇸 Bahasa Inggris</option>
            </select>
            <button class="btn-stt" id="sttBtn" onclick="toggleAudioToText()">🎙️ Mulai Transkripsi Suara</button>
          </div>
        </div>

        <div style="grid-column: span 2;">
          <label>3. Cari Lirik Lagu .LRC Otomatis (Database Internet):</label>
          <div style="display:flex; gap:5px;">
            <input type="text" id="lyricQueryInput" placeholder="Judul lagu ex: Denny Caknan Kartonyono Medot Janji">
            <button style="width:100px; background:#0d9488; font-weight:bold;" onclick="searchSongLyricsOnly()">Cari Lirik</button>
          </div>
        </div>

        <div style="grid-column: span 2;">
          <label>Editor Lirik Sync Format .LRC:</label>
          <textarea id="lrcManualInput" placeholder="[00:06.78] Lirik lagu baris pertama&#10;[00:12.45] Lirik lagu baris kedua..."></textarea>
        </div>
      </div>
    </div>

    <!-- PANEL SLIDER UKURAN FONT -->
    <div class="control-card">
      <div class="setting-group">
        <label>Ukuran Teks Arab: <b id="valArabic">1.6rem</b></label>
        <input type="range" id="sizeArabic" min="0.5" max="3.0" step="0.1" value="1.6" oninput="updateTextSettings()">
      </div>

      <div class="setting-group">
        <label>Ukuran Terjemahan / Lirik Lagu: <b id="valTrans">1.1rem</b></label>
        <input type="range" id="sizeTrans" min="0.5" max="2.5" step="0.05" value="1.1" oninput="updateTextSettings()">
      </div>
    </div>

    <!-- EKSPOR KONTROL REKAM MANUAL -->
    <div class="control-card">
      <div>
        <label>Unggah Gambar Latar Kustom (JPG/PNG):</label>
        <input type="file" id="uploadBgImg" accept="image/*" onchange="handleBgImgUpload(event)">
      </div>

      <div>
        <label>Unggah Video Latar Kustom (MP4):</label>
        <input type="file" id="uploadBgVid" accept="video/mp4" onchange="handleBgVidUpload(event)">
      </div>

      <div>
        <label>1. Putar Pemutar Utama:</label>
        <button class="btn-play" onclick="startPlay()">▶️ Putar Player</button>
      </div>

      <div>
        <label>2. Rekam Seluruh Output Player:</label>
        <button class="btn-record" id="recBtn" onclick="toggleRecord()">🎥 Rekam & Render Video MP4</button>
      </div>
    </div>
  </div>

  <div class="player-bar">
    <div style="font-size:0.8rem; font-weight:600; color:#38bdf8;" id="playingTitle">Siap Memutar Media</div>
    <audio id="audioElement" controls style="width:100%; max-width:600px;" crossOrigin="anonymous"></audio>
  </div>

  <script>
    const API_QURAN = 'https://api.quran.com/api/v4';
    let currentMode = 'song';
    let bgType = 'image';

    let currentVerses = [], currentAyatIndex = 0, currentSurahNum = 1;
    let songLyrics = [], currentSongLyricIndex = -1;
    let activeWords = [], currentActiveWordIndex = -1;
    let isCustomAudio = false;

    let mediaRecorder, recordedChunks = [], isRecording = false;
    let canvasAnimationId;

    let audioCtx, audioSource, audioDestination;
    let recognition = null, isListening = false;

    const audio = document.getElementById('audioElement');
    const bgVideo = document.getElementById('bgVideo');
    const bgImage = document.getElementById('bgImage');
    const canvas = document.getElementById('exportCanvas');
    const ctx = canvas.getContext('2d');

    window.onload = () => {
      getSurahList();
      initSyncEngine();
      updateChannelName();
      updateTextSettings();
      initSpeechRecognition();
      
      // Auto fill key jika pernah disimpan
      const savedKey = localStorage.getItem('user_ai_api_key');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    };

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (key) {
        localStorage.setItem('user_ai_api_key', key);
        alert("API Key berhasil disimpan di browser lokal!");
      } else {
        localStorage.removeItem('user_ai_api_key');
        alert("API Key dikosongkan. Menggunakan server AI bawaan.");
      }
    }

    /* ENGINE MULTI-FALLBACK UNTUK AI TEXT-TO-VIDEO */
    async function generateAIVideoMultiEngine() {
      const prompt = document.getElementById('aiVideoPromptInput').value.trim();
      const btn = document.getElementById('btnGenerateVideo');

      if (!prompt) return alert("Masukkan prompt / kata kunci video terlebih dahulu.");

      document.getElementById('subDisplay').innerText = "🎬 Sedang mencari & membuat AI Video...";
      btn.innerText = "⏳ Memproses Video...";
      btn.disabled = true;

      const seed = Math.floor(Math.random() * 100000);
      const encPrompt = encodeURIComponent(prompt);

      const videoSources = [
        `https://assets.mixkit.co/videos/preview/mixkit-${encPrompt}-large.mp4`,
        `https://video.pollinations.ai/prompt/${encPrompt}?width=1280&height=720&seed=${seed}`,
        `https://assets.mixkit.co/videos/preview/mixkit-clouds-and-blue-sky-2408-large.mp4`
      ];

      let success = false;

      for (let url of videoSources) {
        try {
          const loaded = await testVideoUrl(url);
          if (loaded) {
            bgVideo.src = url;
            switchBgType('video');
            document.getElementById('bgTypeSelect').value = 'video';
            bgVideo.play().catch(() => {});
            document.getElementById('subDisplay').innerText = "Video AI dipasang!";
            success = true;
            break;
          }
        } catch (e) {
          continue;
        }
      }

      if (!success) {
        bgVideo.src = "https://assets.mixkit.co/videos/preview/mixkit-clouds-and-blue-sky-2408-large.mp4";
        switchBgType('video');
        document.getElementById('bgTypeSelect').value = 'video';
        bgVideo.play().catch(() => {});
        document.getElementById('subDisplay').innerText = "Video Latar standar dipasang.";
      }

      btn.innerText = "🎬 Generate Video";
      btn.disabled = false;
    }

    function testVideoUrl(url) {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        v.src = url;
        v.onloadeddata = () => resolve(true);
        v.onerror = () => resolve(false);
        setTimeout(() => resolve(false), 5000);
      });
    }

    /* FITUR VO DINAMIS */
    function speakTTSDynamic() {
      const text = document.getElementById('ttsTextInput').value.trim();
      const lang = document.getElementById('ttsVoiceSelect').value;

      if (!text) return alert("Ketik teks kalimat terlebih dahulu.");

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.9;

        activeWords = text.split(' ');
        renderWordSpans(activeWords);

        utterance.onboundary = (event) => {
          if (event.name === 'word') {
            const charIndex = event.charIndex;
            let currentLength = 0;
            for (let i = 0; i < activeWords.length; i++) {
              currentLength += activeWords[i].length + 1;
              if (currentLength > charIndex) {
                highlightWordSpan(i);
                break;
              }
            }
          }
        };

        utterance.onend = () => {
          highlightWordSpan(-1);
        };

        window.speechSynthesis.speak(utterance);
      } else {
        alert("Browser Anda tidak mendukung Web Speech Synthesis.");
      }
    }

    function renderWordSpans(wordsArray) {
      const subContainer = document.getElementById('subDisplay');
      subContainer.innerHTML = '';
      wordsArray.forEach((word, index) => {
        const span = document.createElement('span');
        span.className = 'word-span';
        span.id = `wspan-${index}`;
        span.innerText = word;
        subContainer.appendChild(span);
      });
    }

    function highlightWordSpan(activeIndex) {
      currentActiveWordIndex = activeIndex;
      const spans = document.querySelectorAll('.word-span');
      spans.forEach((s, idx) => {
        if (idx === activeIndex) {
          s.classList.add('active');
        } else {
          s.classList.remove('active');
        }
      });
    }

    function generateAIImage() {
      const prompt = document.getElementById('aiPromptInput').value.trim();
      if (!prompt) return alert("Masukkan deskripsi/prompt gambar terlebih dahulu.");

      document.getElementById('subDisplay').innerText = "🎨 Sedang membuat gambar AI...";

      const seed = Math.floor(Math.random() * 1000000);
      const encodedPrompt = encodeURIComponent(prompt);
      const aiImageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1280&height=720&seed=${seed}&nologo=true`;

      const tempImg = new Image();
      tempImg.crossOrigin = "anonymous";
      tempImg.src = aiImageUrl;

      tempImg.onload = () => {
        bgImage.src = aiImageUrl;
        switchBgType('image');
        document.getElementById('bgTypeSelect').value = 'image';
        document.getElementById('subDisplay').innerText = "Gambar AI dipasang!";
      };
    }

    function updateChannelName() {
      const name = document.getElementById('channelNameInput').value || "AUC LIRIK";
      document.getElementById('channelDisplay').innerHTML = `▶ ${name}`;
    }

    function updateTextSettings() {
      const arabicSize = document.getElementById('sizeArabic').value + 'rem';
      const transSize = document.getElementById('sizeTrans').value + 'rem';

      document.getElementById('valArabic').innerText = arabicSize;
      document.getElementById('valTrans').innerText = transSize;

      document.documentElement.style.setProperty('--arabic-size', arabicSize);
      document.documentElement.style.setProperty('--sub-size', transSize);
    }

    function switchContentMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-panel').forEach(e => e.classList.remove('active'));

      if (mode === 'quran') {
        document.getElementById('quranPanel').classList.add('active');
        document.getElementById('infoBadge').innerText = "Mode Al-Qur'an";
        renderAyat(0);
      } else {
        document.getElementById('songPanel').classList.add('active');
        document.getElementById('infoBadge').innerText = "Mode Lagu / Musik";
        document.getElementById('arabicDisplay').innerHTML = "";
        document.getElementById('subDisplay').innerText = "Silakan unggah MP3 atau muat lagu...";
      }
    }

    function switchBgType(type) {
      bgType = type;
      bgVideo.classList.remove('active');
      bgImage.classList.remove('active');

      if (type === 'video') {
        bgVideo.classList.add('active');
        bgVideo.play().catch(() => {});
      } else {
        bgImage.classList.add('active');
      }
    }

    function handleBgImgUpload(e) {
      const file = e.target.files[0];
      if (file) {
        bgImage.src = URL.createObjectURL(file);
        document.getElementById('bgTypeSelect').value = 'image';
        switchBgType('image');
      }
    }

    function handleBgVidUpload(e) {
      const file = e.target.files[0];
      if (file) {
        bgVideo.src = URL.createObjectURL(file);
        document.getElementById('bgTypeSelect').value = 'video';
        switchBgType('video');
      }
    }

    function handleSongUpload(e) {
      const file = e.target.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
        document.getElementById('playingTitle').innerText = `Lagu: ${file.name}`;
        alert("File MP3 berhasil dimuat!");
      }
    }

    function handleAudioUpload(e) {
      const file = e.target.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
        isCustomAudio = true;
      }
    }

    function loadAudioFromUrl() {
      const url = document.getElementById('audioUrlInput').value.trim();
      if (!url) return alert("Masukkan URL MP3 valid terlebih dahulu.");
      audio.src = url;
      document.getElementById('playingTitle').innerText = "Audio dari Link Direct";
      alert("URL MP3 dimuat!");
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const lastResultIndex = event.results.length - 1;
        const transcript = event.results[lastResultIndex][0].transcript.trim();

        if (transcript) {
          const currentTime = audio.currentTime;
          const mins = Math.floor(currentTime / 60);
          const secs = Math.floor(currentTime % 60);
          const ms = Math.floor((currentTime % 1) * 100);

          const timestamp = `[${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(ms).padStart(2, '0')}]`;
          const formattedLine = `${timestamp} ${transcript}\n`;

          const textarea = document.getElementById('lrcManualInput');
          textarea.value += formattedLine;

          renderWordSpans(transcript.split(' '));
          parseLrc(textarea.value);
        }
      };

      recognition.onend = () => {
        if (isListening) recognition.start();
        else {
          const btn = document.getElementById('sttBtn');
          btn.innerText = "🎙️ Mulai Transkripsi Suara";
        }
      };
    }

    function toggleAudioToText() {
      if (!recognition) return alert("Gunakan browser Chrome / Edge untuk Speech to Text.");

      const btn = document.getElementById('sttBtn');
      const lang = document.getElementById('sttLangSelect').value;

      if (!isListening) {
        recognition.lang = lang;
        recognition.start();
        isListening = true;
        btn.innerText = "🔴 Transkripsi Aktif...";
      } else {
        isListening = false;
        recognition.stop();
        btn.innerText = "🎙️ Mulai Transkripsi Suara";
      }
    }

    async function searchSongLyricsOnly() {
      const q = document.getElementById('lyricQueryInput').value.trim();
      if (!q) return alert("Ketik kata kunci nama penyanyi / judul lagu.");

      document.getElementById('subDisplay').innerText = "Mencari lirik...";
      try {
        const res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (data.length > 0 && data[0].syncedLyrics) {
          document.getElementById('lrcManualInput').value = data[0].syncedLyrics;
          parseLrc(data[0].syncedLyrics);
          alert(`Lirik berhasil dimuat untuk: ${data[0].trackName}`);
        } else {
          alert("Lirik tersinkronisasi tidak ditemukan di database.");
        }
      } catch (e) {
        alert("Gagal terhubung ke server lirik.");
      }
    }

    function startPlay() {
      if (!audio.src) return alert("Pilih file MP3 atau muat lagu terlebih dahulu!");

      if (currentMode === 'song' && document.getElementById('lrcManualInput').value) {
        parseLrc(document.getElementById('lrcManualInput').value);
      }

      audio.play().then(() => {
        if (bgType === 'video') bgVideo.play().catch(() => {});
        document.getElementById('playingTitle').innerText = "▶ Sedang Memutar...";
      });
    }

    function initSyncEngine() {
      audio.addEventListener('timeupdate', () => {
        if (!audio.duration) return;

        const currentMs = audio.currentTime * 1000;
        const durationMs = audio.duration * 1000;

        if (currentMode === 'quran') {
          if (isCustomAudio && currentVerses.length > 1) {
            const ayatIndex = Math.floor((currentMs / durationMs) * currentVerses.length);
            if (ayatIndex !== currentAyatIndex && ayatIndex < currentVerses.length) {
              currentAyatIndex = ayatIndex;
              renderAyat(currentAyatIndex);
            }
          }

          const totalWords = currentVerses[currentAyatIndex] ? currentVerses[currentAyatIndex].words.filter(w => w.char_type_name === 'word').length : 1;
          const wordDuration = durationMs / totalWords;
          const activeWordPos = Math.floor((currentMs % wordDuration) / (wordDuration / totalWords)) + 1;

          document.querySelectorAll('.word').forEach((el, idx) => {
            if (idx + 1 === activeWordPos) el.classList.add('highlight');
            else el.classList.remove('highlight');
          });
        }
        else if (currentMode === 'song' && songLyrics.length > 0) {
          const currentTime = audio.currentTime;
          let activeIndex = -1;

          for (let i = 0; i < songLyrics.length; i++) {
            if (currentTime >= songLyrics[i].time) activeIndex = i;
            else break;
          }

          if (activeIndex !== -1 && activeIndex !== currentSongLyricIndex) {
            currentSongLyricIndex = activeIndex;
            const lineText = songLyrics[currentSongLyricIndex].text;
            activeWords = lineText.split(' ');
            renderWordSpans(activeWords);

            const nextTime = (songLyrics[currentSongLyricIndex + 1]) ? songLyrics[currentSongLyricIndex + 1].time : audio.duration;
            const lineDuration = nextTime - songLyrics[currentSongLyricIndex].time;
            const timePerWord = lineDuration / activeWords.length;

            const timeInLine = currentTime - songLyrics[currentSongLyricIndex].time;
            const activeWordIndex = Math.floor(timeInLine / timePerWord);
            highlightWordSpan(activeWordIndex);
          } else if (currentSongLyricIndex !== -1) {
            const nextTime = (songLyrics[currentSongLyricIndex + 1]) ? songLyrics[currentSongLyricIndex + 1].time : audio.duration;
            const lineDuration = nextTime - songLyrics[currentSongLyricIndex].time;
            const timePerWord = lineDuration / activeWords.length;

            const timeInLine = currentTime - songLyrics[currentSongLyricIndex].time;
            const activeWordIndex = Math.floor(timeInLine / timePerWord);
            highlightWordSpan(activeWordIndex);
          }
        }
      });

      audio.addEventListener('ended', () => {
        if (currentMode === 'quran' && !isCustomAudio && currentAyatIndex < currentVerses.length - 1) {
          currentAyatIndex++;
          renderAyat(currentAyatIndex);
          audio.play();
        } else if (isRecording) {
          stopAndSaveRecording();
        }
      });
    }

    function parseLrc(lrcText) {
      songLyrics = [];
      const lines = lrcText.split('\n');
      const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
      lines.forEach(l => {
        const m = reg.exec(l);
        if (m) {
          const time = parseInt(m[1]) * 60 + parseInt(m[2]) + parseInt(m[3].padEnd(3, '0')) / 1000;
          const text = l.replace(reg, '').trim();
          if (text) songLyrics.push({ time, text });
        }
      });
      songLyrics.sort((a, b) => a.time - b.time);
    }

    /* AL-QURAN ENGINE */
    async function getSurahList() {
      try {
        const res = await fetch(`${API_QURAN}/chapters?language=id`);
        const result = await res.json();
        const select = document.getElementById('surahSelect');
        select.innerHTML = '';
        result.chapters.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = `${c.id}. ${c.name_simple} (${c.translated_name.name})`;
          select.appendChild(opt);
        });
      } catch (e) {}
    }

    async function loadSurah(chapterId) {
      currentSurahNum = chapterId;
      try {
        const res = await fetch(`${API_QURAN}/verses/by_chapter/${chapterId}?language=id&words=true&word_fields=text_uthmani&translations=33`);
        const result = await res.json();
        currentVerses = result.verses;
        renderAyat(0);
      } catch (e) {}
    }

    function renderAyat(index) {
      if (!currentVerses.length) return;
      const verse = currentVerses[index];

      let wordsHtml = '';
      verse.words.forEach(w => {
        if (w.char_type_name === "word") {
          wordsHtml += `<span class="word" id="w-${w.position}">${w.text_uthmani}</span> `;
        }
      });
      document.getElementById('arabicDisplay').innerHTML = wordsHtml;
      document.getElementById('subDisplay').innerText = verse.translations[0] ? `"${verse.translations[0].text}"` : '';

      if (!isCustomAudio) {
        const sPad = String(currentSurahNum).padStart(3, '0');
        const aPad = String(verse.verse_number).padStart(3, '0');
        audio.src = `https://everyayah.com/data/Alafasy_128kbps/${sPad}${aPad}.mp3`;
      }
    }

    /* RENDER CANVAS DISIMPAN KE VIDEO */
    function renderFrameAtTime(timeSec) {
      try {
        if (bgType === 'image') {
          ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.drawImage(bgVideo, 0, 0, canvas.width, canvas.height);
        }
      } catch(e) {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      const grad = ctx.createLinearGradient(0, canvas.height - 250, 0, canvas.height);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.85)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, canvas.height - 250, canvas.width, 250);

      const channelName = document.getElementById('channelNameInput').value || "AUC LIRIK";
      ctx.font = 'bold 24px Inter, sans-serif';
      ctx.fillStyle = '#fbbf24';
      ctx.textAlign = 'right';
      ctx.fillText(`▶ ${channelName}`, canvas.width - 40, 50);

      ctx.textAlign = 'center';
      ctx.font = 'bold 26px Inter, sans-serif';

      if (currentMode === 'song' && activeWords.length > 0) {
        let fullLineText = activeWords.join(' ');
        ctx.fillStyle = '#ffffff';
        ctx.fillText(fullLineText, 640, 630);
      } else {
        const plainText = document.getElementById('subDisplay').innerText;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(plainText, 640, 630);
      }

      if (currentMode === 'quran') {
        const arabText = document.getElementById('arabicDisplay').innerText;
        ctx.font = 'bold 36px Amiri, serif';
        ctx.fillStyle = '#fbbf24';
        ctx.fillText(arabText, 640, 560);
      }
    }

    function toggleRecord() {
      const recBtn = document.getElementById('recBtn');

      if (!isRecording) {
        if (!audio.src) return alert("Unggah file MP3 terlebih dahulu!");

        try {
          audio.currentTime = 0;
          const canvasStream = canvas.captureStream(30);

          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioSource = audioCtx.createMediaElementSource(audio);
            audioDestination = audioCtx.createMediaStreamDestination();
            audioSource.connect(audioDestination);
            audioSource.connect(audioCtx.destination);
          }

          const audioTrack = audioDestination.stream.getAudioTracks()[0];
          if (audioTrack) canvasStream.addTrack(audioTrack);

          recordedChunks = [];
          let options = { mimeType: 'video/webm' };
          if (!MediaRecorder.isTypeSupported('video/webm')) {
            options = { mimeType: 'video/mp4' };
          }

          mediaRecorder = new MediaRecorder(canvasStream, options);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            cancelAnimationFrame(canvasAnimationId);
            const blob = new Blob(recordedChunks, { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Render_AIVideo_${Date.now()}.mp4`;
            a.click();
            alert("Perekaman Selesai! Video dinamis berhasil disimpan.");
          };

          mediaRecorder.start(1000);
          isRecording = true;

          recBtn.innerText = "⏹️ Hentikan & Simpan Video";
          recBtn.style.background = "#dc2626";

          function renderLoop() {
            if (isRecording) {
              renderFrameAtTime(audio.currentTime);
              canvasAnimationId = requestAnimationFrame(renderLoop);
            }
          }
          renderLoop();

          startPlay();
        } catch(e) {
          alert("Perekaman gagal dimaksimalkan.");
        }
      } else {
        stopAndSaveRecording();
      }
    }

    function stopAndSaveRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;

        const recBtn = document.getElementById('recBtn');
        recBtn.innerText = "🎥 Rekam & Render Video MP4";
        recBtn.style.background = "#d97706";
      }
    }
  </script>
