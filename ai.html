<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Video Lirik & VO Dinamis HD 720p</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --bg: #0f172a;
      --gold: #fbbf24;
      --cyan: #38bdf8;
      --arabic-size: 1.6rem;
      --sub-size: 1.3rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: white; padding-bottom: 120px; }

    .player-wrapper {
      width: 100%;
      max-width: 850px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .video-player-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }

    .bg-media {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.55) contrast(1.05);
      z-index: 1;
      display: none;
    }
    .bg-media.active { display: block; }

    #exportCanvas { display: none; }

    .channel-watermark {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold);
      border: 1px solid rgba(251, 191, 36, 0.4);
    }

    .info-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    .subtitle-overlay {
      position: relative;
      z-index: 10;
      width: 85%;
      margin: 25px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 90px;
    }

    .arabic-text {
      font-family: 'Amiri', serif;
      font-size: var(--arabic-size);
      direction: rtl;
      line-height: 1.6;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      word-wrap: break-word;
      max-width: 100%;
    }

    .sub-text {
      font-size: var(--sub-size);
      color: #f1f5f9;
      line-height: 1.5;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
      word-wrap: break-word;
      max-width: 100%;
    }

    /* KATA YANG SEDANG DIBACA VO */
    .word-span {
      display: inline-block;
      margin: 0 4px;
      color: #cbd5e1;
      opacity: 0.6;
      transition: all 0.12s ease-in-out;
    }

    .word-span.active {
      color: var(--gold);
      opacity: 1;
      transform: scale(1.18) translateY(-2px);
      text-shadow: 0 0 14px rgba(251, 191, 36, 0.9), 0 2px 10px rgba(0,0,0,1);
      font-weight: 800;
    }

    .controls-wrapper {
      max-width: 850px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .control-card {
      background: #1e293b;
      padding: 18px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      border: 1px solid #334155;
      margin-bottom: 12px;
    }

    .setting-group {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    label { display: block; font-size: 0.72rem; color: #94a3b8; margin-bottom: 4px; }

    select, input[type="file"], input[type="range"], input[type="text"], input[type="password"], textarea, button {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.8rem;
      outline: none;
    }

    textarea { height: 90px; font-family: monospace; }

    .btn-play { background: var(--primary); border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-record { background: #d97706; border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-ai { background: #9333ea; border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-tts { background: #059669; border: none; font-weight: bold; cursor: pointer; color: white; }

    .mode-panel { display: none; }
    .mode-panel.active { display: block; }

    .player-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid #334155;
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- PREVIEW PLAYER UTAMA -->
  <div class="player-wrapper">
    <div class="video-player-container" id="playerContainer">
      <div class="info-badge" id="infoBadge">Mode Voice Over Dinamis</div>
      <div class="channel-watermark" id="channelDisplay">▶ AUC LIRIK</div>

      <!-- BACKGROUND MEDIA -->
      <img id="bgImage" class="bg-media active" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1280&q=80" crossOrigin="anonymous">

      <video id="bgVideo" class="bg-media" loop muted playsinline crossOrigin="anonymous">
        <source id="videoSource" src="https://assets.mixkit.co/videos/preview/mixkit-clouds-and-blue-sky-2408-large.mp4" type="video/mp4">
      </video>

      <!-- OVERLAY SUBTITLE DINAMIS -->
      <div class="subtitle-overlay">
        <div class="arabic-text" id="arabicDisplay"></div>
        <div class="sub-text" id="subDisplay">Siap memutar narasi dinamis...</div>
      </div>
    </div>
  </div>

  <canvas id="exportCanvas" width="1280" height="720"></canvas>

  <div class="controls-wrapper">
    <!-- REGISTRASI MODE & WATERMARK -->
    <div class="control-card">
      <div>
        <label>Pilih Mode Konten:</label>
        <select id="modeSelect" onchange="switchContentMode(this.value)">
          <option value="song" selected>🎵 Mode Lagu / Voice Over</option>
          <option value="quran">📖 Mode Al-Qur'an Karaoke</option>
        </select>
      </div>

      <div>
        <label>Pilih Tipe Background:</label>
        <select id="bgTypeSelect" onchange="switchBgType(this.value)">
          <option value="image" selected>🖼️ Gambar Latar</option>
          <option value="video">🎥 Video Latar</option>
        </select>
      </div>

      <div>
        <label>Nama Channel Youtube / Watermark:</label>
        <input type="text" id="channelNameInput" value="AUC LIRIK" oninput="updateChannelName()">
      </div>
    </div>

    <!-- PANEL PENGATURAN SUARA INDONESIA NATURAL -->
    <div class="control-card" style="border: 1px solid #059669; background: #131722;">
      <div style="grid-column: span 2;">
        <label style="color: #34d399; font-weight: bold; font-size: 0.82rem;">🗣️ Pengisi Suara Alami Bahasa Indonesia (Natural Neural VO):</label>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:6px; margin-bottom:8px;">
          <div>
            <label>Karakter Pengisi Suara:</label>
            <select id="naturalIndoVoiceSelect">
              <optgroup label="👩 Suara Wanita (Female)">
                <option value="Gadis" selected>Gadis / Neural-A (Wanita - Lembut & Alami)</option>
                <option value="Wavenet-A">Wavenet-A (Wanita - Jernih & Profesional)</option>
                <option value="GoogleIndoFemale">Google Indonesia (Wanita - Natural)</option>
              </optgroup>
              <optgroup label="👨 Suara Pria (Male)">
                <option value="Ardi">Ardi / Neural-B (Pria - Warm & Berwibawa)</option>
                <option value="Wavenet-B">Wavenet-B (Pria - Berat & Deep)</option>
                <option value="GoogleIndoMale">Google Indonesia (Pria - Calm)</option>
              </optgroup>
            </select>
          </div>

          <div>
            <label>Kecepatan Bicara (Speed Rate): <b id="valRate">0.82x</b></label>
            <input type="range" id="ttsRate" min="0.70" max="1.10" step="0.02" value="0.82" oninput="document.getElementById('valRate').innerText = this.value + 'x'">
          </div>
        </div>

        <div style="grid-column: span 2; margin-bottom: 8px;">
          <label>Teks Berita / Narasi VO (Otomatis Dibersihkan dari Simbol/Bintang):</label>
          <textarea id="ttsIndoInput" placeholder="Ketik atau tempel teks berita/narasi di sini..."></textarea>
        </div>

        <button class="btn-tts" style="width: 100%; background: #059669; padding: 10px; font-weight: bold;" onclick="speakNaturalIndoTTS()">🗣️ Bacakan & Tampilkan Dinamis di Player</button>
      </div>
    </div>

    <!-- TOOL AI IMAGE GENERATOR -->
    <div class="control-card" style="border: 1px solid #9333ea; background: #131722;">
      <div style="grid-column: span 2;">
        <label style="color: #c084fc; font-weight: bold; font-size: 0.8rem;">🎨 Tool AI Gambar (Text-to-Image):</label>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <input type="text" id="aiPromptInput" placeholder="Ketik deskripsi gambar..." value="surabaya city street cinematic sunset backdrop">
          <button class="btn-ai" style="width: 150px;" onclick="generateAIImage()">🎨 Buat Gambar AI</button>
        </div>
      </div>
    </div>

    <!-- PANEL 1: AL-QURAN -->
    <div id="quranPanel" class="mode-panel">
      <div class="control-card">
        <div>
          <label>Pilih Surah:</label>
          <select id="surahSelect" onchange="loadSurah(this.value)">
            <option value="">Memuat surah...</option>
          </select>
        </div>
      </div>
    </div>

    <!-- PANEL 2: LAGU & LIRIK -->
    <div id="songPanel" class="mode-panel active">
      <div class="control-card">
        <div>
          <label>1. Unggah File MP3 Lagu / VO Full:</label>
          <input type="file" id="uploadSong" accept="audio/*" onchange="handleSongUpload(event)">
        </div>

        <div style="grid-column: span 2;">
          <label>Editor Lirik Sync Format .LRC:</label>
          <textarea id="lrcManualInput" placeholder="[00:06.78] Lirik lagu baris pertama..."></textarea>
        </div>
      </div>
    </div>

    <!-- EKSPOR KONTROL REKAM MANUAL -->
    <div class="control-card">
      <div>
        <label>1. Putar Pemutar Utama:</label>
        <button class="btn-play" onclick="startPlay()">▶️ Putar Player</button>
      </div>

      <div>
        <label>2. Rekam Seluruh Output Player:</label>
        <button class="btn-record" id="recBtn" onclick="toggleRecord()">🎥 Rekam & Render Video MP4</button>
      </div>
    </div>
  </div>

  <div class="player-bar">
    <div style="font-size:0.8rem; font-weight:600; color:#38bdf8;" id="playingTitle">Siap Memutar Media</div>
    <audio id="audioElement" controls style="width:100%; max-width:600px;" crossOrigin="anonymous"></audio>
  </div>

  <script>
    const API_QURAN = 'https://api.quran.com/api/v4';
    let currentMode = 'song';
    let bgType = 'image';

    let currentVerses = [], currentAyatIndex = 0, currentSurahNum = 1;
    let songLyrics = [], currentSongLyricIndex = -1;
    
    // Variabel Penangan Teks Dinamis VO
    let currentSentenceWords = [];
    let currentWordIndex = -1;

    let mediaRecorder, recordedChunks = [], isRecording = false;
    let canvasAnimationId;

    let systemVoices = [];
    let audioCtx, audioSource, audioDestination;

    const audio = document.getElementById('audioElement');
    const bgVideo = document.getElementById('bgVideo');
    const bgImage = document.getElementById('bgImage');
    const canvas = document.getElementById('exportCanvas');
    const ctx = canvas.getContext('2d');

    window.onload = () => {
      getSurahList();
      initSyncEngine();
      updateChannelName();
      loadSystemVoices();
      
      // Isi default sampel narasi jika kosong
      const inputTxt = document.getElementById('ttsIndoInput');
      if (!inputTxt.value) {
        inputTxt.value = "Besok, Jumat 31 Juli, akan ada aksi massa yang berpotensi menyebabkan perubahan arus di sejumlah ruas jalan utama Surabaya. Di sisi lain, Surabaya juga mendapat kabar positif. Kota ini kembali mendapat apresiasi dalam pemenuhan hak dan perlindungan anak.";
      }
    };

    function loadSystemVoices() {
      if ('speechSynthesis' in window) {
        systemVoices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
          systemVoices = window.speechSynthesis.getVoices();
        };
      }
    }

    /* BERSIHKAN TEKS DARI KARAKTER MARKDOWN / SIMBOL (**, ##, dll) */
    function cleanMarkdownText(rawText) {
      return rawText
        .replace(/\*\*([^*]+)\*\*/g, '$1') // Hapus bold **
        .replace(/#+/g, '')                // Hapus hashtag
        .replace(/[\*\_\~]/g, '')          // Hapus * _ ~
        .replace(/\s+/g, ' ')              // Hapus spasi ganda
        .trim();
    }

    /* PENGECORAN PARAGRAF MENJADI KALIMAT-KALIMAT PENDEK DINAMIS */
    function speakNaturalIndoTTS() {
      let rawText = document.getElementById('ttsIndoInput').value;
      if (!rawText) return alert("Ketik atau tempel teks berita/narasi terlebih dahulu!");

      const cleanText = cleanMarkdownText(rawText);
      const selectedVoice = document.getElementById('naturalIndoVoiceSelect').value;
      const rateVal = parseFloat(document.getElementById('ttsRate').value) || 0.82;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Hentikan audio sebelumnya

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'id-ID';
        utterance.rate = rateVal;
        utterance.pitch = 1.0;

        if (systemVoices.length === 0) systemVoices = window.speechSynthesis.getVoices();

        let matchedVoice = null;
        if (selectedVoice.includes('Female') || selectedVoice === 'Gadis' || selectedVoice === 'Wavenet-A') {
          matchedVoice = systemVoices.find(v => v.lang.includes('id') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Gadis') || v.name.includes('Indonesian Female')));
        } else {
          matchedVoice = systemVoices.find(v => v.lang.includes('id') && (v.name.includes('Ardi') || v.name.includes('Male') || v.name.includes('Indonesian Male')));
        }

        if (!matchedVoice) {
          matchedVoice = systemVoices.find(v => v.lang.includes('id') || v.lang.includes('ID'));
        }

        if (matchedVoice) utterance.voice = matchedVoice;

        // Potong teks menjadi daftar kata
        const allWords = cleanText.split(' ');
        
        // Posisikan kata per kata
        utterance.onboundary = (event) => {
          if (event.name === 'word') {
            const charIndex = event.charIndex;
            let accLength = 0;
            let activeIdx = 0;

            for (let i = 0; i < allWords.length; i++) {
              accLength += allWords[i].length + 1;
              if (accLength > charIndex) {
                activeIdx = i;
                break;
              }
            }

            // Ambil potongan 5 kata terdekat untuk ditampilkan di player (mencegah teks penuh)
            const startIdx = Math.max(0, activeIdx - 1);
            const endIdx = Math.min(allWords.length, activeIdx + 5);
            
            currentSentenceWords = allWords.slice(startIdx, endIdx);
            currentWordIndex = activeIdx - startIdx;

            renderWordSpansDynamic(currentSentenceWords, currentWordIndex);
          }
        };

        utterance.onend = () => {
          document.getElementById('subDisplay').innerText = "Narasi selesai.";
          currentSentenceWords = [];
          currentWordIndex = -1;
          if (isRecording) stopAndSaveRecording();
        };

        document.getElementById('playingTitle').innerText = `Membaca VO: ${selectedVoice}`;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("Browser Anda tidak mendukung Web Speech API.");
      }
    }

    /* RENDER KATA DINAMIS DI PLAYER (GAYA SHORTS/CAPCUT) */
    function renderWordSpansDynamic(wordsArray, activeIndex) {
      const subContainer = document.getElementById('subDisplay');
      subContainer.innerHTML = '';

      wordsArray.forEach((word, index) => {
        const span = document.createElement('span');
        span.className = 'word-span' + (index === activeIndex ? ' active' : '');
        span.innerText = word + ' ';
        subContainer.appendChild(span);
      });
    }

    function generateAIImage() {
      const prompt = document.getElementById('aiPromptInput').value.trim();
      if (!prompt) return alert("Masukkan deskripsi/prompt gambar!");

      document.getElementById('subDisplay').innerText = "🎨 Membuat gambar latar...";

      const seed = Math.floor(Math.random() * 1000000);
      const encodedPrompt = encodeURIComponent(prompt);
      const aiImageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1280&height=720&seed=${seed}&nologo=true`;

      const tempImg = new Image();
      tempImg.crossOrigin = "anonymous";
      tempImg.src = aiImageUrl;

      tempImg.onload = () => {
        bgImage.src = aiImageUrl;
        switchBgType('image');
        document.getElementById('bgTypeSelect').value = 'image';
        document.getElementById('subDisplay').innerText = "Gambar AI dipasang!";
      };
    }

    function updateChannelName() {
      const name = document.getElementById('channelNameInput').value || "AUC LIRIK";
      document.getElementById('channelDisplay').innerHTML = `▶ ${name}`;
    }

    function switchContentMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-panel').forEach(e => e.classList.remove('active'));

      if (mode === 'quran') {
        document.getElementById('quranPanel').classList.add('active');
        document.getElementById('infoBadge').innerText = "Mode Al-Qur'an";
      } else {
        document.getElementById('songPanel').classList.add('active');
        document.getElementById('infoBadge').innerText = "Mode Voice Over Dinamis";
      }
    }

    function switchBgType(type) {
      bgType = type;
      bgVideo.classList.remove('active');
      bgImage.classList.remove('active');

      if (type === 'video') {
        bgVideo.classList.add('active');
        bgVideo.play().catch(() => {});
      } else {
        bgImage.classList.add('active');
      }
    }

    function handleSongUpload(e) {
      const file = e.target.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
        document.getElementById('playingTitle').innerText = `Lagu: ${file.name}`;
      }
    }

    function startPlay() {
      if (audio.src) {
        audio.play();
      } else {
        speakNaturalIndoTTS();
      }
    }

    function initSyncEngine() {
      audio.addEventListener('ended', () => {
        if (isRecording) stopAndSaveRecording();
      });
    }

    async function getSurahList() {
      try {
        const res = await fetch(`${API_QURAN}/chapters?language=id`);
        const result = await res.json();
        const select = document.getElementById('surahSelect');
        select.innerHTML = '';
        result.chapters.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = `${c.id}. ${c.name_simple}`;
          select.appendChild(opt);
        });
      } catch (e) {}
    }

    /* CANVAS RENDERER UNTUK REKAM VIDEO DINAMIS */
    function renderFrameAtTime() {
      try {
        if (bgType === 'image') {
          ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.drawImage(bgVideo, 0, 0, canvas.width, canvas.height);
        }
      } catch(e) {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Gradien kotak lirik
      const grad = ctx.createLinearGradient(0, canvas.height - 220, 0, canvas.height);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.85)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, canvas.height - 220, canvas.width, 220);

      // Watermark
      const channelName = document.getElementById('channelNameInput').value || "AUC LIRIK";
      ctx.font = 'bold 24px Inter, sans-serif';
      ctx.fillStyle = '#fbbf24';
      ctx.textAlign = 'right';
      ctx.fillText(`▶ ${channelName}`, canvas.width - 40, 50);

      // Render Kalimat Pendek Aktif di Canvas Video
      ctx.textAlign = 'center';
      ctx.font = 'bold 30px Inter, sans-serif';

      if (currentSentenceWords.length > 0) {
        let sentenceText = currentSentenceWords.join(' ');
        ctx.fillStyle = '#ffffff';
        ctx.fillText(sentenceText, 640, 620);
      } else {
        const plainText = document.getElementById('subDisplay').innerText;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(plainText, 640, 620);
      }
    }

    function toggleRecord() {
      const recBtn = document.getElementById('recBtn');

      if (!isRecording) {
        try {
          const canvasStream = canvas.captureStream(30);

          if (audio.src) {
            audio.currentTime = 0;
            if (!audioCtx) {
              audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              audioSource = audioCtx.createMediaElementSource(audio);
              audioDestination = audioCtx.createMediaStreamDestination();
              audioSource.connect(audioDestination);
              audioSource.connect(audioCtx.destination);
            }
            const audioTrack = audioDestination.stream.getAudioTracks()[0];
            if (audioTrack) canvasStream.addTrack(audioTrack);
          }

          recordedChunks = [];
          let options = { mimeType: 'video/webm' };
          if (!MediaRecorder.isTypeSupported('video/webm')) {
            options = { mimeType: 'video/mp4' };
          }

          mediaRecorder = new MediaRecorder(canvasStream, options);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            cancelAnimationFrame(canvasAnimationId);
            const blob = new Blob(recordedChunks, { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Render_Video_Dinamis_${Date.now()}.mp4`;
            a.click();
            alert("Perekaman Selesai! Video dinamis berhasil disimpan.");
          };

          mediaRecorder.start(1000);
          isRecording = true;

          recBtn.innerText = "⏹️ Hentikan & Simpan Video";
          recBtn.style.background = "#dc2626";

          function renderLoop() {
            if (isRecording) {
              renderFrameAtTime();
              canvasAnimationId = requestAnimationFrame(renderLoop);
            }
          }
          renderLoop();

          startPlay();
        } catch(e) {
          alert("Perekaman gagal dimaksimalkan.");
        }
      } else {
        stopAndSaveRecording();
      }
    }

    function stopAndSaveRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;

        const recBtn = document.getElementById('recBtn');
        recBtn.innerText = "🎥 Rekam & Render Video MP4";
