<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qur'an Video Player & MP4 Converter</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0d9488;
      --bg: #0f172a;
      --karaoke-gold: #fbbf24;
      --karaoke-glow: rgba(251, 191, 36, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: white; padding-bottom: 120px; }

    /* Video Canvas Area */
    .video-player-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 500px;
      margin: 20px auto;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Background Video */
    #bgVideo {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.4) contrast(1.1);
      z-index: 1;
    }

    /* Overlay Teks Arab & Terjemahan */
    .quran-overlay {
      position: relative;
      z-index: 10;
      width: 85%;
      text-align: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .surah-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .arabic-text {
      font-family: 'Amiri', serif;
      font-size: 2.3rem;
      direction: rtl;
      line-height: 2.2;
      margin-bottom: 12px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    .word {
      display: inline-block;
      padding: 0 4px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    /* Highlight Karaoke */
    .word.highlight {
      color: var(--karaoke-gold);
      transform: scale(1.12);
      text-shadow: 0 0 12px var(--karaoke-glow);
      font-weight: bold;
    }

    .translation-text {
      font-size: 0.95rem;
      color: #e2e8f0;
      line-height: 1.5;
    }

    /* Panel Kontrol Pengaturan */
    .controls-wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .control-card {
      background: #1e293b;
      padding: 20px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      border: 1px solid #334155;
    }

    select, input[type="file"], button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.85rem;
      outline: none;
    }

    .btn-play {
      background: var(--primary);
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-download {
      background: #d97706;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    /* Fixed Bottom Player */
    .player-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid #334155;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- LAYER KANVAS PLAYER VIDEO -->
  <div class="video-player-container" id="captureArea">
    <video id="bgVideo" autoplay loop muted playsinline crossOrigin="anonymous">
      <source id="videoSource" src="https://assets.mixkit.co/videos/preview/mixkit-clouds-and-blue-sky-2408-large.mp4" type="video/mp4">
    </video>

    <div class="quran-overlay">
      <div class="surah-badge" id="surahBadge">Memuat Surah...</div>
      <div class="arabic-text" id="arabicDisplay">
        <span class="word">Klik</span> <span class="word">Putar</span>
      </div>
      <div class="translation-text" id="translationDisplay">Pilih surah lalu tekan tombol 'Putar Karaoke'</div>
    </div>
  </div>

  <!-- PANEL KONTROL & UPLOAD -->
  <div class="controls-wrapper">
    <div class="control-card">
      <div>
        <label style="font-size:0.75rem; color:#94a3b8;">Pilih Surah:</label>
        <select id="surahSelect" onchange="loadSurah(this.value)">
          <option value="">Memuat daftar surah...</option>
        </select>
      </div>

      <div>
        <label style="font-size:0.75rem; color:#94a3b8;">Unggah MP4 Sendiri:</label>
        <input type="file" id="uploadVideo" accept="video/mp4" onchange="handleVideoUpload(event)">
      </div>

      <div>
        <label style="font-size:0.75rem; color:#94a3b8;">Kontrol:</label>
        <button class="btn-play" onclick="startPlay()">▶️ Putar Karaoke</button>
      </div>

      <div>
        <label style="font-size:0.75rem; color:#94a3b8;">Ekspor / Rekam Video:</label>
        <button class="btn-download" id="recBtn" onclick="toggleRecord()">🎥 Rekam & Unduh MP4</button>
      </div>
    </div>
  </div>

  <!-- FIXED AUDIO PLAYER BAR -->
  <div class="player-bar">
    <div style="font-size:0.85rem; font-weight:600; color:#38bdf8;" id="playingTitle">Siap Memutar</div>
    <audio id="audioElement" controls style="width:100%; max-width:600px;" crossOrigin="anonymous"></audio>
  </div>

  <script>
    const API_QURAN_COM = 'https://api.quran.com/api/v4';
    let currentVerses = [];
    let currentAyatIndex = 0;
    let audioSegments = [];

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    const audio = document.getElementById('audioElement');
    const bgVideo = document.getElementById('bgVideo');

    window.onload = () => {
      getSurahList();
      initKaraokeEngine();
    };

    // 1. Ambil Daftar Surah
    async function getSurahList() {
      try {
        const res = await fetch(`${API_QURAN_COM}/chapters?language=id`);
        const result = await res.json();
        const select = document.getElementById('surahSelect');
        select.innerHTML = '';

        result.chapters.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = `${c.id}. ${c.name_simple} (${c.translated_name.name})`;
          select.appendChild(opt);
        });

        loadSurah(1); // Default Al-Fatihah
      } catch (e) {
        alert("Gagal memuat daftar surah.");
      }
    }

    // 2. Load Teks Ayat + Timestamps Per Kata
    async function loadSurah(chapterId) {
      try {
        const res = await fetch(`${API_QURAN_COM}/verses/by_chapter/${chapterId}?language=id&words=true&word_fields=text_uthmani&audio=7&translations=33`);
        const result = await res.json();
        currentVerses = result.verses;
        currentAyatIndex = 0;

        renderAyat(0);
      } catch (e) {
        alert("Gagal mengambil data ayat.");
      }
    }

    // 3. Render Teks ke Layar
    function renderAyat(index) {
      if (!currentVerses.length) return;
      const verse = currentVerses[index];

      document.getElementById('surahBadge').innerText = `Surah Ke-${verse.verse_key.split(':')[0]} : Ayat ${verse.verse_number}`;

      let wordsHtml = '';
      verse.words.forEach(w => {
        if (w.char_type_name === "word") {
          wordsHtml += `<span class="word" id="w-${w.position}">${w.text_uthmani}</span> `;
        }
      });
      document.getElementById('arabicDisplay').innerHTML = wordsHtml;

      const translation = verse.translations[0] ? verse.translations[0].text : '';
      document.getElementById('translationDisplay').innerHTML = `"${translation}"`;

      if (verse.audio && verse.audio.url) {
        audio.src = verse.audio.url.startsWith('http') ? verse.audio.url : `https://audio.quran.com/${verse.audio.url}`;
        audioSegments = verse.audio.segments || [];
      }
    }

    // 4. Jalankan Audio & Video Synchronized
    function startPlay() {
      if (!currentVerses.length) return;

      renderAyat(currentAyatIndex);
      
      // Jalankan audio dan video bersamaan
      audio.play().then(() => {
        bgVideo.play();
        document.getElementById('playingTitle').innerText = `Memutar Ayat ${currentVerses[currentAyatIndex].verse_number}`;
      }).catch(err => {
        alert("Klik tombol Play di audio bar bawah jika autoplay diblokir browser.");
      });
    }

    // 5. Fitur Unggah Video MP4 Sendiri
    function handleVideoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        bgVideo.src = fileURL;
        bgVideo.play();
      }
    }

    // 6. Synchronized Karaoke Highlight Engine
    function initKaraokeEngine() {
      audio.addEventListener('timeupdate', () => {
        if (!audioSegments.length) return;

        const currentTimeMs = audio.currentTime * 1000;

        audioSegments.forEach(segment => {
          const [wordPosition, startTime, endTime] = segment;
          const wordEl = document.getElementById(`w-${wordPosition}`);

          if (wordEl) {
            if (currentTimeMs >= startTime && currentTimeMs <= endTime) {
              wordEl.classList.add('highlight');
            } else {
              wordEl.classList.remove('highlight');
            }
          }
        });
      });

      audio.addEventListener('ended', () => {
        if (currentAyatIndex < currentVerses.length - 1) {
          currentAyatIndex++;
          startPlay();
        } else {
          if (isRecording) toggleRecord(); // Stop rekam saat surah selesai
        }
      });
    }

    // 7. Fitur Merekam & Mengunduh Tampilan Player MP4
    async function toggleRecord() {
      const recBtn = document.getElementById('recBtn');

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { mediaSource: "screen" },
            audio: true
          });

          recordedChunks = [];
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = exportVideo;

          mediaRecorder.start();
          isRecording = true;
          recBtn.innerText = "⏹️ Hentikan & Unduh Video";
          recBtn.style.background = "#dc2626";

          startPlay();
        } catch (err) {
          alert("Izin perekaman layar diperlukan untuk membuat file video.");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.innerText = "🎥 Rekam & Unduh MP4";
        recBtn.style.background = "#d97706";
      }
    }

    function exportVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Quran_Karaoke_${Date.now()}.webm`;
      a.click();
    }
  </script>
</body>
</html>
