<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text-to-Video Studio (Gemini + Kie.ai)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background-color: #1e293b;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .header {
            text-align: center;
            margin-bottom: 28px;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
        }
        .header h1 { font-size: 26px; color: #38bdf8; margin-bottom: 8px; }
        .header p { color: #94a3b8; font-size: 14px; }
        
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 14px;
        }
        textarea, select {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
        }
        textarea:focus, select:focus { border-color: #38bdf8; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        .status-box {
            margin-top: 25px;
            background-color: #0f172a;
            border-radius: 12px;
            padding: 20px;
            border: 1px dashed #475569;
            display: none;
        }
        .status-title { font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
        .prompt-preview {
            background-color: #020617;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #a5f3fc;
            margin-top: 6px;
        }
        .video-result {
            margin-top: 25px;
            display: none;
            text-align: center;
        }
        video {
            width: 100%;
            max-height: 450px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>AI Text-to-Video Studio</h1>
            <p>Diototatisasi oleh Gemini API (Prompt Enhancer) & Kie.ai (Video Engine)</p>
        </div>

        <form id="videoForm">
            <div class="form-group">
                <label for="userPrompt">Ide Video (Bahasa Indonesia):</label>
                <textarea id="userPrompt" rows="3" placeholder="Contoh: Kucing astronot terbang di ruang angkasa dengan latar planet bumi..."></textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="model">Model AI Video (Kie.ai):</label>
                    <select id="model">
                        <option value="kling-v1.5">Kling AI v1.5</option>
                        <option value="veo-2">Veo 2 (Google)</option>
                        <option value="runway-gen3">Runway Gen-3</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="aspectRatio">Rasio Aspek:</label>
                    <select id="aspectRatio">
                        <option value="16:9">16:9 (Landscape / YouTube)</option>
                        <option value="9:16">9:16 (Portrait / TikTok / Reels)</option>
                    </select>
                </div>
            </div>

            <button type="button" onclick="generateVideo()">🚀 Generate Video</button>
        </form>

        <!-- Box Indikator / Pipeline Status -->
        <div class="status-box" id="statusBox">
            <div class="status-title" id="statusText">🔄 Mengoptimalkan prompt dengan Gemini API...</div>
            <div class="prompt-preview" id="enhancedPrompt">...</div>
        </div>

        <!-- Tempat Output Video -->
        <div class="video-result" id="videoResult">
            <h3>Hasil Video Anda:</h3>
            <video id="outputVideo" controls autoplay loop>
                <source src="" type="video/mp4">
                Browser Anda tidak mendukung pemutar video.
            </video>
        </div>
    </div>

    <script>
        async function generateVideo() {
            const promptText = document.getElementById('userPrompt').value;
            const model = document.getElementById('model').value;
            const aspectRatio = document.getElementById('aspectRatio').value;

            if (!promptText) {
                alert("Silakan masukkan ide video terlebih dahulu!");
                return;
            }

            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const enhancedPrompt = document.getElementById('enhancedPrompt');
            const videoResult = document.getElementById('videoResult');

            // Reset UI
            statusBox.style.display = 'block';
            videoResult.style.display = 'none';
            statusText.innerText = "1/2: Menghubungi Gemini API untuk memoles prompt...";
            enhancedPrompt.innerText = "Memproses teks...";

            try {
                // Kirim ide dasar ke Backend milik Anda sendiri
                const response = await fetch('/api/generate-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText, model, aspectRatio })
                });

                const data = await response.json();

                if (data.success) {
                    statusText.innerText = "2/2: Prompt berhasil di-optimize! Video sedang diproses oleh Kie.ai...";
                    enhancedPrompt.innerText = "Prompt Gemini: " + data.enhancedPrompt;

                    // Tampilkan video jika URL sudah siap
                    setTimeout(() => {
                        document.getElementById('outputVideo').src = data.videoUrl;
                        videoResult.style.display = 'block';
                    }, 3000);
                } else {
                    alert("Gagal memproses video: " + data.error);
                }
            } catch (err) {
                console.error(err);
                alert("Terjadi kesalahan koneksi ke server backend.");
            }
        }
    </script>
</body>
</html>
