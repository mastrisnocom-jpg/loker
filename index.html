<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Chat WA Group</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
    .chat-box { max-width: 600px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .msg { padding: 10px; border-bottom: 1px solid #eee; }
    .sender { font-weight: bold; color: #25D366; font-size: 0.9em; }
    .text { margin-top: 5px; color: #333; }
  </style>
</head>
<body>

  <div class="chat-box">
    <h2>Pesan Grup WhatsApp</h2>
    <div id="messages-container">Memuat pesan...</div>
  </div>

  <script>
    // Ganti dengan kredensial Supabase milik Anda
    const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const container = document.getElementById('messages-container');

    // 1. Ambil data pesan awal dari Supabase
    async function loadMessages() {
      const { data, error } = await supabase
        .from('whatsapp_messages')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(20);

      if (error) {
        container.innerHTML = 'Gagal memuat pesan.';
        return;
      }

      container.innerHTML = '';
      data.forEach(msg => appendMessage(msg));
    }

    // 2. Fungsi untuk menampilkan pesan ke HTML
    function appendMessage(msg) {
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `
        <div class="sender">${msg.sender_name} (${msg.sender})</div>
        <div class="text">${msg.message}</div>
      `;
      container.prepend(div);
    }

    // 3. Dengarkan kiriman data baru secara Real-time
    supabase
      .channel('schema-db-changes')
      .on(
        'postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'whatsapp_messages' },
        (payload) => {
          appendMessage(payload.new);
        }
      )
      .subscribe();

    loadMessages();
  </script>
</body>
</html>
