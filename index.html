<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text-to-Video Studio (Client-Side API)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background-color: #1e293b;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #334155;
            padding-bottom: 16px;
        }
        .header h1 { font-size: 24px; color: #38bdf8; margin-bottom: 6px; }
        .header p { color: #94a3b8; font-size: 13px; }
        
        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .api-box {
            background-color: #0f172a;
            padding: 16px;
            border-radius: 10px;
            border: 1px dashed #475569;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 13px;
        }
        textarea, select, input[type="password"], input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 13px;
            outline: none;
        }
        textarea:focus, select:focus, input:focus { border-color: #38bdf8; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }

        .status-box {
            margin-top: 25px;
            background-color: #0f172a;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #334155;
            display: none;
        }
        .status-title { font-weight: bold; color: #38bdf8; margin-bottom: 8px; font-size: 14px; }
        .prompt-preview {
            background-color: #020617;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #a5f3fc;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .video-result {
            margin-top: 25px;
            display: none;
            text-align: center;
        }
        video {
            width: 100%;
            max-height: 450px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-top: 10px;
        }
        .note {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>AI Text-to-Video Studio</h1>
            <p>Generate video langsung dari browser menggunakan API Key Anda sendiri</p>
        </div>

        <form id="videoForm">
            <!-- Pengaturan API Key User -->
            <div class="api-box">
                <div class="section-title">🔑 Konfigurasi API Key User</div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="geminiKey">Gemini API Key:</label>
                        <input type="password" id="geminiKey" placeholder="AIzaSy..." required>
                        <div class="note">Diperlukan untuk memperjelas prompt</div>
                    </div>
                    <div class="form-group">
                        <label for="kieKey">Kie.ai API Key:</label>
                        <input type="password" id="kieKey" placeholder="kie_..." required>
                        <div class="note">Diperlukan untuk memproses video</div>
                    </div>
                </div>
            </div>

            <!-- Form Input Video -->
            <div class="form-group">
                <label for="userPrompt">Ide Video (Bahasa Indonesia):</label>
                <textarea id="userPrompt" rows="3" placeholder="Contoh: Kucing memasak nasi goreng di dapur modern, gaya sinematik..." required></textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="model">Model Video (Kie.ai):</label>
                    <select id="model">
                        <option value="kling-v1.5">Kling AI v1.5</option>
                        <option value="veo-2">Veo 2 (Google)</option>
                        <option value="runway-gen3">Runway Gen-3</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="aspectRatio">Rasio Aspek:</label>
                    <select id="aspectRatio">
                        <option value="16:9">16:9 (Landscape / YouTube)</option>
                        <option value="9:16">9:16 (Portrait / TikTok / Reels)</option>
                        <option value="1:1">1:1 (Square)</option>
                    </select>
                </div>
            </div>

            <button type="button" onclick="processTextToVideo()">🚀 Generate Video</button>
        </form>

        <!-- Dynamic Status Section -->
        <div class="status-box" id="statusBox">
            <div class="status-title" id="statusText">🔄 Mengoptimalkan prompt dengan Gemini...</div>
            <div class="prompt-preview" id="enhancedPrompt">...</div>
        </div>

        <!-- Output Video -->
        <div class="video-result" id="videoResult">
            <h3 style="color: #38bdf8;">🎬 Hasil Video Anda:</h3>
            <video id="outputVideo" controls autoplay loop>
                <source id="videoSource" src="" type="video/mp4">
                Browser Anda tidak mendukung elemen video.
            </video>
        </div>
    </div>

    <script>
        async function processTextToVideo() {
            const geminiKey = document.getElementById('geminiKey').value.trim();
            const kieKey = document.getElementById('kieKey').value.trim();
            const promptText = document.getElementById('userPrompt').value.trim();
            const model = document.getElementById('model').value;
            const aspectRatio = document.getElementById('aspectRatio').value;

            if (!geminiKey || !kieKey) {
                alert("Mohon isi kedua API Key (Gemini dan Kie.ai) terlebih dahulu!");
                return;
            }

            if (!promptText) {
                alert("Mohon isi ide video Anda!");
                return;
            }

            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const enhancedPrompt = document.getElementById('enhancedPrompt');
            const videoResult = document.getElementById('videoResult');

            statusBox.style.display = 'block';
            videoResult.style.display = 'none';
            statusText.innerText = "1/2: Menghubungi Gemini API untuk memoles prompt...";
            enhancedPrompt.innerText = "Sedang memproses prompt...";

            try {
                // TAHAP 1: Panggil Gemini API langsung dari Browser
                const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`;
                
                const promptInstruction = `Ubah ide singkat berikut menjadi prompt Text-to-Video sinematik yang sangat detail dalam Bahasa Inggris (sertakan detail lighting, camera movement, style, 8k resolution). Berikan HANYA teks prompt bahasa inggrisnya saja tanpa kalimat pembuka/penutup:\n\nIde: ${promptText}`;

                const geminiResponse = await fetch(geminiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptInstruction }] }]
                    })
                });

                const geminiData = await geminiResponse.json();

                if (geminiData.error) {
                    throw new Error("Gemini Error: " + geminiData.error.message);
                }

                const generatedPrompt = geminiData.candidates[0].content.parts[0].text.trim();
                
                // Tampilkan hasil prompt Gemini di layar
                statusText.innerText = "2/2: Prompt berhasil dipoles! Mengirim permintaan ke Kie.ai...";
                enhancedPrompt.innerText = generatedPrompt;

                // TAHAP 2: Panggil Kie.ai API langsung dari Browser
                const kieUrl = 'https://api.kie.ai/v1/jobs/create-video';
                
                const kieResponse = await fetch(kieUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${kieKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        prompt: generatedPrompt,
                        aspect_ratio: aspectRatio,
                        duration: 5
                    })
                });

                const kieData = await kieResponse.json();

                if (!kieResponse.ok || kieData.error) {
                    throw new Error("Kie.ai Error: " + (kieData.error || kieData.message || "Gagal membuat video"));
                }

                // TAHAP 3: Tampilkan Video
                statusText.innerText = "✅ Berhasil! Video selesai diproses.";
                const videoUrl = kieData.video_url || kieData.data?.url;

                if (videoUrl) {
                    document.getElementById('videoSource').src = videoUrl;
                    document.getElementById('outputVideo').load();
                    videoResult.style.display = 'block';
                } else {
                    alert("Video diproses, tetapi URL video belum siap. Respon Kie.ai: " + JSON.stringify(kieData));
                }

            } catch (err) {
                console.error(err);
                alert("Terjadi Kesalahan: " + err.message);
                statusText.innerText = "❌ Proses Gagal.";
                enhancedPrompt.innerText = err.message;
            }
        }
    </script>
</body>
</html>
