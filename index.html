<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qur'an Video Player 16:9 Karaoke Pro</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0d9488;
      --bg: #0f172a;
      --karaoke-gold: #fbbf24;
      --karaoke-glow: rgba(251, 191, 36, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: white; padding-bottom: 120px; }

    /* Container Video Player Presisi Aspect Ratio 16:9 */
    .player-wrapper {
      width: 100%;
      max-width: 850px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .video-player-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9; /* Rasio Standar 16:9 */
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }

    /* Background Video MP4 */
    #bgVideo {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.4) contrast(1.1);
      z-index: 1;
    }

    /* Overlay Teks Arab & Terjemahan */
    .quran-overlay {
      position: relative;
      z-index: 10;
      width: 90%;
      text-align: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .surah-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .arabic-text {
      font-family: 'Amiri', serif;
      font-size: 2.2rem;
      direction: rtl;
      line-height: 2.1;
      margin-bottom: 10px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    .word {
      display: inline-block;
      padding: 0 4px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    /* Highlight Karaoke Menyala */
    .word.highlight {
      color: var(--karaoke-gold);
      transform: scale(1.15);
      text-shadow: 0 0 14px var(--karaoke-glow);
      font-weight: bold;
    }

    .translation-text {
      font-size: 0.9rem;
      color: #e2e8f0;
      line-height: 1.4;
      max-height: 60px;
      overflow: hidden;
    }

    /* Panel Kontrol Pengaturan */
    .controls-wrapper {
      max-width: 850px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .control-card {
      background: #1e293b;
      padding: 18px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      border: 1px solid #334155;
    }

    select, input[type="file"], button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.85rem;
      outline: none;
    }

    .btn-play {
      background: var(--primary);
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-download {
      background: #d97706;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    /* Fixed Audio Bar Bottom */
    .player-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid #334155;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- KOTAK PLAYER 16:9 -->
  <div class="player-wrapper">
    <div class="video-player-container" id="captureArea">
      <video id="bgVideo" autoplay loop muted playsinline crossOrigin="anonymous">
        <source id="videoSource" src="https://assets.mixkit.co/videos/preview/mixkit-clouds-and-blue-sky-2408-large.mp4" type="video/mp4">
      </video>

      <div class="quran-overlay">
        <div class="surah-badge" id="surahBadge">Memuat Surah...</div>
        <div class="arabic-text" id="arabicDisplay">
          <span class="word">Klik</span> <span class="word">Putar</span>
        </div>
        <div class="translation-text" id="translationDisplay">Pilih surah lalu tekan tombol 'Putar Karaoke'</div>
      </div>
    </div>
  </div>

  <!-- PANEL KONTROL & UNGGAH MP4 -->
  <div class="controls-wrapper">
    <div class="control-card">
      <div>
        <label style="font-size:0.75rem; color:#94a3b8;">Pilih Surah:</label>
        <select id="surahSelect" onchange="loadSurah(this.value)">
          <option value="">Memuat daftar surah...</option>
        </select>
      </div>

      <div>
        <label style="font-size:0.75rem; color:#94a3b8;">Unggah MP4 Sendiri:</label>
        <input type="file" id="uploadVideo" accept="video/mp4" onchange="handleVideoUpload(event)">
      </div>

      <div>
        <label style="font-size:0.75rem; color:#94a3b8;">Kontrol Pemutar:</label>
        <button class="btn-play" onclick="startPlay()">▶️ Putar Karaoke</button>
      </div>

      <div>
        <label style="font-size:0.75rem; color:#94a3b8;">Ekspor / Rekam Video:</label>
        <button class="btn-download" id="recBtn" onclick="toggleRecord()">🎥 Rekam & Unduh MP4</button>
      </div>
    </div>
  </div>

  <!-- FIXED AUDIO PLAYER BAR -->
  <div class="player-bar">
    <div style="font-size:0.85rem; font-weight:600; color:#38bdf8;" id="playingTitle">Siap Memutar</div>
    <audio id="audioElement" controls style="width:100%; max-width:600px;" crossOrigin="anonymous"></audio>
  </div>

  <script>
    const API_QURAN_COM = 'https://api.quran.com/api/v4';
    let currentVerses = [];
    let currentAyatIndex = 0;
    let currentSurahNum = 1;
    let audioSegments = [];

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    const audio = document.getElementById('audioElement');
    const bgVideo = document.getElementById('bgVideo');

    window.onload = () => {
      getSurahList();
      initKaraokeEngine();
    };

    // 1. Ambil Daftar Surah
    async function getSurahList() {
      try {
        const res = await fetch(`${API_QURAN_COM}/chapters?language=id`);
        const result = await res.json();
        const select = document.getElementById('surahSelect');
        select.innerHTML = '';

        result.chapters.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = `${c.id}. ${c.name_simple} (${c.translated_name.name})`;
          select.appendChild(opt);
        });

        loadSurah(1); // Default Al-Fatihah
      } catch (e) {
        alert("Gagal memuat daftar surah.");
      }
    }

    // 2. Load Data Ayat & Timestamp
    async function loadSurah(chapterId) {
      currentSurahNum = chapterId;
      try {
        const res = await fetch(`${API_QURAN_COM}/verses/by_chapter/${chapterId}?language=id&words=true&word_fields=text_uthmani&translations=33`);
        const result = await res.json();
        currentVerses = result.verses;
        currentAyatIndex = 0;

        renderAyat(0);
      } catch (e) {
        alert("Gagal mengambil data ayat.");
      }
    }

    // 3. Formatter URL Audio CDN EveryAyah (Stabil)
    function getAudioUrl(surahNum, ayatNum) {
      const sPad = String(surahNum).padStart(3, '0');
      const aPad = String(ayatNum).padStart(3, '0');
      return `https://everyayah.com/data/Alafasy_128kbps/${sPad}${aPad}.mp3`;
    }

    // 4. Render Teks ke Layar Player
    function renderAyat(index) {
      if (!currentVerses.length) return;
      const verse = currentVerses[index];

      document.getElementById('surahBadge').innerText = `Surah Ke-${currentSurahNum} : Ayat ${verse.verse_number}`;

      let wordsHtml = '';
      verse.words.forEach(w => {
        if (w.char_type_name === "word") {
          wordsHtml += `<span class="word" id="w-${w.position}">${w.text_uthmani}</span> `;
        }
      });
      document.getElementById('arabicDisplay').innerHTML = wordsHtml;

      const translation = verse.translations[0] ? verse.translations[0].text : '';
      document.getElementById('translationDisplay').innerHTML = `"${translation}"`;

      // Gunakan CDN audio EveryAyah yang stabil
      audio.src = getAudioUrl(currentSurahNum, verse.verse_number);
      
      // Ambil timestamp segmen
      audioSegments = verse.words ? verse.words.map((w, i) => [i + 1, (i * 400), ((i + 1) * 400)]) : [];
    }

    // 5. Jalankan Audio & Video Synchronized
    function startPlay() {
      if (!currentVerses.length) return;

      renderAyat(currentAyatIndex);
      
      bgVideo.play();
      audio.play().then(() => {
        document.getElementById('playingTitle').innerText = `Memutar Surah ${currentSurahNum} : Ayat ${currentVerses[currentAyatIndex].verse_number}`;
      }).catch(err => {
        console.log("Autoplay dicegah browser, klik tombol play manual.");
      });
    }

    // 6. Unggah MP4 Latar Belakang Sendiri
    function handleVideoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        bgVideo.src = fileURL;
        bgVideo.play();
      }
    }

    // 7. Engine Synchronized Karaoke Highlight
    function initKaraokeEngine() {
      audio.addEventListener('timeupdate', () => {
        if (!audio.duration) return;

        const durationMs = audio.duration * 1000;
        const currentMs = audio.currentTime * 1000;
        const totalWords = currentVerses[currentAyatIndex] ? currentVerses[currentAyatIndex].words.filter(w => w.char_type_name === 'word').length : 1;
        
        const wordDuration = durationMs / totalWords;
        const activeWordPos = Math.floor(currentMs / wordDuration) + 1;

        document.querySelectorAll('.word').forEach((el, idx) => {
          if (idx + 1 === activeWordPos) {
            el.classList.add('highlight');
          } else {
            el.classList.remove('highlight');
          }
        });
      });

      audio.addEventListener('ended', () => {
        if (currentAyatIndex < currentVerses.length - 1) {
          currentAyatIndex++;
          startPlay();
        } else {
          if (isRecording) toggleRecord();
        }
      });
    }

    // 8. Merekam & Ekspor Layar Player MP4
    async function toggleRecord() {
      const recBtn = document.getElementById('recBtn');

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { mediaSource: "screen" },
            audio: true
          });

          recordedChunks = [];
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };

          mediaRecorder.onstop = exportVideo;

          mediaRecorder.start();
          isRecording = true;
          recBtn.innerText = "⏹️ Hentikan & Unduh MP4";
          recBtn.style.background = "#dc2626";

          startPlay();
        } catch (err) {
          alert("Izin perekaman layar dibutuhkan untuk mengunduh video.");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.innerText = "🎥 Rekam & Unduh MP4";
        recBtn.style.background = "#d97706";
      }
    }

    function exportVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Quran_Player_16x9_${Date.now()}.mp4`;
      a.click();
    }
  </script>
</body>
</html>
