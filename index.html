<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qur'an Video Player - Auto-Fit Text & EQ Presets HD</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0d9488;
      --bg: #0f172a;
      --karaoke-gold: #fbbf24;
      --karaoke-glow: rgba(251, 191, 36, 0.9);

      --arabic-size: 1.6rem;
      --translation-size: 0.9rem;
      --text-align: center;
      --overlay-position: flex-end;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: white; padding-bottom: 130px; }

    .player-wrapper {
      width: 100%;
      max-width: 850px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .video-player-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: var(--overlay-position);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }

    #bgVideo {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.65) contrast(1.05);
      z-index: 1;
    }

    #exportCanvas { display: none; }

    .surah-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      color: #cbd5e1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .channel-watermark {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.4);
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* OVERLAY SUBTITLE DENGAN AUTO-FIT MAX BOUNDS */
    .subtitle-overlay {
      position: relative;
      z-index: 10;
      width: 90%;
      max-height: 80%;
      margin: 15px;
      text-align: var(--text-align);
      background: none;
      border: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* Mencegah keluar dari box player */
    }

    .arabic-text {
      font-family: 'Amiri', serif;
      font-size: var(--arabic-size);
      direction: rtl;
      line-height: 1.6;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0,0,0,0.9);
      max-width: 100%;
      word-wrap: break-word;
    }

    .word {
      display: inline-block;
      padding: 0 3px;
      transition: all 0.15s ease;
    }

    .word.highlight {
      color: var(--karaoke-gold);
      text-shadow: 0 0 12px var(--karaoke-glow), 0 2px 8px rgba(0,0,0,1);
      font-weight: bold;
      transform: scale(1.05);
    }

    .translation-text {
      font-size: var(--translation-size);
      color: #f1f5f9;
      line-height: 1.3;
      font-weight: 500;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0,0,0,0.9);
      max-width: 100%;
      word-wrap: break-word;
    }

    .controls-wrapper {
      max-width: 850px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .control-card {
      background: #1e293b;
      padding: 18px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      border: 1px solid #334155;
      margin-bottom: 12px;
    }

    .setting-group {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    label { display: block; font-size: 0.72rem; color: #94a3b8; margin-bottom: 4px; }

    select, input[type="file"], input[type="range"], input[type="text"], button {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.8rem;
      outline: none;
    }

    .btn-play { background: var(--primary); border: none; font-weight: bold; cursor: pointer; }
    .btn-download { background: #d97706; border: none; font-weight: bold; cursor: pointer; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .modal-box {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 1px solid #334155;
    }

    .modal-box h3 { color: #22c55e; margin-bottom: 8px; }
    .modal-box p { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 18px; }

    .btn-save {
      background: #22c55e;
      color: black;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .player-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid #334155;
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="player-wrapper">
    <div class="video-player-container" id="playerContainer">
      <div class="surah-badge" id="surahBadge">Memuat Surah...</div>

      <div class="channel-watermark" id="channelDisplay">
        <span>▶</span> Mukjizat doa
      </div>

      <video id="bgVideo" autoplay loop muted playsinline crossOrigin="anonymous">
        <source id="videoSource" src="https://assets.mixkit.co/videos/preview/mixkit-clouds-and-blue-sky-2408-large.mp4" type="video/mp4">
      </video>

      <div class="subtitle-overlay" id="subtitleOverlay">
        <div class="arabic-text" id="arabicDisplay">
          <span class="word">Klik</span> <span class="word">Putar</span>
        </div>
        <div class="translation-text" id="translationDisplay">Pilih surah lalu tekan 'Putar Subtitle'</div>
      </div>
    </div>
  </div>

  <canvas id="exportCanvas" width="1280" height="720"></canvas>

  <div class="controls-wrapper">
    <div class="control-card">
      <div>
        <label>Nama Channel Youtube:</label>
        <input type="text" id="channelNameInput" value="Mukjizat doa" placeholder="Nama channel..." oninput="updateChannelName()">
      </div>

      <div>
        <label>Pilih Surah:</label>
        <select id="surahSelect" onchange="loadSurah(this.value)">
          <option value="">Memuat surah...</option>
        </select>
      </div>

      <div>
        <label>Preset Equalizer Audio (EQ):</label>
        <select id="eqPresetSelect" onchange="applyEQPreset(this.value)">
          <option value="flat" selected>Flat / Normal</option>
          <option value="bass">Bass Boost (Bass Mantap)</option>
          <option value="treble">Treble Boost (Suara Jernih)</option>
          <option value="vocal">Vocal / Murattal Clear</option>
          <option value="rock">Rock Style</option>
          <option value="jazz">Jazz / Soft Accent</option>
        </select>
      </div>

      <div>
        <label>Pengatur Pitch / Nada: <b id="valPitch">1.0x</b></label>
        <input type="range" id="pitchSlider" min="0.7" max="1.3" step="0.05" value="1.0" oninput="updatePitch(this.value)">
      </div>

      <div>
        <label>Spektrum Visualizer:</label>
        <select id="eqStyle">
          <option value="bars">Spektrum Batang Gold</option>
          <option value="wave">Gelombang Audio Sine</option>
          <option value="none">Matikan Spektrum</option>
        </select>
      </div>

      <div>
        <label>Unggah MP3 Audio Sendiri:</label>
        <input type="file" id="uploadAudio" accept="audio/*" onchange="handleAudioUpload(event)">
      </div>

      <div>
        <label>Unggah MP4 Latar Video:</label>
        <input type="file" id="uploadVideo" accept="video/mp4" onchange="handleVideoUpload(event)">
      </div>

      <div>
        <label>Kontrol Pemutar:</label>
        <button class="btn-play" onclick="startPlay()">▶️ Putar Subtitle</button>
      </div>

      <div>
        <label>Ekspor Video HD 720p:</label>
        <button class="btn-download" id="recBtn" onclick="toggleRecord()">🎥 Rekam & Unduh 720p</button>
      </div>
    </div>

    <div class="control-card">
      <div class="setting-group">
        <label>Ukuran Teks Arab: <b id="valArabic">1.6rem</b></label>
        <input type="range" id="sizeArabic" min="0.8" max="2.8" step="0.1" value="1.6" oninput="updateTextSettings()">
      </div>

      <div class="setting-group">
        <label>Ukuran Terjemahan: <b id="valTrans">0.9rem</b></label>
        <input type="range" id="sizeTrans" min="0.5" max="1.5" step="0.05" value="0.9" oninput="updateTextSettings()">
      </div>

      <div class="setting-group">
        <label>Posisi Vertikal Teks:</label>
        <select id="posVertical" onchange="updateTextSettings()">
          <option value="flex-end" selected>Di Bawah (Subtitle Film)</option>
          <option value="center">Di Tengah (Center Focus)</option>
          <option value="flex-start">Di Atas (Top Banner)</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Ratain Teks:</label>
        <select id="posAlign" onchange="updateTextSettings()">
          <option value="center" selected>Tengah (Center)</option>
          <option value="right">Kanan (Right)</option>
          <option value="left">Kiri (Left)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="downloadModal">
    <div class="modal-box">
      <h3>🎉 Ekspor HD 720p Selesai!</h3>
      <p>Video Al-Qur'an siap disimpan langsung ke HP/Komputer Anda.</p>
      <button class="btn-save" onclick="downloadVideoToDevice()">💾 Simpan Ke HP Sekarang</button>
    </div>
  </div>

  <div class="player-bar">
    <div style="font-size:0.8rem; font-weight:600; color:#38bdf8;" id="playingTitle">Siap Memutar</div>
    <audio id="audioElement" controls style="width:100%; max-width:600px;" crossOrigin="anonymous"></audio>
  </div>

  <script>
    const API_QURAN_COM = 'https://api.quran.com/api/v4';
    let currentVerses = [];
    let currentAyatIndex = 0;
    let currentSurahNum = 1;
    let isCustomAudio = false;

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let exportedBlob = null;
    let canvasAnimationId = null;

    // Web Audio API Nodes (Equalizer Biquad Filters)
    let audioCtx, audioSource, audioAnalyser, audioDestination;
    let lowFilter, midFilter, highFilter;
    let dataArray, bufferLength;

    const audio = document.getElementById('audioElement');
    const bgVideo = document.getElementById('bgVideo');
    const canvas = document.getElementById('exportCanvas');
    const ctx = canvas.getContext('2d');

    window.onload = () => {
      getSurahList();
      initKaraokeEngine();
      updateTextSettings();
      updateChannelName();
    };

    function updateChannelName() {
      const name = document.getElementById('channelNameInput').value || "Mukjizat doa";
      document.getElementById('channelDisplay').innerHTML = `<span>▶</span> ${name}`;
    }

    function updatePitch(val) {
      document.getElementById('valPitch').innerText = val + 'x';
      audio.playbackRate = parseFloat(val);
      audio.preservesPitch = false;
    }

    /* FITUR AUTO SCALING / AUTO FIT TEKS agar tidak meluap dari Box Player */
    function autoFitText() {
      const container = document.getElementById('playerContainer');
      const overlay = document.getElementById('subtitleOverlay');
      const arabicEl = document.getElementById('arabicDisplay');
      const transEl = document.getElementById('translationDisplay');

      let currentArabicSize = parseFloat(document.getElementById('sizeArabic').value);
      let currentTransSize = parseFloat(document.getElementById('sizeTrans').value);

      document.documentElement.style.setProperty('--arabic-size', currentArabicSize + 'rem');
      document.documentElement.style.setProperty('--translation-size', currentTransSize + 'rem');

      // Pengecekan jika tinggi teks melebihi tinggi container
      const maxHeight = container.clientHeight * 0.75;
      while (overlay.clientHeight > maxHeight && currentArabicSize > 0.8) {
        currentArabicSize -= 0.1;
        currentTransSize -= 0.05;
        document.documentElement.style.setProperty('--arabic-size', currentArabicSize + 'rem');
        document.documentElement.style.setProperty('--translation-size', currentTransSize + 'rem');
      }
    }

    function updateTextSettings() {
      const arabicSize = document.getElementById('sizeArabic').value + 'rem';
      const transSize = document.getElementById('sizeTrans').value + 'rem';
      const posVert = document.getElementById('posVertical').value;
      const posAlign = document.getElementById('posAlign').value;

      document.getElementById('valArabic').innerText = arabicSize;
      document.getElementById('valTrans').innerText = transSize;

      document.documentElement.style.setProperty('--arabic-size', arabicSize);
      document.documentElement.style.setProperty('--translation-size', transSize);
      document.documentElement.style.setProperty('--overlay-position', posVert);
      document.documentElement.style.setProperty('--text-align', posAlign);

      autoFitText();
    }

    async function getSurahList() {
      try {
        const res = await fetch(`${API_QURAN_COM}/chapters?language=id`);
        const result = await res.json();
        const select = document.getElementById('surahSelect');
        select.innerHTML = '';

        result.chapters.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = `${c.id}. ${c.name_simple} (${c.translated_name.name})`;
          select.appendChild(opt);
        });

        loadSurah(1);
      } catch (e) {
        alert("Gagal memuat daftar surah.");
      }
    }

    async function loadSurah(chapterId) {
      currentSurahNum = chapterId;
      try {
        const res = await fetch(`${API_QURAN_COM}/verses/by_chapter/${chapterId}?language=id&words=true&word_fields=text_uthmani&translations=33`);
        const result = await res.json();
        currentVerses = result.verses;
        currentAyatIndex = 0;

        renderAyat(0);
      } catch (e) {
        alert("Gagal mengambil data ayat.");
      }
    }

    function getAudioUrl(surahNum, ayatNum) {
      const sPad = String(surahNum).padStart(3, '0');
      const aPad = String(ayatNum).padStart(3, '0');
      return `https://everyayah.com/data/Alafasy_128kbps/${sPad}${aPad}.mp3`;
    }

    function renderAyat(index) {
      if (!currentVerses.length) return;
      const verse = currentVerses[index];

      document.getElementById('surahBadge').innerText = `Surah ${currentSurahNum} : Ayat ${verse.verse_number}`;

      let wordsHtml = '';
      verse.words.forEach(w => {
        if (w.char_type_name === "word") {
          wordsHtml += `<span class="word" id="w-${w.position}">${w.text_uthmani}</span> `;
        }
      });
      document.getElementById('arabicDisplay').innerHTML = wordsHtml;

      const translation = verse.translations[0] ? verse.translations[0].text : '';
      document.getElementById('translationDisplay').innerHTML = `"${translation}"`;

      if (!isCustomAudio) {
        audio.src = getAudioUrl(currentSurahNum, verse.verse_number);
      }

      setTimeout(autoFitText, 50);
    }

    function startPlay() {
      if (!currentVerses.length) return;
      renderAyat(currentAyatIndex);
      bgVideo.play();
      audio.play();
    }

    function handleAudioUpload(event) {
      const file = event.target.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
        isCustomAudio = true;
        currentAyatIndex = 0;
        renderAyat(0);
        document.getElementById('playingTitle').innerText = `Audio Sendiri: ${file.name}`;
      }
    }

    function handleVideoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        bgVideo.src = URL.createObjectURL(file);
        bgVideo.play();
      }
    }

    function initKaraokeEngine() {
      audio.addEventListener('timeupdate', () => {
        if (!audio.duration) return;

        const durationMs = audio.duration * 1000;
        const currentMs = audio.currentTime * 1000;

        if (isCustomAudio && currentVerses.length > 1) {
          const ayatIndexByTime = Math.floor((currentMs / durationMs) * currentVerses.length);
          if (ayatIndexByTime !== currentAyatIndex && ayatIndexByTime < currentVerses.length) {
            currentAyatIndex = ayatIndexByTime;
            renderAyat(currentAyatIndex);
          }
        }

        const totalWords = currentVerses[currentAyatIndex] ? currentVerses[currentAyatIndex].words.filter(w => w.char_type_name === 'word').length : 1;
        const wordDuration = durationMs / totalWords;
        const activeWordPos = Math.floor((currentMs % wordDuration) / (wordDuration / totalWords)) + 1;

        document.querySelectorAll('.word').forEach((el, idx) => {
          if (idx + 1 === activeWordPos) {
            el.classList.add('highlight');
          } else {
            el.classList.remove('highlight');
          }
        });
      });

      audio.addEventListener('ended', () => {
        if (!isCustomAudio && currentAyatIndex < currentVerses.length - 1) {
          currentAyatIndex++;
          startPlay();
        } else {
          if (isRecording) {
            toggleRecord();
          } else {
            showDownloadModal();
          }
        }
      });
    }

    /* MENGATUR PRESET FREKUENSI EQUALIZER (BASS, TREBLE, JAZZ, ROCK, VOCAL) */
    function applyEQPreset(preset) {
      if (!lowFilter || !midFilter || !highFilter) return;

      switch(preset) {
        case 'bass':
          lowFilter.gain.value = 8;
          midFilter.gain.value = -1;
          highFilter.gain.value = -3;
          break;
        case 'treble':
          lowFilter.gain.value = -3;
          midFilter.gain.value = 1;
          highFilter.gain.value = 9;
          break;
        case 'vocal':
          lowFilter.gain.value = -2;
          midFilter.gain.value = 7;
          highFilter.gain.value = 3;
          break;
        case 'rock':
          lowFilter.gain.value = 6;
          midFilter.gain.value = -2;
          highFilter.gain.value = 6;
          break;
        case 'jazz':
          lowFilter.gain.value = 4;
          midFilter.gain.value = 2;
          highFilter.gain.value = 4;
          break;
        default: // Flat
          lowFilter.gain.value = 0;
          midFilter.gain.value = 0;
          highFilter.gain.value = 0;
          break;
      }
    }

    /* DRAW CANVAS DENGAN AUTO FIT TEKS KANVAS & EQUALIZER VISUALIZER */
    function drawCanvasFrame() {
      if (!isRecording) return;

      // Draw Video 1280x720
      ctx.drawImage(bgVideo, 0, 0, canvas.width, canvas.height);

      // Gradient Shadow Bawah
      const grad = ctx.createLinearGradient(0, canvas.height - 250, 0, canvas.height);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.85)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, canvas.height - 250, canvas.width, 250);

      // Render Visualizer Spektrum
      const eqStyle = document.getElementById('eqStyle').value;
      if (eqStyle !== 'none' && audioAnalyser) {
        audioAnalyser.getByteFrequencyData(dataArray);

        if (eqStyle === 'bars') {
          const barWidth = (canvas.width / bufferLength) * 2.5;
          let x = 0;
          for (let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * 80;
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(x, canvas.height - barHeight - 20, barWidth - 2, barHeight);
            x += barWidth;
          }
        } else if (eqStyle === 'wave') {
          ctx.beginPath();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#fbbf24';
          const sliceWidth = canvas.width / bufferLength;
          let x = 0;
          for (let i = 0; i < bufferLength; i++) {
            const v = dataArray[i] / 128.0;
            const y = (v * 40) + (canvas.height - 100);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
            x += sliceWidth;
          }
          ctx.stroke();
        }
      }

      // Render Watermark
      const channelName = document.getElementById('channelNameInput').value || "Mukjizat doa";
      ctx.font = 'bold 24px Inter, sans-serif';
      ctx.fillStyle = '#fbbf24';
      ctx.textAlign = 'right';
      ctx.shadowColor = "rgba(0,0,0,0.9)";
      ctx.shadowBlur = 6;
      ctx.fillText(`▶ ${channelName}`, canvas.width - 40, 50);

      // Render Teks Auto-Wrap Canvas
      const transText = document.getElementById('translationDisplay').innerText;
      const arabText = document.getElementById('arabicDisplay').innerText;

      ctx.textAlign = 'center';
      
      // Ukuran Dinamis Teks Terjemahan di Canvas
      ctx.font = '22px Inter, sans-serif';
      ctx.fillStyle = '#ffffff';
      wrapTextCanvas(ctx, transText, 640, 640, 1100, 28);

      // Ukuran Dinamis Teks Arab di Canvas
      ctx.font = 'bold 36px Amiri, serif';
      ctx.fillStyle = '#fbbf24';
      ctx.fillText(arabText, 640, 570);

      ctx.shadowColor = "transparent";

      canvasAnimationId = requestAnimationFrame(drawCanvasFrame);
    }

    /* FUNGSI WRAP TEKS CANVAS SUPAYA TIDAK MELEBIHI LAYAR VIDEO HD */
    function wrapTextCanvas(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let testY = y;

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        const testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          context.fillText(line, x, testY);
          line = words[n] + ' ';
          testY += lineHeight;
        } else {
          line = testLine;
        }
      }
      context.fillText(line, x, testY);
    }

    async function toggleRecord() {
      const recBtn = document.getElementById('recBtn');

      if (!isRecording) {
        try {
          const canvasStream = canvas.captureStream(30);

          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioSource = audioCtx.createMediaElementSource(audio);
            
            // Inisialisasi Filter Biquad Equalizer
            lowFilter = audioCtx.createBiquadFilter();
            lowFilter.type = 'lowshelf';
            lowFilter.frequency.value = 320;

            midFilter = audioCtx.createBiquadFilter();
            midFilter.type = 'peaking';
            midFilter.frequency.value = 1000;

            highFilter = audioCtx.createBiquadFilter();
            highFilter.type = 'highshelf';
            highFilter.frequency.value = 3200;

            audioAnalyser = audioCtx.createAnalyser();
            audioAnalyser.fftSize = 64;
            bufferLength = audioAnalyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            audioDestination = audioCtx.createMediaStreamDestination();
            
            // Routing Rantai Node Audio: Source -> Low -> Mid -> High -> Analyser -> Output
            audioSource.connect(lowFilter);
            lowFilter.connect(midFilter);
            midFilter.connect(highFilter);
            highFilter.connect(audioAnalyser);
            audioAnalyser.connect(audioDestination);
            audioAnalyser.connect(audioCtx.destination);

            applyEQPreset(document.getElementById('eqPresetSelect').value);
          }

          const audioTrack = audioDestination.stream.getAudioTracks()[0];
          if (audioTrack) {
            canvasStream.addTrack(audioTrack);
          }

          recordedChunks = [];
          
          let options = { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 2500000 };
          if (!MediaRecorder.isTypeSupported(options.mimeType)) {
            options = { mimeType: 'video/webm' };
          }

          mediaRecorder = new MediaRecorder(canvasStream, options);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) {
              recordedChunks.push(e.data);
            }
          };

          mediaRecorder.onstop = () => {
            cancelAnimationFrame(canvasAnimationId);
            exportedBlob = new Blob(recordedChunks, { type: 'video/webm' });
            showDownloadModal();
          };

          mediaRecorder.start(1000);
          isRecording = true;
          recBtn.innerText = "⏹️ Hentikan & Simpan";
          recBtn.style.background = "#dc2626";

          drawCanvasFrame();
          startPlay();
        } catch (err) {
          alert("Gagal memulai perekaman video HD.");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.innerText = "🎥 Rekam & Unduh 720p";
        recBtn.style.background = "#d97706";
      }
    }

    function showDownloadModal() {
      document.getElementById('downloadModal').style.display = 'flex';
    }

    function downloadVideoToDevice() {
      if (exportedBlob) {
        const channelName = document.getElementById('channelNameInput').value || "Mukjizat_Doa";
        const cleanName = channelName.replace(/[^a-zA-Z0-9]/g, "_");
        const url = URL.createObjectURL(exportedBlob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `${cleanName}_HD720p_${Date.now()}.webm`;
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => {
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
        }, 100);
      } else {
        alert("Perekaman belum selesai.");
      }

      document.getElementById('downloadModal').style.display = 'none';
    }
  </script>
</body>
