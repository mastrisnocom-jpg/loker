<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Building Management System</title>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        :root {
            --primary: #198754;
            --primary-light: #e8f5e9;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --radius: 18px;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        [data-theme="dark"] {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: #2e2e2e;
            --primary-light: #1b382b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }

        .app-shell { width: 100%; max-width: 480px; background-color: var(--bg); min-height: 100vh; padding: 16px; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }

        /* AUTH SCREEN */
        #auth-container { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 90vh; }
        .auth-card { background: var(--card-bg); padding: 24px; border-radius: var(--radius); width: 100%; box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; }
        .auth-card h2 { color: var(--primary); margin-bottom: 6px; }
        .auth-card p { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 16px; }

        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; color: var(--text-sub); }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card-bg); color: var(--text-main); outline: none; font-size: 0.9rem; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.8rem; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-secondary { background: var(--border); color: var(--text-main); }
        .btn-info { background: #0dcaf0; color: #000; }
        .btn-warning { background: #ffc107; color: #000; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-icon { width: 36px; height: 36px; border-radius: 50%; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); cursor: pointer; }

        /* HEADER & STATS */
        .profile-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .profile-left { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: #d1e7dd; color: #0f5132; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .user-info .email { font-size: 0.85rem; font-weight: 700; word-break: break-all; }
        .user-info .role { font-size: 0.7rem; font-weight: 800; color: var(--primary); text-transform: uppercase; }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
        .stat-box { background: var(--card-bg); border-radius: var(--radius); padding: 12px 6px; text-align: center; border: 1px solid var(--border); }
        .stat-icon { width: 32px; height: 32px; border-radius: 50%; margin: 0 auto 6px auto; display: flex; align-items: center; justify-content: center; }
        .stat-box h3 { font-size: 1.1rem; font-weight: 800; }
        .stat-box p { font-size: 0.7rem; color: var(--text-sub); }

        /* APP GRID */
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; margin-bottom: 24px; }
        .grid-item { display: flex; flex-direction: column; align-items: center; color: var(--text-main); cursor: pointer; }
        .grid-icon-wrapper { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-bottom: 4px; border: 1px solid rgba(0,0,0,0.04); }
        .grid-label { font-size: 0.72rem; font-weight: 600; text-align: center; }

        .card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); margin-bottom: 20px; }
        .card-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 12px; }

        /* SUBPAGE & TABLES */
        .sub-page { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 100; padding: 16px; overflow-y: auto; }
        .sub-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
        .sub-header h2 { font-size: 1rem; flex: 1; text-transform: uppercase; }

        .table-responsive { width: 100%; overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .table th, .table td { padding: 8px; border-bottom: 1px solid var(--border); text-align: left; }
        .table th { background: var(--primary-light); color: var(--primary); font-weight: 700; }

        .img-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; }
        .badge-success { background: #d1e7dd; color: #0f5132; }
        .badge-danger { background: #f8d7da; color: #842029; }

        .checklist-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .checklist-title { font-size: 0.82rem; font-weight: 700; margin-bottom: 4px; color: var(--primary); }
        .checklist-desc { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 8px; }
        .radio-group { display: flex; gap: 16px; margin-bottom: 8px; font-size: 0.8rem; font-weight: 600; }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card-bg); border-radius: var(--radius); width: 100%; max-width: 440px; max-height: 85vh; overflow-y: auto; padding: 20px; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .close-modal { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-sub); }
    </style>
</head>
<body>

    <div class="app-shell">

        <!-- AUTH SCREEN -->
        <div id="auth-container">
            <div class="auth-card">
                <h2><i class="fa-solid fa-building-circle-check"></i> BMS Mobile</h2>
                <p>Silakan login untuk melanjutkan</p>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email Pengguna</label>
                        <input type="email" id="login-email" class="form-control" placeholder="admin@bms.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" class="form-control" placeholder="******" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;"><i class="fa-solid fa-right-to-bracket"></i> Masuk Aplikasi</button>
                </form>
            </div>
        </div>

        <!-- DASHBOARD MAIN -->
        <div id="app-dashboard" style="display: none;">
            <div class="profile-header">
                <div class="profile-left">
                    <div class="avatar" id="user-avatar">MA</div>
                    <div class="user-info">
                        <div class="email" id="user-email">admin@bms.com</div>
                        <div class="role">ADMINISTRATOR</div>
                    </div>
                </div>
                <div>
                    <button class="btn-icon" id="theme-toggle"><i class="fa-solid fa-moon"></i></button>
                    <button class="btn-icon" id="btn-logout" style="color: #dc3545;"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                </div>
            </div>

            <!-- STATS BOXES -->
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-icon" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-building"></i></div>
                    <h3 id="stat-kantor">0</h3>
                    <p>Kantor</p>
                </div>
                <div class="stat-box">
                    <div class="stat-icon" style="background:#fff8e1; color:#ffa000;"><i class="fa-solid fa-boxes-stacked"></i></div>
                    <h3 id="stat-asset">0</h3>
                    <p>Asset</p>
                </div>
                <div class="stat-box">
                    <div class="stat-icon" style="background:#e3f2fd; color:#1e88e5;"><i class="fa-solid fa-credit-card"></i></div>
                    <h3 id="stat-atm">0</h3>
                    <p>Cek ATM</p>
                </div>
            </div>

            <!-- APP GRID MENU -->
            <div class="app-grid">
                <div class="grid-item" onclick="openSubPage('kantor')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-building"></i></div><span class="grid-label">Kantor</span></div>
                <div class="grid-item" onclick="openSubPage('asset')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-boxes-stacked"></i></div><span class="grid-label">Asset</span></div>
                <div class="grid-item" onclick="openSubPage('utilitas')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-bolt"></i></div><span class="grid-label">Utilitas</span></div>
                <div class="grid-item" onclick="openSubPage('perawatan')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-screwdriver-wrench"></i></div><span class="grid-label">Perawatan</span></div>
                <div class="grid-item" onclick="openSubPage('workorder')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-clipboard-list"></i></div><span class="grid-label">Work Order</span></div>
                <div class="grid-item" onclick="openSubPage('pemeriksaan_atm')"><div class="grid-icon-wrapper" style="background:#e0f2fe; color:#0284c7;"><i class="fa-solid fa-credit-card"></i></div><span class="grid-label">Cek ATM</span></div>
                <div class="grid-item" onclick="openSubPage('teknisi')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-user-gear"></i></div><span class="grid-label">Teknisi</span></div>
                <div class="grid-item" onclick="openSubPage('jadwal')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-calendar-days"></i></div><span class="grid-label">Jadwal</span></div>
                <div class="grid-item" onclick="openSubPage('laporan')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-file-invoice"></i></div><span class="grid-label">Laporan</span></div>
                <div class="grid-item" onclick="openSubPage('pengaturan')"><div class="grid-icon-wrapper" style="background:#fef3c7; color:#d97706;"><i class="fa-solid fa-gear"></i></div><span class="grid-label">Pengaturan</span></div>
                <div class="grid-item" onclick="scanQRModal()"><div class="grid-icon-wrapper" style="background:#f3e8ff; color:#9333ea;"><i class="fa-solid fa-qrcode"></i></div><span class="grid-label">Scan QR</span></div>
            </div>

            <!-- REALTIME CHART -->
            <div class="card">
                <div class="card-title">Grafik Perawatan Gedung Realtime</div>
                <canvas id="chartRealtime" style="max-height: 200px;"></canvas>
            </div>
        </div>

        <!-- SUB PAGE OVERLAY VIEW -->
        <div id="sub-page-overlay" class="sub-page">
            <div class="sub-header">
                <button class="btn-icon" onclick="closeSubPage()"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 id="sub-page-title">Detail Page</h2>
                <div id="sub-header-actions" style="display:flex; gap:6px;">
                    <button class="btn btn-warning" id="btn-manage-kriteria" style="display:none;" onclick="openManageKriteria()"><i class="fa-solid fa-list-check"></i> Kriteria</button>
                    <button class="btn-icon" id="sub-action-btn" style="background:var(--primary); color:#fff; display:none;"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
            <div id="sub-page-content"></div>
        </div>

    </div>

    <!-- MODAL POPUP -->
    <div class="modal" id="app-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h4 id="modal-title" style="font-size: 0.95rem;">Form Data</h4>
                <button class="close-modal" id="btn-close-modal">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- External Script Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        const SUPABASE_URL = "https://pykkfcszdihobpwhqinq.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5a2tmY3N6ZGlob2Jwd2hxaW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTEyNjEsImV4cCI6MjEwMTM2NzI2MX0.Ig1GsJvn0jDobVCBGlp2lLwTLvtn6eAkzKKf3VxMFiA";
        
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setupEventListeners();
        });

        async function checkAuth() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('app-dashboard').style.display = 'block';
                
                const emailStr = currentUser.email;
                document.getElementById('user-email').innerText = emailStr;
                document.getElementById('user-avatar').innerText = emailStr.substring(0, 2).toUpperCase();

                loadDashboardStats();
            } else {
                document.getElementById('auth-container').style.display = 'flex';
                document.getElementById('app-dashboard').style.display = 'none';
            }
        }

        function setupEventListeners() {
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                Swal.fire({ title: 'Proses Login...', didOpen: () => Swal.showLoading() });
                const { error } = await db.auth.signInWithPassword({ email, password });

                if (error) {
                    Swal.fire('Gagal Login', error.message, 'error');
                } else {
                    Swal.close();
                    checkAuth();
                }
            });

            document.getElementById('btn-logout').addEventListener('click', async () => {
                await db.auth.signOut();
                checkAuth();
            });

            document.getElementById('theme-toggle').addEventListener('click', () => {
                if (document.body.getAttribute('data-theme') === 'dark') {
                    document.body.removeAttribute('data-theme');
                } else {
                    document.body.setAttribute('data-theme', 'dark');
                }
            });

            document.getElementById('btn-close-modal').addEventListener('click', () => {
                document.getElementById('app-modal').style.display = 'none';
            });
        }

        async function loadDashboardStats() {
            const { count: countKantor } = await db.from('kantor').select('*', { count: 'exact', head: true });
            const { count: countAsset } = await db.from('asset').select('*', { count: 'exact', head: true });
            const { count: countATM } = await db.from('pemeriksaan_atm').select('*', { count: 'exact', head: true });

            document.getElementById('stat-kantor').innerText = countKantor || 0;
            document.getElementById('stat-asset').innerText = countAsset || 0;
            document.getElementById('stat-atm').innerText = countATM || 0;

            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('chartRealtime').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei'],
                    datasets: [{ label: 'Maintenance Routine', data: [12, 19, 15, 17, 22], backgroundColor: '#198754', borderRadius: 6 }]
                },
                options: { responsive: true, plugins: { legend: { display: true } } }
            });
        }

        // ROUTER SUB PAGE
        async function openSubPage(pageKey) {
            const overlay = document.getElementById('sub-page-overlay');
            const titleEl = document.getElementById('sub-page-title');
            const contentEl = document.getElementById('sub-page-content');
            const actionBtn = document.getElementById('sub-action-btn');
            const kriteriaBtn = document.getElementById('btn-manage-kriteria');

            titleEl.innerText = pageKey.replace('_', ' ').toUpperCase();
            contentEl.innerHTML = `<p style="text-align:center; padding:20px; color:var(--text-sub);"><i class="fa-solid fa-spinner fa-spin"></i> Memuat data...</p>`;
            actionBtn.style.display = 'none';
            kriteriaBtn.style.display = 'none';
            overlay.style.display = 'block';

            if (pageKey === 'kantor') {
                actionBtn.style.display = 'inline-flex';
                actionBtn.onclick = () => openFormKantor();
                const { data } = await db.from('kantor').select('*').order('created_at', {ascending:false});
                contentEl.innerHTML = `
                    <div class="table-responsive">
                        <table class="table">
                            <thead><tr><th>Nama</th><th>Alamat</th><th>Peta</th><th>Aksi</th></tr></thead>
                            <tbody>
                                ${data && data.length > 0 ? data.map(k => `
                                    <tr>
                                        <td><b>${k.nama}</b></td>
                                        <td>${k.alamat}</td>
                                        <td><button class="btn btn-secondary" style="padding:4px 8px;" onclick="viewMap('${k.nama}', ${k.latitude}, ${k.longitude})"><i class="fa-solid fa-map"></i></button></td>
                                        <td><button class="btn btn-danger" style="padding:4px 8px;" onclick="deleteRecord('kantor','${k.id}','kantor')"><i class="fa-solid fa-trash"></i></button></td>
                                    </tr>
                                `).join('') : '<tr><td colspan="4" style="text-align:center;">Belum ada data kantor</td></tr>'}
                            </tbody>
                        </table>
                    </div>`;
            } else if (pageKey === 'asset') {
                actionBtn.style.display = 'inline-flex';
                actionBtn.onclick = () => openFormAsset();
                const { data } = await db.from('asset').select('*, kantor(nama)').order('created_at', {ascending:false});
                contentEl.innerHTML = `
                    <div class="table-responsive">
                        <table class="table">
                            <thead><tr><th>Kode</th><th>Nama Asset</th><th>Status</th><th>QR</th><th>Aksi</th></tr></thead>
                            <tbody>
                                ${data && data.length > 0 ? data.map(a => `
                                    <tr>
                                        <td><b>${a.kode_asset}</b></td>
                                        <td>${a.nama_asset}</td>
                                        <td><span class="badge badge-${a.status === 'Baik' ? 'success' : 'danger'}">${a.status}</span></td>
                                        <td><button class="btn btn-secondary" style="padding:4px 8px;" onclick="showQR('${a.kode_asset}')"><i class="fa-solid fa-qrcode"></i></button></td>
                                        <td><button class="btn btn-danger" style="padding:4px 8px;" onclick="deleteRecord('asset','${a.id}','asset')"><i class="fa-solid fa-trash"></i></button></td>
                                    </tr>
                                `).join('') : '<tr><td colspan="5" style="text-align:center;">Belum ada data asset</td></tr>'}
                            </tbody>
                        </table>
                    </div>`;
            } else if (pageKey === 'pemeriksaan_atm') {
                actionBtn.style.display = 'inline-flex';
                kriteriaBtn.style.display = 'inline-flex';
                actionBtn.onclick = () => openFormPemeriksaanATM();
                const { data } = await db.from('pemeriksaan_atm').select('*, kantor(nama)').order('tanggal_pemeriksaan', {ascending:false});
                contentEl.innerHTML = `
                    <div class="table-responsive">
                        <table class="table">
                            <thead><tr><th>Lokasi/KCP</th><th>Kategori</th><th>Periode</th><th>Aksi</th></tr></thead>
                            <tbody>
                                ${data && data.length > 0 ? data.map(atm => `
                                    <tr>
                                        <td><b>${atm.kantor ? atm.kantor.nama : '-'}</b></td>
                                        <td><span class="badge badge-success">${atm.kategori_atm}</span></td>
                                        <td>${atm.periode_minggu}</td>
                                        <td>
                                            <button class="btn btn-info" style="padding:4px 8px;" onclick="viewDetailATM('${atm.id}', '${atm.kantor ? atm.kantor.nama : ''}', '${atm.periode_minggu}')"><i class="fa-solid fa-eye"></i></button>
                                            <button class="btn btn-primary" style="padding:4px 8px;" onclick="exportATMPDF('${atm.id}')"><i class="fa-solid fa-file-pdf"></i></button>
                                            <button class="btn btn-warning" style="padding:4px 8px;" onclick="exportATMExcel('${atm.id}')"><i class="fa-solid fa-file-excel"></i></button>
                                            <button class="btn btn-danger" style="padding:4px 8px;" onclick="deleteRecord('pemeriksaan_atm','${atm.id}','pemeriksaan_atm')"><i class="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                `).join('') : '<tr><td colspan="4" style="text-align:center;">Belum ada pemeriksaan ATM</td></tr>'}
                            </tbody>
                        </table>
                    </div>`;
            } else if (pageKey === 'utilitas') {
                actionBtn.style.display = 'inline-flex';
                actionBtn.onclick = () => openFormUtilitas();
                const { data } = await db.from('utilitas').select('*, kantor(nama)').order('created_at', {ascending:false});
                contentEl.innerHTML = `
                    <div class="table-responsive">
                        <table class="table">
                            <thead><tr><th>Jenis</th><th>Pemakaian</th><th>Biaya (Rp)</th></tr></thead>
                            <tbody>
                                ${data && data.length > 0 ? data.map(u => `

        // ==========================================
        // FITUR EXPORT PDF & EXCEL PERSIS FORMULIR ATM
        // ==========================================
        async function exportATMPDF(id) {
            Swal.fire({ title: 'Mencetak PDF Laporan ATM...', didOpen: () => Swal.showLoading() });

            // Fetch Header & Detail Data
            const { data: header } = await db.from('pemeriksaan_atm').select('*, kantor(nama, alamat)').eq('id', id).single();
            const { data: details } = await db.from('pemeriksaan_atm_detail').select('*').eq('pemeriksaan_id', id).order('no_kriteria', {ascending:true});

            if (!header || !details) {
                return Swal.fire('Error', 'Gagal mengambil data laporan ATM', 'error');
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');

            // 1. HEADER JUDUL SURAT
            doc.setFont('Helvetica', 'bold');
            doc.setFontSize(11);
            doc.text("LAPORAN PEMERIKSAAN ATM MINGGUAN", 105, 15, { align: 'center' });
            doc.setFont('Helvetica', 'normal');
            doc.setFontSize(9);
            doc.text("Pemeriksaan Rutin Fasilitas & Mesin ATM (Onsite & Offsite)", 105, 20, { align: 'center' });

            // 2. ATRIBUT UNIT / KCP
            doc.setFontSize(8.5);
            doc.text(`UNIT                  : ${header.kantor ? header.kantor.nama : '-'}`, 14, 28);
            doc.text(`Kategori ATM  : [ ${header.kategori_atm === 'Onsite' ? 'X' : ' '} ] Onsite   [ ${header.kategori_atm === 'Offsite' ? 'X' : ' '} ] Offsite`, 110, 28);

            doc.text(`Lokasi / KCP     : ${header.kantor ? header.kantor.alamat : '-'}`, 14, 33);
            doc.text(`Periode Minggu : ${header.periode_minggu}`, 110, 33);

            doc.text(`Tanggal Cek       : ${header.tanggal_pemeriksaan}`, 14, 38);

            // 3. TABEL KRITERIA (AUTOTABLE)
            const tableBody = details.map(d => [
                d.no_kriteria,
                d.kriteria_nama,
                d.kondisi === 'BAIK' ? '[ X ] BAIK   [   ] TIDAK BAIK' : '[   ] BAIK   [ X ] TIDAK BAIK',
                d.keterangan || '-'
            ]);

            doc.autoTable({
                startY: 42,
                head: [['No', 'Kriteria Pemeriksaan', 'Kondisi', 'Keterangan']],
                body: tableBody,
                theme: 'grid',
                styles: { fontSize: 7.5, cellPadding: 2, textOverflow: 'clip' },
                headStyles: { fillColor: [232, 245, 233], textColor: [25, 135, 84], fontStyle: 'bold' },
                columnStyles: {
                    0: { cellWidth: 8, halign: 'center' },
                    1: { cellWidth: 85 },
                    2: { cellWidth: 45 },
                    3: { cellWidth: 44 }
                }
            });

            // 4. LAMPIRAN PEMBERSIHAN / FOTO
            let finalY = doc.lastAutoTable.finalY + 8;
            if (finalY > 260) { doc.addPage(); finalY = 15; }

            doc.setFont('Helvetica', 'bold');
            doc.setFontSize(9);
            doc.text("LAMPIRAN FOTO BUKTI PEMERIKSAAN", 14, finalY);

            // Ambil Foto jika ada
            const fotoItems = details.filter(d => d.foto_bukti);
            if (fotoItems.length > 0) {
                let imgX = 14;
                let imgY = finalY + 4;
                for (let i = 0; i < fotoItems.length; i++) {
                    if (imgY > 250) { doc.addPage(); imgY = 15; imgX = 14; }
                    try {
                        doc.text(`No. ${fotoItems[i].no_kriteria} (${fotoItems[i].kriteria_nama})`, imgX, imgY);
                        doc.addImage(fotoItems[i].foto_bukti, 'JPEG', imgX, imgY + 2, 40, 30);
                        imgX += 45;
                        if ((i + 1) % 4 === 0) {
                            imgX = 14;
                            imgY += 38;
                        }
                    } catch (err) {
                        console.log('Gagal embed foto di PDF:', err);
                    }
                }
            } else {
                doc.setFont('Helvetica', 'normal');
                doc.setFontSize(8);
                doc.text("Tidak ada lampiran foto yang diunggah.", 14, finalY + 6);
            }

            Swal.close();
            doc.save(`Laporan_ATM_${header.kantor ? header.kantor.nama : 'Unit'}_${Date.now()}.pdf`);
        }

        async function exportATMExcel(id) {
            Swal.fire({ title: 'Menyiapkan Excel Laporan ATM...', didOpen: () => Swal.showLoading() });

            const { data: header } = await db.from('pemeriksaan_atm').select('*, kantor(nama, alamat)').eq('id', id).single();
            const { data: details } = await db.from('pemeriksaan_atm_detail').select('*').eq('pemeriksaan_id', id).order('no_kriteria', {ascending:true});

            if (!header || !details) {
                return Swal.fire('Error', 'Gagal mengambil data laporan ATM', 'error');
            }

            const excelRows = [
                ["LAPORAN PEMERIKSAAN ATM MINGGUAN"],
                ["Pemeriksaan Rutin Fasilitas & Mesin ATM"],
                [],
                ["UNIT", header.kantor ? header.kantor.nama : '-', "KATEGORI ATM", header.kategori_atm],
                ["LOKASI / KCP", header.kantor ? header.kantor.alamat : '-', "PERIODE MINGGU", header.periode_minggu],
                ["TANGGAL", header.tanggal_pemeriksaan],
                [],
                ["No", "Kriteria Pemeriksaan", "Kondisi", "Keterangan", "URL Foto Bukti"]
            ];

            details.forEach(d => {
                excelRows.push([
                    d.no_kriteria,
                    d.kriteria_nama,
                    d.kondisi,
                    d.keterangan || '-',
                    d.foto_bukti || '-'
                ]);
            });

            const worksheet = XLSX.utils.aoa_to_sheet(excelRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Pemeriksaan_ATM");

            Swal.close();
            XLSX.writeFile(workbook, `Laporan_ATM_${header.kantor ? header.kantor.nama : 'Unit'}_${Date.now()}.xlsx`);
        }

        function openFormUtilitas() {
            db.from('kantor').select('id, nama').then(({data: kantorList}) => {
                if (!kantorList || kantorList.length === 0) return Swal.fire('Peringatan', 'Tambah data kantor dulu!', 'warning');
                document.getElementById('modal-title').innerText = "Catat Utilitas";
                document.getElementById('modal-body').innerHTML = `
                    <form id="f-utilitas">
                        <div class="form-group"><label>Kantor</label><select id="fu-kantor" class="form-control">${kantorList.map(k=>`<option value="${k.id}">${k.nama}</option>`).join('')}</select></div>
                        <div class="form-group"><label>Jenis Utilitas</label><select id="fu-jenis" class="form-control"><option value="Listrik">Listrik</option><option value="Air">Air</option><option value="Gas">Gas</option></select></div>
                        <div class="form-group"><label>Pemakaian</label><input type="number" id="fu-jumlah" class="form-control" required></div>
                        <div class="form-group"><label>Satuan</label><input type="text" id="fu-satuan" class="form-control" value="kWh" required></div>
                        <div class="form-group"><label>Biaya (Rp)</label><input type="number" id="fu-biaya" class="form-control" required></div>
                        <div class="form-group"><label>Tanggal</label><input type="date" id="fu-bulan" class="form-control" required></div>
                        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Simpan Utilitas</button>
                    </form>`;
                document.getElementById('app-modal').style.display = 'flex';

                document.getElementById('f-utilitas').onsubmit = async (e) => {
                    e.preventDefault();
                    Swal.fire({ title: 'Menyimpan...', didOpen: () => Swal.showLoading() });
                    const { error } = await db.from('utilitas').insert([{
                        kantor_id: document.getElementById('fu-kantor').value,
                        jenis: document.getElementById('fu-jenis').value,
                        jumlah_pemakaian: document.getElementById('fu-jumlah').value,
                        satuan: document.getElementById('fu-satuan').value,
                        biaya: document.getElementById('fu-biaya').value,
                        bulan_tahun: document.getElementById('fu-bulan').value
                    }]);
                    if (error) Swal.fire('Gagal', error.message, 'error');
                    else {
                        Swal.fire('Berhasil', 'Utilitas tersimpan', 'success');
                        document.getElementById('app-modal').style.display = 'none';
                        openSubPage('utilitas');
                    }
                };
            });
        }

        function openFormWO() {
            db.from('asset').select('id, nama_asset').then(({data: assetList}) => {
                if (!assetList || assetList.length === 0) return Swal.fire('Peringatan', 'Tambah data asset dulu!', 'warning');
                document.getElementById('modal-title').innerText = "Buat Work Order";
                document.getElementById('modal-body').innerHTML = `
                    <form id="f-wo">
                        <div class="form-group"><label>Asset</label><select id="fw-asset" class="form-control">${assetList.map(a=>`<option value="${a.id}">${a.nama_asset}</option>`).join('')}</select></div>
                        <div class="form-group"><label>Judul Pekerjaan</label><input type="text" id="fw-judul" class="form-control" required></div>
                        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Simpan Work Order</button>
                    </form>`;
                document.getElementById('app-modal').style.display = 'flex';

                document.getElementById('f-wo').onsubmit = async (e) => {
                    e.preventDefault();
                    Swal.fire({ title: 'Menyimpan...', didOpen: () => Swal.showLoading() });
                    const { error } = await db.from('work_orders').insert([{
                        asset_id: document.getElementById('fw-asset').value,
                        judul: document.getElementById('fw-judul').value,
                        status: 'Pending'
                    }]);
                    if (error) Swal.fire('Gagal', error.message, 'error');
                    else {
                        Swal.fire('Berhasil', 'WO tersimpan', 'success');
                        document.getElementById('app-modal').style.display = 'none';
                        openSubPage('workorder');
                        loadDashboardStats();
                    }
                };
            });
        }

        function openFormPerawatan() {
            Promise.all([db.from('work_orders').select('id, judul'), db.from('teknisi').select('id, nama')]).then(([woRes, tekRes]) => {
                if (!woRes.data || woRes.data.length === 0) return Swal.fire('Peringatan', 'Buat Work Order dulu!', 'warning');
                document.getElementById('modal-title').innerText = "Input Hasil Perawatan";
                document.getElementById('modal-body').innerHTML = `
                    <form id="f-main">
                        <div class="form-group"><label>Work Order</label><select id="fm-wo" class="form-control">${woRes.data.map(w=>`<option value="${w.id}">${w.judul}</option>`).join('')}</select></div>
                        <div class="form-group"><label>Teknisi</label><select id="fm-teknisi" class="form-control">${tekRes.data ? tekRes.data.map(t=>`<option value="${t.id}">${t.nama}</option>`).join('') : '<option value="">-</option>'}</select></div>
                        <div class="form-group"><label>Foto Before</label><input type="file" id="fm-before" class="form-control" accept="image/*"></div>
                        <div class="form-group"><label>Foto After</label><input type="file" id="fm-after" class="form-control" accept="image/*"></div>
                        <div class="form-group"><label>Biaya (Rp)</label><input type="number" id="fm-biaya" class="form-control" value="0"></div>
                        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Simpan Pengerjaan</button>
                    </form>`;
                document.getElementById('app-modal').style.display = 'flex';

                document.getElementById('f-main').onsubmit = async (e) => {
                    e.preventDefault();
                    Swal.fire({ title: 'Mengunggah...', didOpen: () => Swal.showLoading() });
                    let beforeUrl = null, afterUrl = null;
                    const fileBefore = document.getElementById('fm-before').files[0];
                    const fileAfter = document.getElementById('fm-after').files[0];

                    if (fileBefore) {
                        const fname = `before_${Date.now()}_${fileBefore.name}`;
                        await db.storage.from('bms-photos').upload(fname, fileBefore);
                        beforeUrl = db.storage.from('bms-photos').getPublicUrl(fname).data.publicUrl;
                    }
                    if (fileAfter) {
                        const fname = `after_${Date.now()}_${fileAfter.name}`;
                        await db.storage.from('bms-photos').upload(fname, fileAfter);
                        afterUrl = db.storage.from('bms-photos').getPublicUrl(fname).data.publicUrl;
                    }

                    const { error } = await db.from('maintenances').insert([{
                        work_order_id: document.getElementById('fm-wo').value,
                        teknisi_id: document.getElementById('fm-teknisi').value || null,
                        foto_before: beforeUrl, foto_after: afterUrl,
                        biaya: document.getElementById('fm-biaya').value,
                        tanggal_selesai: new Date()
                    }]);

                    if (error) Swal.fire('Gagal', error.message, 'error');
                    else {
                        Swal.fire('Berhasil', 'Pengerjaan tersimpan', 'success');
                        document.getElementById('app-modal').style.display = 'none';
                        openSubPage('perawatan');
                    }
                };
            });
        }

        function openFormTeknisi() {
            document.getElementById('modal-title').innerText = "Tambah Teknisi";
            document.getElementById('modal-body').innerHTML = `
                <form id="f-teknisi">
                    <div class="form-group"><label>Nama Lengkap</label><input type="text" id="ft-nama" class="form-control" required></div>
                    <div class="form-group"><label>Spesialisasi</label><input type="text" id="ft-spesialisasi" class="form-control" placeholder="AC, Electrical" required></div>
                    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Simpan Teknisi</button>
                </form>`;
            document.getElementById('app-modal').style.display = 'flex';

            document.getElementById('f-teknisi').onsubmit = async (e) => {
                e.preventDefault();
                Swal.fire({ title: 'Menyimpan...', didOpen: () => Swal.showLoading() });
                const { error } = await db.from('teknisi').insert([{ nama: document.getElementById('ft-nama').value, spesialisasi: document.getElementById('ft-spesialisasi').value, status: 'Tersedia' }]);
                if (error) Swal.fire('Gagal', error.message, 'error');
                else {
                    Swal.fire('Berhasil', 'Teknisi tersimpan', 'success');
                    document.getElementById('app-modal').style.display = 'none';
                    openSubPage('teknisi');
                }
            };
        }

        async function deleteRecord(table, id, page) {
            if (confirm('Hapus data ini?')) {
                await db.from(table).delete().eq('id', id);
                openSubPage(page);
                loadDashboardStats();
            }
        }

        function viewMap(nama, lat, lng) {
            document.getElementById('modal-title').innerText = `Peta: ${nama}`;
            document.getElementById('modal-body').innerHTML = `<iframe width="100%" height="240" style="border:0; border-radius:8px;" src="https://maps.google.com/maps?q=${lat || -6.200000},${lng || 106.816666}&z=15&output=embed"></iframe>`;
            document.getElementById('app-modal').style.display = 'flex';
        }

        function showQR(kode) {
            document.getElementById('modal-title').innerText = `QR Code: ${kode}`;
            document.getElementById('modal-body').innerHTML = `<div id="qrcode" style="display:flex; justify-content:center; padding:15px;"></div>`;
            document.getElementById('app-modal').style.display = 'flex';
            new QRCode(document.getElementById("qrcode"), { text: kode, width: 160, height: 160 });
        }

        function scanQRModal() {
            Swal.fire('Scan QR Code', 'Gunakan kamera smartphone untuk memindai QR Code Asset.', 'info');
        }

        async function exportExcel() {
            const { data } = await db.from('asset').select('kode_asset, nama_asset, kategori, status');
            const ws = XLSX.utils.json_to_sheet(data || []);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Asset");
            XLSX.writeFile(wb, "Laporan_Asset.xlsx");
        }

        async function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const { data } = await db.from('kantor').select('nama, alamat');
            doc.text("Laporan Data Kantor Gedung", 14, 20);
            let y = 30;
            (data || []).forEach((k, i) => {
                doc.text(`${i+1}. ${k.nama} - ${k.alamat}`, 14, y);
                y += 10;
            });
            doc.save("Laporan_Kantor.pdf");
        }
    </script>
</body>
</html>
