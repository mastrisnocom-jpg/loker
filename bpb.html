<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Building Management System</title>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        :root {
            --primary: #198754;
            --primary-light: #e8f5e9;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --radius: 18px;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        [data-theme="dark"] {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: #2e2e2e;
            --primary-light: #1b382b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }

        .app-shell { width: 100%; max-width: 480px; background-color: var(--bg); min-height: 100vh; padding: 16px; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }

        /* AUTH SCREEN */
        #auth-container { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 90vh; }
        .auth-card { background: var(--card-bg); padding: 24px; border-radius: var(--radius); width: 100%; box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; }
        .auth-card h2 { color: var(--primary); margin-bottom: 6px; }
        .auth-card p { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 16px; }

        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; color: var(--text-sub); }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card-bg); color: var(--text-main); outline: none; font-size: 0.9rem; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.8rem; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-secondary { background: var(--border); color: var(--text-main); }
        .btn-info { background: #0dcaf0; color: #000; }
        .btn-warning { background: #ffc107; color: #000; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-icon { width: 36px; height: 36px; border-radius: 50%; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); cursor: pointer; }

        /* HEADER & STATS */
        .profile-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .profile-left { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: #d1e7dd; color: #0f5132; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .user-info .email { font-size: 0.85rem; font-weight: 700; word-break: break-all; }
        .user-info .role { font-size: 0.7rem; font-weight: 800; color: var(--primary); text-transform: uppercase; }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
        .stat-box { background: var(--card-bg); border-radius: var(--radius); padding: 12px 6px; text-align: center; border: 1px solid var(--border); }
        .stat-icon { width: 32px; height: 32px; border-radius: 50%; margin: 0 auto 6px auto; display: flex; align-items: center; justify-content: center; }
        .stat-box h3 { font-size: 1.1rem; font-weight: 800; }
        .stat-box p { font-size: 0.7rem; color: var(--text-sub); }

        /* APP GRID */
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; margin-bottom: 24px; }
        .grid-item { display: flex; flex-direction: column; align-items: center; color: var(--text-main); cursor: pointer; }
        .grid-icon-wrapper { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-bottom: 4px; border: 1px solid rgba(0,0,0,0.04); }
        .grid-label { font-size: 0.72rem; font-weight: 600; text-align: center; }

        .card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); margin-bottom: 20px; }
        .card-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 12px; }

        /* SUBPAGE & TABLES */
        .sub-page { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 100; padding: 16px; overflow-y: auto; }
        .sub-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
        .sub-header h2 { font-size: 1rem; flex: 1; text-transform: uppercase; }

        .table-responsive { width: 100%; overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .table th, .table td { padding: 8px; border-bottom: 1px solid var(--border); text-align: left; }
        .table th { background: var(--primary-light); color: var(--primary); font-weight: 700; }

        .img-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; }
        .badge-success { background: #d1e7dd; color: #0f5132; }
        .badge-danger { background: #f8d7da; color: #842029; }

        .checklist-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .checklist-title { font-size: 0.82rem; font-weight: 700; margin-bottom: 4px; color: var(--primary); }
        .checklist-desc { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 8px; }
        .radio-group { display: flex; gap: 16px; margin-bottom: 8px; font-size: 0.8rem; font-weight: 600; }

        .signature-pad { border: 1px dashed var(--border); border-radius: 8px; background: #fff; width: 100%; height: 120px; touch-action: none; cursor: crosshair; }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card-bg); border-radius: var(--radius); width: 100%; max-width: 440px; max-height: 85vh; overflow-y: auto; padding: 20px; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .close-modal { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-sub); }
    </style>
</head>

        // ==========================================
        // KOMPRESI GAMBAR OTOMATIS < 200 KB
        // ==========================================
        async function compressImage(file, maxSizeKB = 200) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        const MAX_DIMENSION = 1600;
                        if (width > height) {
                            if (width > MAX_DIMENSION) {
                                height = Math.round((height * MAX_DIMENSION) / width);
                                width = MAX_DIMENSION;
                            }
                        } else {
                            if (height > MAX_DIMENSION) {
                                width = Math.round((width * MAX_DIMENSION) / height);
                                height = MAX_DIMENSION;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        let quality = 0.85;

                        function loopCompress() {
                            canvas.toBlob((blob) => {
                                if (!blob) {
                                    reject(new Error("Gagal kompresi"));
                                    return;
                                }
                                if (blob.size / 1024 > maxSizeKB && quality > 0.2) {
                                    quality -= 0.08;
                                    loopCompress();
                                } else {
                                    const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", {
                                        type: 'image/jpeg',
                                        lastModified: Date.now()
                                    });
                                    resolve(compressedFile);
                                }
                            }, 'image/jpeg', quality);
                        }

                        loopCompress();
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        async function loadDashboardStats() {
            const { count: countKantor } = await db.from('kantor').select('*', { count: 'exact', head: true });

            document.getElementById('stat-asset').innerText = countAsset || 0;
            document.getElementById('stat-atm').innerText = countATM || 0;

            renderChart();
        }

                    datasets: [{ label: 'Maintenance Routine', data: [12, 19, 15, 17, 22], backgroundColor: '#198754', borderRadius: 6 }]
                },
                options: { responsive: true, plugins: { legend: { display: true } } }
            });
        }

        async function exportATMPDF(id) {
            Swal.fire({ title: 'Mencetak PDF Laporan ATM...', didOpen: () => Swal.showLoading() });

            const { data: header } = await db.from('pemeriksaan_atm').select('*, kantor(nama, alamat)').eq('id', id).single();
            const { data: details } = await db.from('pemeriksaan_atm_detail').select('*').eq('pemeriksaan_id', id).order('no_kriteria', {ascending:true});
            const { data: masterKriteria } = await db.from('kriteria_atm').select('*');

            if (!header || !details) return Swal.fire('Error', 'Gagal mengambil data laporan ATM', 'error');

            const descMap = {};
            if (masterKriteria) {
                masterKriteria.forEach(m => { descMap[m.no_kriteria] = m.deskripsi || ''; });
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');

            // Header Dokumen
            doc.setFont('Helvetica', 'bold');
            doc.setFontSize(11);
            doc.text("LAPORAN PEMERIKSAAN ATM MINGGUAN", 105, 15, { align: 'center' });
            doc.setFont('Helvetica', 'normal');
            doc.setFontSize(8.5);
            doc.text("Pemeriksaan Rutin Fasilitas & Mesin ATM (Onsite & Offsite)", 105, 20, { align: 'center' });

            doc.setFontSize(8);
            doc.text(`UNIT                  : ${header.kantor ? header.kantor.nama : '-'}`, 14, 28);
            
            const onsiteCheck = header.kategori_atm === 'Onsite' ? '[ V ]' : '[   ]';
            const offsiteCheck = header.kategori_atm === 'Offsite' ? '[ V ]' : '[   ]';
            doc.text(`Kategori ATM  : ${onsiteCheck} Onsite   ${offsiteCheck} Offsite`, 110, 28);

            doc.text(`Lokasi / KCP     : ${header.kantor ? header.kantor.alamat : '-'}`, 14, 33);
            doc.text(`Periode Minggu : ${header.periode_minggu}`, 110, 33);
            doc.text(`Tanggal Cek       : ${header.tanggal_pemeriksaan}`, 14, 38);

            // TABEL KRITERIA DENGAN POSISI TEKS & FOTO TERPISAH TIDAK BERTUMPUK
            doc.autoTable({
                startY: 42,
                head: [['No', 'Kriteria Pemeriksaan', 'Kondisi', 'Keterangan dan Foto']],
                body: details.map(d => [
                    d.no_kriteria,
                    d.kriteria_nama, 
                    d.kondisi === 'BAIK' ? '[ V ] BAIK    [   ] TIDAK BAIK' : '[   ] BAIK    [ V ] TIDAK BAIK',
                    (d.keterangan || '-') + (d.foto_bukti ? '\n\n\n\n\n' : '') // Beri ruang kosong untuk foto di bawah teks
                ]),
                theme: 'grid',
                styles: { fontSize: 7.5, cellPadding: 2, font: 'Helvetica', valign: 'top' },
                headStyles: { fillColor: [232, 245, 233], textColor: [25, 135, 84], fontStyle: 'bold' },
                columnStyles: { 
                    0: { cellWidth: 8, halign: 'center' }, 
                    1: { cellWidth: 80 }, 
                    2: { cellWidth: 48 }, 
                    3: { cellWidth: 46 } 
                },
                didParseCell: function(data) {
                    if (data.section === 'body' && data.column.index === 1) {
                        const noK = data.row.cells[0].raw;
                        const desc = descMap[noK] ? `\n${descMap[noK]}` : '';
                        data.cell.text = [data.cell.text[0], desc]; 
                    }
                },
                didDrawCell: function(data) {
                    // Embed Foto Bukti per Kriteria Presisi di Bawah Teks Keterangan
                    if (data.section === 'body' && data.column.index === 3) {
                        const rowIdx = data.row.index;
                        const detailItem = details[rowIdx];
                        if (detailItem && detailItem.foto_bukti) {
                            try {
                                const imgWidth = 20;
                                const imgHeight = 15;
                                const imgX = data.cell.x + (data.cell.width - imgWidth) / 2;
                                const imgY = data.cell.y + data.cell.height - imgHeight - 2;
                                doc.addImage(detailItem.foto_bukti, 'JPEG', imgX, imgY, imgWidth, imgHeight);
                            } catch(e){}
                        }
                    }
                }
            });

            let finalY = doc.lastAutoTable.finalY + 8;
            if (finalY > 210) { doc.addPage(); finalY = 20; }

            // TABEL LAMPIRAN FOTO PEMBERSIHAN (BEFORE & AFTER RAPI DALAM BINGKAI)
            doc.setFont('Helvetica', 'bold');
            doc.setFontSize(8.5);
            doc.text("LAMPIRAN PEMBERSIHAN", 14, finalY);

            doc.autoTable({
                startY: finalY + 3,
                head: [['Bukti Foto - SEBELUM (Before)', 'Bukti Foto - SESUDAH (After)']],
                body: [['\n\n\n\n\n\n\n', '\n\n\n\n\n\n\n']],
                theme: 'grid',
                styles: { fontSize: 8, halign: 'center', cellPadding: 2, font: 'Helvetica' },
                headStyles: { fillColor: [255, 255, 255], textColor: [0, 0, 0], fontStyle: 'bold' },
                columnStyles: { 0: { cellWidth: 91 }, 1: { cellWidth: 91 } },
                didDrawCell: function(data) {
                    if (data.section === 'body') {
                        if (data.column.index === 0 && header.foto_pembersihan_before) {
                            try {
                                const imgX = data.cell.x + (data.cell.width - 38) / 2;
                                const imgY = data.cell.y + (data.cell.height - 25) / 2;
                                doc.addImage(header.foto_pembersihan_before, 'JPEG', imgX, imgY, 38, 25);
                            } catch(e){}
                        } else if (data.column.index === 1 && header.foto_pembersihan_after) {
                            try {
                                const imgX = data.cell.x + (data.cell.width - 38) / 2;
                                const imgY = data.cell.y + (data.cell.height - 25) / 2;
                                doc.addImage(header.foto_pembersihan_after, 'JPEG', imgX, imgY, 38, 25);
                            } catch(e){}
                        }
                    }
                }
            });

            finalY = doc.lastAutoTable.finalY + 12;
            if (finalY > 235) { doc.addPage(); finalY = 20; }

            // PENGESAHAN TANDA TANGAN POLOS (TANPA GARIS BINGKAI KOTAK)
            const vendorTitle = header.vendor_nama || 'PT Binayasa Purabatara Unit ______';
            const bankTitle = header.bank_cabang || 'PT Bank Tabungan Negara Cabang ______';
            const petugasName = header.petugas_nama ? `( ${header.petugas_nama} )` : '(_______________________)';
            const supervisorName = header.supervisor_nama ? `( ${header.supervisor_nama} )` : '(_______________________)';

            doc.setFont('Helvetica', 'normal');
            doc.setFontSize(8);
            
            // Sisi Kiri
            doc.text("Dibuat oleh,", 14, finalY);
            doc.text(vendorTitle, 14, finalY + 4);
            
            // Sisi Kanan
            doc.text("Mengetahui,", 110, finalY);
            doc.text(bankTitle, 110, finalY + 4);

            // Render Gambar TTD Digital Canvas
            if (header.tanda_tangan_petugas) {
                try { doc.addImage(header.tanda_tangan_petugas, 'PNG', 14, finalY + 6, 35, 16); } catch (e) {}
            }

            // Nama Petugas & Supervisor
            doc.text(petugasName, 14, finalY + 26);
            doc.text(supervisorName, 110, finalY + 26);

            Swal.close();
            doc.save(`Laporan_ATM_${header.kantor ? header.kantor.nama : 'Unit'}_${Date.now()}.pdf`);
        }

        let isDrawing = false;
        function initCanvasTTD() {
            const canvas = document.getElementById('canvas-ttd');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#000000';

            const startDrawing = (e) => {
                isDrawing = true;
                ctx.beginPath();
                const rect = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                ctx.moveTo(x, y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const rect = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const stopDrawing = () => { isDrawing = false; };

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);

            canvas.addEventListener('touchstart', startDrawing);
            canvas.addEventListener('touchmove', draw);
            canvas.addEventListener('touchend', stopDrawing);
        }

        function clearCanvasTTD() {
            const canvas = document.getElementById('canvas-ttd');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function scanQRModal() {
            Swal.fire('Scan QR Code', 'Gunakan kamera smartphone untuk memindai QR Code Asset.', 'info');
        }

        async function exportExcel() {
            const { data } = await db.from('asset').select('kode_asset, nama_asset, kategori, status');
            const ws = XLSX.utils.json_to_sheet(data || []);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Asset");
            XLSX.writeFile(wb, "Laporan_Asset.xlsx");
        }

        async function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const { data } = await db.from('kantor').select('nama, alamat');
            doc.text("Laporan Data Kantor Gedung", 14, 20);
            let y = 30;
            (data || []).forEach((k, i) => {
                doc.text(`${i+1}. ${k.nama} - ${k.alamat}`, 14, y);
                y += 10;
            });
            doc.save("Laporan_Kantor.pdf");
        }
    </script>
</body>
</html>
