<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Building Management System</title>
    
    <!-- Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        :root {
            --primary: #198754;
            --primary-light: #e8f5e9;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --radius: 18px;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        [data-theme="dark"] {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: #2e2e2e;
            --primary-light: #1b382b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }

        .app-shell { width: 100%; max-width: 480px; background-color: var(--bg); min-height: 100vh; padding: 16px; position: relative; }

        #auth-container { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 90vh; }
        .auth-card { background: var(--card-bg); padding: 24px; border-radius: var(--radius); width: 100%; box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; }
        .auth-card h2 { color: var(--primary); margin-bottom: 6px; }
        .auth-card p { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 16px; }

        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; color: var(--text-sub); }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card-bg); color: var(--text-main); outline: none; font-size: 0.9rem; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
        .btn-primary { background: var(--primary); color: #fff; width: 100%; }
        .btn-icon { width: 36px; height: 36px; border-radius: 50%; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); cursor: pointer; }

        .profile-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .profile-left { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: #d1e7dd; color: #0f5132; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .user-info .email { font-size: 0.85rem; font-weight: 700; word-break: break-all; }
        .user-info .role { font-size: 0.7rem; font-weight: 800; color: var(--primary); text-transform: uppercase; }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
        .stat-box { background: var(--card-bg); border-radius: var(--radius); padding: 12px 6px; text-align: center; border: 1px solid var(--border); }
        .stat-icon { width: 32px; height: 32px; border-radius: 50%; margin: 0 auto 6px auto; display: flex; align-items: center; justify-content: center; }
        .stat-box h3 { font-size: 1.1rem; font-weight: 800; }
        .stat-box p { font-size: 0.7rem; color: var(--text-sub); }

        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; margin-bottom: 24px; }
        .grid-item { display: flex; flex-direction: column; align-items: center; color: var(--text-main); cursor: pointer; }
        .grid-icon-wrapper { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-bottom: 4px; border: 1px solid rgba(0,0,0,0.04); }
        .grid-label { font-size: 0.72rem; font-weight: 600; text-align: center; }

        .card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); margin-bottom: 20px; }
        .card-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 12px; }

        .sub-page { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 100; padding: 16px; overflow-y: auto; }
        .sub-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }

        .table-responsive { width: 100%; overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .table th, .table td { padding: 8px; border-bottom: 1px solid var(--border); text-align: left; }
        .table th { background: var(--primary-light); color: var(--primary); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card-bg); border-radius: var(--radius); width: 100%; max-width: 400px; padding: 20px; }
    </style>
</head>
<body>

    <div class="app-shell">

        <!-- AUTH SCREEN -->
        <div id="auth-container">
            <div class="auth-card">
                <h2><i class="fa-solid fa-building-circle-check"></i> BMS Mobile</h2>
                <p>Konfigurasi Supabase & Login</p>
                <form id="login-form">
                    <div class="form-group">
                        <label>Supabase URL</label>
                        <input type="text" id="cfg-url" class="form-control" value="https://pykkfcszdihobpwhqinq.supabase.co" required>
                    </div>
                    <div class="form-group">
                        <label>Anon Public Key (JWT)</label>
                        <input type="text" id="cfg-key" class="form-control" placeholder="eyJhbGciOi..." required>
                    </div>
                    <hr style="margin: 12px 0; border: none; border-top: 1px solid var(--border);">
                    <div class="form-group">
                        <label>Email Pengguna</label>
                        <input type="email" id="login-email" class="form-control" placeholder="admin@bms.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" class="form-control" placeholder="******" required>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Masuk Aplikasi</button>
                </form>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="app-dashboard" style="display: none;">
            <div class="profile-header">
                <div class="profile-left">
                    <div class="avatar" id="user-avatar">MA</div>
                    <div class="user-info">
                        <div class="email" id="user-email">admin@bms.com</div>
                        <div class="role">ADMINISTRATOR</div>
                    </div>
                </div>
                <div>
                    <button class="btn-icon" id="theme-toggle"><i class="fa-solid fa-moon"></i></button>
                    <button class="btn-icon" id="btn-logout" style="color: #dc3545;"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-icon" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-building"></i></div>
                    <h3 id="stat-kantor">0</h3>
                    <p>Kantor</p>
                </div>
                <div class="stat-box">
                    <div class="stat-icon" style="background:#fff8e1; color:#ffa000;"><i class="fa-solid fa-boxes-stacked"></i></div>
                    <h3 id="stat-asset">0</h3>
                    <p>Asset</p>
                </div>
                <div class="stat-box">
                    <div class="stat-icon" style="background:#e3f2fd; color:#1e88e5;"><i class="fa-solid fa-clipboard-list"></i></div>
                    <h3 id="stat-wo">0</h3>
                    <p>Work Order</p>
                </div>
            </div>

            <div class="app-grid">
                <div class="grid-item" onclick="openSubPage('kantor')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-building"></i></div><span class="grid-label">Kantor</span></div>
                <div class="grid-item" onclick="openSubPage('asset')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-boxes-stacked"></i></div><span class="grid-label">Asset</span></div>
                <div class="grid-item" onclick="openSubPage('utilitas')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-bolt"></i></div><span class="grid-label">Utilitas</span></div>
                <div class="grid-item" onclick="openSubPage('perawatan')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-screwdriver-wrench"></i></div><span class="grid-label">Perawatan</span></div>
                <div class="grid-item" onclick="openSubPage('workorder')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-clipboard-list"></i></div><span class="grid-label">Work Order</span></div>
                <div class="grid-item" onclick="openSubPage('teknisi')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-user-gear"></i></div><span class="grid-label">Teknisi</span></div>
                <div class="grid-item" onclick="openSubPage('jadwal')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-calendar-days"></i></div><span class="grid-label">Jadwal</span></div>
                <div class="grid-item" onclick="openSubPage('laporan')"><div class="grid-icon-wrapper" style="background:#e8f5e9; color:#198754;"><i class="fa-solid fa-file-invoice"></i></div><span class="grid-label">Laporan</span></div>
                <div class="grid-item" onclick="openSubPage('pengaturan')"><div class="grid-icon-wrapper" style="background:#fef3c7; color:#d97706;"><i class="fa-solid fa-gear"></i></div><span class="grid-label">Pengaturan</span></div>
                <div class="grid-item" onclick="Swal.fire('Scan QR', 'Arahkan kamera ke QR Code asset.', 'info')"><div class="grid-icon-wrapper" style="background:#f3e8ff; color:#9333ea;"><i class="fa-solid fa-qrcode"></i></div><span class="grid-label">Scan QR</span></div>
            </div>

            <div class="card">
                <div class="card-title">Grafik Perawatan Gedung Realtime</div>
                <canvas id="chartRealtime" style="max-height: 200px;"></canvas>
            </div>
        </div>

        <div id="sub-page-overlay" class="sub-page">
            <div class="sub-header">
                <button class="btn-icon" onclick="document.getElementById('sub-page-overlay').style.display='none'"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 id="sub-page-title">Detail Page</h2>
            </div>
            <div id="sub-page-content"></div>
        </div>

    </div>

    <!-- Script dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        let db = null;

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('cfg-url').value.trim();
            const key = document.getElementById('cfg-key').value.trim();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                db = supabase.createClient(url, key);
                Swal.fire({ title: 'Menghubungkan ke Supabase...', didOpen: () => Swal.showLoading() });

                const { data, error } = await db.auth.signInWithPassword({ email, password });

                if (error) {
                    Swal.fire('Gagal Login', error.message, 'error');
                } else {
                    Swal.close();
                    document.getElementById('auth-container').style.display = 'none';
                    document.getElementById('app-dashboard').style.display = 'block';
                    document.getElementById('user-email').innerText = data.user.email;
                    document.getElementById('user-avatar').innerText = data.user.email.substring(0, 2).toUpperCase();
                    loadStats();
                }
            } catch (err) {
                Swal.fire('Error API Key', 'Format URL atau API Key Supabase tidak valid!', 'error');
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            location.reload();
        });

        async function loadStats() {
            const { count: cK } = await db.from('kantor').select('*', { count: 'exact', head: true });
            const { count: cA } = await db.from('asset').select('*', { count: 'exact', head: true });
            const { count: cW } = await db.from('work_orders').select('*', { count: 'exact', head: true });

            document.getElementById('stat-kantor').innerText = cK || 0;
            document.getElementById('stat-asset').innerText = cA || 0;
            document.getElementById('stat-wo').innerText = cW || 0;

            const ctx = document.getElementById('chartRealtime').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei'],
                    datasets: [{ label: 'Perawatan', data: [12, 19, 15, 17, 22], backgroundColor: '#198754' }]
                }
            });
        }

        async function openSubPage(page) {
            const overlay = document.getElementById('sub-page-overlay');
            const titleEl = document.getElementById('sub-page-title');
            const contentEl = document.getElementById('sub-page-content');

            titleEl.innerText = page.toUpperCase();
            contentEl.innerHTML = `<p style="text-align:center; padding:20px;">Memuat data ${page}...</p>`;
            overlay.style.display = 'block';

            if (page === 'kantor') {
                const { data } = await db.from('kantor').select('*');
                contentEl.innerHTML = `
                    <div class="table-responsive">
                        <table class="table">
                            <thead><tr><th>Nama</th><th>Alamat</th></tr></thead>
                            <tbody>${data && data.length ? data.map(k => `<tr><td><b>${k.nama}</b></td><td>${k.alamat}</td></tr>`).join('') : '<tr><td colspan="2">Kosong</td></tr>'}</tbody>
                        </table>
                    </div>`;
            } else if (page === 'asset') {
                const { data } = await db.from('asset').select('*');
                contentEl.innerHTML = `
                    <div class="table-responsive">
                        <table class="table">
                            <thead><tr><th>Kode</th><th>Nama</th><th>Status</th></tr></thead>
                            <tbody>${data && data.length ? data.map(a => `<tr><td><b>${a.kode_asset}</b></td><td>${a.nama_asset}</td><td>${a.status}</td></tr>`).join('') : '<tr><td colspan="3">Kosong</td></tr>'}</tbody>
                        </table>
                    </div>`;
            } else {
                contentEl.innerHTML = `<div class="card"><p style="text-align:center;">Menu ${page} terhubung & siap digunakan.</p></div>`;
            }
        }
    </script>
</body>
</html>
