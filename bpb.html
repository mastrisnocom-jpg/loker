<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Management System (BMS)</title>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <style>
        :root {
            --primary-color: #198754;
            --primary-hover: #146c43;
            --primary-light: #e8f5e9;
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --border-color: #dee2e6;
            --sidebar-width: 250px;
            --topbar-height: 65px;
            --radius: 10px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --primary-light: #1b382b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* LOGIN SCREEN */
        #auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), #0d5233);
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        .auth-card p {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--bg-card);
            color: var(--text-main);
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-primary { background-color: var(--primary-color); color: #fff; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--border-color); color: var(--text-main); }
        .btn-danger { background-color: #dc3545; color: #fff; }
        .btn-warning { background-color: #ffc107; color: #000; }
        .btn-info { background-color: #0dcaf0; color: #000; }

        /* APP LAYOUT */
        #app-container {
            display: none;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            height: var(--topbar-height);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-menu {
            list-style: none;
            padding: 15px 10px;
            flex: 1;
            overflow-y: auto;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            color: var(--text-main);
            text-decoration: none;
            border-radius: var(--radius);
            margin-bottom: 4px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background-color: var(--primary-light);
            color: var(--primary-color);
        }

        .main-wrapper {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: var(--topbar-height);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .theme-toggle {
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .content {
            padding: 24px;
            flex: 1;
            padding-bottom: 80px;
        }

        /* COMPONENTS */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .stat-info h3 { font-size: 1.5rem; margin-bottom: 2px; }
        .stat-info p { color: var(--text-muted); font-size: 0.85rem; }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 24px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .table-responsive { width: 100%; overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; text-align: left; }
        .table th, .table td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        .table th { background-color: var(--primary-light); color: var(--primary-color); font-weight: 600; }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .badge-success { background: #d1e7dd; color: #0f5132; }
        .badge-warning { background: #fff3cd; color: #664d03; }
        .badge-danger { background: #f8d7da; color: #842029; }
        .badge-info { background: #cff4fc; color: #055160; }

        .img-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color); }

        /* MOBILE BOTTOM NAV */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            z-index: 100;
            justify-content: space-around;
            padding: 8px 0;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            gap: 4px;
        }

        .bottom-nav-item.active { color: var(--primary-color); }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: var(--radius);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-muted); }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-wrapper { margin-left: 0; width: 100%; }
            .bottom-nav { display: flex; }
        }
    </style>
</head>
<body>

    <!-- AUTH SECTION -->
    <div id="auth-container">
        <div class="auth-card">
            <h2><i class="fa-solid fa-building-user"></i> BMS Login</h2>
            <p>Silakan masuk menggunakan akun Supabase Anda</p>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" class="form-control" placeholder="admin@bms.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="******" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-building-shield"></i> BMS Pro
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" class="nav-link active" data-page="dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li><a href="#" class="nav-link" data-page="kantor"><i class="fa-solid fa-building"></i> Kantor</a></li>
                <li><a href="#" class="nav-link" data-page="asset"><i class="fa-solid fa-boxes-stacked"></i> Asset</a></li>
                <li><a href="#" class="nav-link" data-page="utilitas"><i class="fa-solid fa-bolt"></i> Utilitas</a></li>
                <li><a href="#" class="nav-link" data-page="workorder"><i class="fa-solid fa-clipboard-list"></i> Work Order</a></li>
                <li><a href="#" class="nav-link" data-page="perawatan"><i class="fa-solid fa-screwdriver-wrench"></i> Perawatan</a></li>
                <li><a href="#" class="nav-link" data-page="teknisi"><i class="fa-solid fa-user-gear"></i> Teknisi</a></li>
                <li><a href="#" class="nav-link" data-page="laporan"><i class="fa-solid fa-file-invoice"></i> Laporan</a></li>
            </ul>
        </aside>

        <div class="main-wrapper">
            <!-- TOPBAR -->
            <header class="topbar">
                <h3 id="current-page-title">Dashboard</h3>
                <div class="topbar-right">
                    <i class="fa-solid fa-moon theme-toggle" id="theme-toggle" title="Toggle Mode Dark/Light"></i>
                    <span id="user-email-display" style="font-size: 0.85rem; font-weight: 600;"></span>
                    <button class="btn btn-secondary" id="btn-logout" style="padding: 6px 12px; font-size: 0.8rem;"><i class="fa-solid fa-power-off"></i> Keluar</button>
                </div>
            </header>

            <!-- DYNAMIC CONTENT AREA -->
            <main class="content" id="main-content">
                <!-- Injected via JavaScript -->
            </main>
        </div>

        <!-- MOBILE BOTTOM NAV -->
        <nav class="bottom-nav">
            <a href="#" class="bottom-nav-item active" data-page="dashboard"><i class="fa-solid fa-chart-line"></i><span>Home</span></a>
            <a href="#" class="bottom-nav-item" data-page="kantor"><i class="fa-solid fa-building"></i><span>Kantor</span></a>
            <a href="#" class="bottom-nav-item" data-page="asset"><i class="fa-solid fa-boxes-stacked"></i><span>Asset</span></a>
            <a href="#" class="bottom-nav-item" data-page="workorder"><i class="fa-solid fa-clipboard-list"></i><span>WO</span></a>
            <a href="#" class="bottom-nav-item" data-page="perawatan"><i class="fa-solid fa-screwdriver-wrench"></i><span>Maint</span></a>
        </nav>
    </div>

    <!-- MODAL CONTAINER -->
    <div class="modal" id="app-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h4 id="modal-title">Form Data</h4>
                <button class="close-modal" id="btn-close-modal">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- JavaScript Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        // ==========================================
        // 1. KREDENSIAL SUPABASE
        // ==========================================
        const SUPABASE_URL = "https://pykkfcszdihobpwhqinq.supabase.co";
        const SUPABASE_ANON_KEY = "Sb_publishable_OjVJCDPK0vIV7SEErNxoug_tr-ABUug";
        
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==========================================
        // 2. STATE MANAGEMENT
        // ==========================================
        let currentPage = 'dashboard';
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            checkAuth();
            setupEventListeners();
        });

        // ==========================================
        // 3. AUTHENTICATION MODULE
        // ==========================================
        async function checkAuth() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                document.getElementById('user-email-display').innerText = currentUser.email;
                renderPage(currentPage);
            } else {
                document.getElementById('auth-container').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            Swal.fire({ title: 'Memproses...', didOpen: () => Swal.showLoading() });

            const { data, error } = await db.auth.signInWithPassword({ email, password });

            if (error) {
                Swal.fire('Gagal Login', error.message, 'error');
            } else {
                Swal.fire('Berhasil', 'Selamat datang!', 'success');
                checkAuth();
            }
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await db.auth.signOut();
            checkAuth();
        });

        // ==========================================
        // 4. ROUTING & UI SWITCHER
        // ==========================================
        function setupEventListeners() {
            document.querySelectorAll('[data-page]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    const page = el.getAttribute('data-page');
                    
                    document.querySelectorAll('[data-page]').forEach(item => item.classList.remove('active'));
                    document.querySelectorAll(`[data-page="${page}"]`).forEach(item => item.classList.add('active'));

                    currentPage = page;
                    document.getElementById('current-page-title').innerText = page.toUpperCase();
                    renderPage(page);
                });
            });

            document.getElementById('theme-toggle').addEventListener('click', () => {
                if (document.body.getAttribute('data-theme') === 'dark') {
                    document.body.removeAttribute('data-theme');
                } else {
                    document.body.setAttribute('data-theme', 'dark');
                }
            });

            document.getElementById('btn-close-modal').addEventListener('click', closeModal);
        }

        function closeModal() {
            document.getElementById('app-modal').style.display = 'none';
        }

        function renderPage(page) {
            const container = document.getElementById('main-content');
            container.innerHTML = `<div style="text-align:center; padding: 40px;"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p style="margin-top:10px;">Memuat data...</p></div>`;

            switch (page) {
                case 'dashboard': renderDashboard(container); break;
                case 'kantor': renderKantor(container); break;
                case 'asset': renderAsset(container); break;
                case 'utilitas': renderUtilitas(container); break;
                case 'workorder': renderWorkOrder(container); break;
                case 'perawatan': renderPerawatan(container); break;
                case 'teknisi': renderTeknisi(container); break;
                case 'laporan': renderLaporan(container); break;
                default: container.innerHTML = `<h2>Page ${page}</h2><p>Halaman sedang dikembangkan.</p>`;
            }
        }

        // ==========================================
        // 5. MODUL DASHBOARD
        // ==========================================
        async function renderDashboard(container) {
            const { count: countKantor } = await db.from('kantor').select('*', { count: 'exact', head: true });
            const { count: countAsset } = await db.from('asset').select('*', { count: 'exact', head: true });
            const { count: countWO } = await db.from('work_orders').select('*', { count: 'exact', head: true });
            const { count: countTeknisi } = await db.from('teknisi').select('*', { count: 'exact', head: true });

            container.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fa-solid fa-building"></i></div>
                        <div class="stat-info"><h3>${countKantor || 0}</h3><p>Total Kantor</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fa-solid fa-boxes-stacked"></i></div>
                        <div class="stat-info"><h3>${countAsset || 0}</h3><p>Total Asset</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fa-solid fa-clipboard-list"></i></div>
                        <div class="stat-info"><h3>${countWO || 0}</h3><p>Work Orders</p></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fa-solid fa-user-gear"></i></div>
                        <div class="stat-info"><h3>${countTeknisi || 0}</h3><p>Teknisi</p></div>
                    </div>
                </div>

                <div class="card">
                    <h4><i class="fa-solid fa-chart-bar"></i> Statistik Pemakaian Utilitas (Grafik)</h4>
                    <canvas id="chartUtilitas" style="max-height: 300px; margin-top:15px;"></canvas>
                </div>
            `;

            const ctx = document.getElementById('chartUtilitas').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun'],
                    datasets: [{
                        label: 'Biaya Utilitas (Rp)',
                        data: [1200000, 1900000, 1500000, 2100000, 1800000, 2500000],
                        backgroundColor: '#198754'
                    }]
                },
                options: { responsive: true }
            });
        }

        // ==========================================
        // 6. MODUL KANTOR (CRUD)
        // ==========================================
        async function renderKantor(container) {
            const { data: kantorList } = await db.from('kantor').select('*').order('created_at', { ascending: false });

            container.innerHTML = `
                <div class="page-header">
                    <h2>Daftar Kantor / Gedung</h2>
                    <button class="btn btn-primary" onclick="openFormKantor()"><i class="fa-solid fa-plus"></i> Tambah Kantor</button>
                </div>
                <div class="card">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nama Kantor</th>
                                    <th>Alamat</th>
                                    <th>Penanggung Jawab</th>
                                    <th>Telepon</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${kantorList && kantorList.length > 0 ? kantorList.map(k => `
                                    <tr>
                                        <td><b>${k.nama}</b></td>
                                        <td>${k.alamat}</td>
                                        <td>${k.penanggung_jawab || '-'}</td>
                                        <td>${k.telepon || '-'}</td>
                                        <td>
                                            <button class="btn btn-info" style="padding:4px 8px;" onclick="viewMap('${k.nama}', ${k.latitude}, ${k.longitude})"><i class="fa-solid fa-map-location-dot"></i></button>
                                            <button class="btn btn-danger" style="padding:4px 8px;" onclick="deleteKantor('${k.id}')"><i class="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                `).join('') : `<tr><td colspan="5" style="text-align:center;">Belum ada data kantor.</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.openFormKantor = function() {
            document.getElementById('modal-title').innerText = "Tambah Kantor Baru";
            document.getElementById('modal-body').innerHTML = `
                <form id="form-kantor">
                    <div class="form-group">
                        <label>Nama Kantor</label>
                        <input type="text" id="k-nama" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Alamat</label>
                        <textarea id="k-alamat" class="form-control" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Penanggung Jawab</label>
                        <input type="text" id="k-pj" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Telepon</label>
                        <input type="text" id="k-telepon" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Simpan Kantor</button>
                </form>
            `;
            document.getElementById('app-modal').style.display = 'flex';

            document.getElementById('form-kantor').addEventListener('submit', async (e) => {
                e.preventDefault();
                const payload = {
                    nama: document.getElementById('k-nama').value,
                    alamat: document.getElementById('k-alamat').value,
                    penanggung_jawab: document.getElementById('k-pj').value,
                    telepon: document.getElementById('k-telepon').value
                };

                const { error } = await db.from('kantor').insert([payload]);
                if (!error) {
                    Swal.fire('Berhasil', 'Kantor berhasil ditambahkan', 'success');
                    closeModal();

        window.exportExcel = async function() {
            const { data: assets } = await db.from('asset').select('kode_asset, nama_asset, kategori, status');
            if (!assets || assets.length === 0) return Swal.fire('Peringatan', 'Tidak ada data untuk diekspor', 'warning');

            const worksheet = XLSX.utils.json_to_sheet(assets);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Asset");
            XLSX.writeFile(workbook, "Laporan_Asset_BMS.xlsx");
        };

        window.exportPDF = async function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const { data: kantorList } = await db.from('kantor').select('nama, alamat, penanggung_jawab');
            
            doc.setFontSize(16);
            doc.text("Laporan Data Kantor & Gedung BMS", 14, 20);
            
            doc.setFontSize(10);
            let y = 35;
            kantorList.forEach((k, idx) => {
                doc.text(`${idx + 1}. ${k.nama} - ${k.alamat} (PJ: ${k.penanggung_jawab || '-'})`, 14, y);
                y += 10;
            });

            doc.save("Laporan_Kantor_BMS.pdf");
        };
    </script>
</body>
</html>
